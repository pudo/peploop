# Hungary. Unitary: 19 megyék and Budapest.

tiers: [national, regional]

# Classes the type tree files under government organization or government
# agency that are not government bodies here. None measured: no misfiled
# class among the state actors read 2026-10-17.
not_government: []

# Never candidates here, beyond the global exclusions. Measured 2026-10-17
# from the state actors' P127/P749 reach and the country's live items.
# Köztestület covers the chambers and the academies, which administer
# themselves.
exclude:
  - {qid: Q1126018, name: köztestület}  # 8 live, e.g. Q1301877 Széchenyi Academy of Literature and Arts
  - {qid: Q897399, name: chamber of commerce and industry}  # 6 live, e.g. Q60165998 Budapesti Kereskedelmi és Iparkamara

# State-only legal forms and types, matched exactly as P31 or P1454.
# Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
# statement, then all live items, in brackets. Költségvetési szerv
# (budgetary organ, central and local) and közalapítvány are left out:
# shared with local government.
forms:
  - {qid: Q30570183, kind: institution, name: központi hivatal}  # 3 (9 live)
  - {qid: Q30559398, kind: institution, name: autonóm államigazgatási szerv}  # 2 (4 live)
  - {qid: Q30564537, kind: institution, name: önálló szabályozó szerv}  # 2 (2 live)

roles: []

