# Denmark. Unitary: five regioner. peploop resolves dk to the Danish Realm
# (Q756617), whose subdivisions are Denmark, the Faroes and Greenland;
# Danish items carry P17 Denmark (Q35).

# The polity whose subdivisions are the regional tier: rigour's main QID is
# the realm around it. (All current QIDs count as the country either way.)
state: Q35

tiers: [national, regional]

# Government bodies the type tree misses: Danish ministry items carry their
# P31 only deprecated (modelled as classes through P279) or a class outside
# the government tree, so the agencies under them fell to no_state_owner
# (the 2026-10-18 full run: 30 styrelser). Read from the controllers the
# answers named; each live, P1001 Denmark.
actors:
  - {qid: Q4294734, kind: government, name: Transportministeriet}
  - {qid: Q4294704, kind: government, name: Socialministeriet}
  - {qid: Q3376586, kind: government, name: Indenrigs- og Sundhedsministeriet}
  - {qid: Q20638217, kind: government, name: Udlændinge- og Integrationsministeriet}
  - {qid: Q11989566, kind: government, name: Børne- og Undervisningsministeriet}
  - {qid: Q944762, kind: government, name: Miljøministeriet}
  - {qid: Q3430357, kind: government, name: Ministeriet for Fødevarer, Landbrug og Fiskeri}
  - {qid: Q12341974, kind: government, name: Økonomiministeriet}
  - {qid: Q1438081, kind: government, name: Uddannelses- og Forskningsministeriet}
  - {qid: Q115714352, kind: government, name: Digitaliseringsministeriet}
  - {qid: Q11989565, kind: government, name: Kirkeministeriet}

# Classes the type tree files under government organization or government
# agency that are not government bodies here. None measured: no misfiled
# class among the state actors read 2026-10-17.
not_government: []

# Never candidates here, beyond the global exclusions. Measured 2026-10-17
# from the state actors' P127/P749 reach and the country's live items.
# Prosecution offices are the judiciary's (peploop's), 15 of them reached
# through Rigsadvokaten.
exclude:
  - {qid: Q1092499, name: public prosecutor's office}  # 23 live, e.g. Q11997819 Rigsadvokaten
# Counted among the kept bodies 2026-10-17. Radio channels are no body (DR
# is; TV 2 Danmark is typed a television station, so that class stays);
# police districts are the police's branch offices; government committees
# are the cabinet's (peploop's).
  - {qid: Q14350, name: radio station}  # 10 kept, e.g. Q1796582 DR P1
  - {qid: Q4992061, name: police district}  # 10 kept, e.g. Q11982824 Københavns Politi
  - {qid: Q74562105, name: government committee}  # 4 kept, e.g. Q135443524 Regeringens koordinationsudvalg

# State-only legal forms and types, matched exactly as P31 or P1454.
# Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
# statement, then all live items, in brackets. Measured with P17 = Denmark
# (Q35): the formed and typed lanes query P17 = Q756617 and find almost
# nothing until the state is Q35.
forms:
  - {qid: Q21268738, kind: institution, name: statslig administrativ enhed}  # 29 (131 live)
  - {qid: Q23000150, kind: enterprise, name: selvstændig offentlig virksomhed}  # 2 (8 live)
  - {qid: Q111628618, kind: institution, name: dansk styrelse}  # 10 (63 live)

roles: []

