# Poland. Unitary: 16 województwa, whose self-government is the regional
# tier.

tiers: [national, regional]

# Classes the type tree files under government organization or government
# agency that are not government bodies here. Volunteer fire brigades,
# historic German public-law corporations in Polish territory, and Frontex
# in Warsaw are filed as government bodies.
not_government:
  - {qid: Q15734684, name: Körperschaft des öffentlichen Rechts}  # 24 live, e.g. Q107138990 Bank der Danzig-Westpreußischen Landschaft
  - {qid: Q55289175, name: Ochotnicza Straż Pożarna w Polsce}  # 287 live, e.g. Q134777071 Ochotnicza Straż Pożarna Wisła-Malinka
  - {qid: Q112827555, name: decentralised agency of the European Union}  # 1 live, e.g. Q21786841 European Border and Coast Guard Agency

# Never candidates here, beyond the global exclusions. Measured 2026-10-17
# from the state actors' P127/P749 reach and the country's live items.
# Frontex is the EU's; the chambers of commerce administer themselves.
exclude:
  - {qid: Q112827555, name: decentralised agency of the European Union}  # 1 live, e.g. Q21786841 European Border and Coast Guard Agency
  - {qid: Q897399, name: chamber of commerce and industry}  # 8 live, e.g. Q9344175 Staropolska Izba Przemysłowo-Handlowa

# State-only legal forms and types, matched exactly as P31 or P1454.
# Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
# statement, then all live items, in brackets. Przedsiębiorstwo państwowe is
# in the Q270791 tree. Jednostka budżetowa and archiwum państwowe are left
# out.
forms:
  - {qid: Q9367288, kind: institution, name: urząd centralny}  # 25 (34 live)
  - {qid: Q9264560, kind: institution, name: państwowy fundusz celowy}  # 0 (14 live)
  - {qid: Q11815270, kind: institution, name: państwowy instytut badawczy}  # 0 (11 live)
  - {qid: Q11684602, kind: institution, name: agencja wykonawcza}  # 1 (3 live)

roles: []

# Official list of central-government holdings. No list article to resolve
# QIDs from reliably: entries left empty.
holdings:
  - source: "Ministerstwo Aktywów Państwowych, wykaz spółek z udziałem Skarbu Państwa, https://www.gov.pl/web/aktywa-panstwowe"
    entries: []
