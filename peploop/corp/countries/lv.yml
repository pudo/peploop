# Latvia. Unitary: 43 local governments, the only subdivisions, which
# peploop counts first-level.

tiers: [national, regional]

# Classes the type tree files under government organization or government
# agency that are not government bodies here. None measured: no misfiled
# class among the state actors read 2026-10-17.
not_government: []

# Never candidates here, beyond the global exclusions. Measured 2026-10-17
# from the state actors' P127/P749 reach and the country's live items. None
# measured.
exclude:
  - {qid: Q897399, name: chamber of commerce and industry}  # 1 live, e.g. Q103820404 Amerikas Tirdzniecības palāta Latvijā
  - {qid: Q10729872, name: medical association}  # 1 live, e.g. Q106114302 Latvian Medical Association
# Dry load 2026-10-17: channels and stations; the broadcaster (LSM) stays.
  - {qid: Q1616075, name: television station}  # e.g. Q4042491 LTV1
  - {qid: Q14350, name: radio station}  # e.g. Q18615317 Latvijas Radio 5
  - {qid: Q3914, name: school}  # 6 kept, e.g. Q58465397 Nacionālā Mākslu vidusskola

# State-only legal forms and types, matched exactly as P31 or P1454.
# Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
# statement, then all live items, in brackets. Pastarpinātās pārvaldes
# iestāde (508, municipal libraries and schools among them) and atvasināta
# publiska persona (municipalities, universities) are left out.
forms:
  - {qid: Q110855268, kind: institution, name: direct regulatory authority}  # 6 (96 live)

roles: []

