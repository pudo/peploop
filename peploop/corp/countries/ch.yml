# Switzerland. Federal: 26 cantons, whose holdings and bodies (cantonal
# banks, cantonal hospitals, cantonal utilities) are the regional tier;
# communes are municipal and not written.

tiers: [national, regional]

# The parliament, as the body that elects and oversees statutory bodies
# (named as controller in the 2026-10-18 answers).
actors:
  - {qid: Q684719, kind: government, name: Federal Assembly of Switzerland}

# Classes the type tree files under government organization or government
# agency that are not government bodies here. Read from the state actors
# 2026-10-17: a collegiate chapter (Q18019059 Kollegiatstift St. Michael) is
# a religious community. (Intergovernmental organisations, which Geneva's
# carry Switzerland as country, are excluded globally.)
not_government:
  - {qid: Q2742167, name: religious community}  # 1 state actor, Q18019059 Kollegiatstift St. Michael

# Never candidates here, beyond the global exclusions. Counted among the
# kept bodies 2026-10-17. Parliamentary committees are the legislature's (peploop's); radio channels
# are no body (the broadcaster is); a Gymnasium's rector is no senior
# official.
exclude:
  - {qid: Q2986700, name: parliamentary committee}  # 1 kept, Q111568242 Aussenpolitische Kommissionen
  - {qid: Q14350, name: radio station}  # 2 kept, e.g. Q1648398 Radio Swiss Jazz
  - {qid: Q55043, name: gymnasium}  # 2 kept, e.g. Q689852 Gymnasium Alpenstrasse

# State-only legal forms and types, matched exactly as P31 or P1454.
# Measured 2026-10-17: live items with P17 Switzerland, with any seat
# statement in brackets. Left out: cantonal authority (Q113032545, 189 live:
# mostly cantonal departments, governments, parliaments and courts, which
# are peploop's), government agency of Switzerland (Q113025511, 67 live:
# federal offices and extra-parliamentary commissions, reached by the owned
# and parented lanes) and the generic public-law institution (Q570208, 8
# live: fare networks).
forms:
  - {qid: Q89651843, kind: institution, name: Anstalt des öffentlichen Rechts (Schweiz)}  # P1454, 48 live (7): SBB, FINMA, Swissmedic, Suva, cantonal banks and hospitals, utilities
  - {qid: Q665634, kind: enterprise, name: Kantonalbank}  # P31, 25 live: every cantonal bank
  - {qid: Q1005418, kind: institution, name: Bundesamt (Schweiz)}  # P31, 34 live

roles: []

# The Confederation's own portfolio: the 22 units the Federal Council steers
