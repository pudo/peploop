# Germany. The prototype country: federal and Land holdings, Landesbanken
# in; Sparkassen and municipal enterprises later (municipal tier not written).

tiers: [national, regional]

# Classes the type tree files under government organization that are not
# government bodies here.
not_government:
  - {qid: Q15734684, name: Körperschaft des öffentlichen Rechts}  # chambers, churches, universities, municipalities

# Never candidates here: municipal savings banks (a later tier) and the
# professional chambers and associations, which administer themselves.
exclude:
  - {qid: Q13601825, name: Sparkasse}
  - {qid: Q1515218, name: Kassenärztliche Vereinigung}
  - {qid: Q2948379, name: Handwerkskammer}
  - {qid: Q897399, name: Industrie- und Handelskammer}

# State-only legal forms and types, matched exactly as P31 or P1454. Measured
# 2026-10-17: German items with any seat statement in brackets. Körperschaft
# des öffentlichen Rechts and gemeinnützige GmbH are left out: too broad.
forms:
  - {qid: Q1802122, kind: institution, name: Landesbehörde}  # 106
  - {qid: Q99934885, kind: institution, name: Bundesoberbehörde}  # 38
  - {qid: Q1005420, kind: institution, name: Bundesamt}  # 19
  - {qid: Q314024, kind: institution, name: Bundesbehörde}  # 16
  - {qid: Q67207116, kind: institution, name: Anstalt des öffentlichen Rechts}  # 52
  - {qid: Q20050667, kind: institution, name: Stiftung des öffentlichen Rechts}  # 27
  - {qid: Q1507070, kind: institution, name: Landesbetrieb}  # 2

roles: []

