# Austria. Federal: nine Bundesländer, whose holdings and bodies are the
# regional tier.

tiers: [national, regional]

# Government bodies the type tree misses, read from the controllers the
# 2026-10-18 answers chose.
actors:
  - {qid: Q1501755, kind: government, name: Generaldirektion für die öffentliche Sicherheit}

# Classes the type tree files under government organization or government
# agency that are not government bodies here. Chambers, churches and fire
# brigades carry these classes; three Wirtschaftskammern typed Industrie-
# und Handelskammer are state actors without it (Q14859362).
not_government:
  - {qid: Q1796671, name: Körperschaft des öffentlichen Rechts (Österreich)}  # 41 live, e.g. Q98640761 Versorgungsanstalt des österreichischen Notariates
  - {qid: Q15734684, name: Körperschaft des öffentlichen Rechts}  # 13 live, e.g. Q107102817
  - {qid: Q897399, name: chamber of commerce and industry}  # 11 live, e.g. Q14859362

# Never candidates here, beyond the global exclusions. Measured 2026-10-17
# from the state actors' P127/P749 reach and the country's live items.
# Savings banks belong to their foundations or municipalities; the chambers
# and social insurers administer themselves.
exclude:
  - {qid: Q157963, name: savings bank}  # 31 live, e.g. Q1118950 Sparkasse Rattenberg
  - {qid: Q897399, name: chamber of commerce and industry}  # 11 live, e.g. Q1203098 Deutsche Handelskammer in Österreich
  - {qid: Q15855960, name: Ärztekammer}  # 1 live, e.g. Q136375090 Ärztekammer für Salzburg
  - {qid: Q59155876, name: Landwirtschaftskammer}  # 1 live, e.g. Q1804786 Landwirtschaftskammer (Österreich)
  - {qid: Q635047, name: Architektenkammer}  # 1 live, e.g. Q134519736 Ingenieur- und Architektenkammer Wien
  - {qid: Q563787, name: health insurance company}  # 3 live, e.g. Q53939971 Österreichische Gesundheitskasse
  - {qid: Q2306006, name: Sozialversicherungsträger}  # 1 live, e.g. Q63808458 Sozialversicherungsanstalt der Selbständigen
  # A permanent mission is diplomatic, its head an ambassador (peploop's);
  # the class is not under diplomatic mission in the type tree.
  - {qid: Q2360219, name: permanent mission}  # 4 kept 2026-10-17, e.g. Q15849545 Ständige Vertretung Österreichs bei der EU

# State-only legal forms and types, matched exactly as P31 or P1454.
# Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
# statement, then all live items, in brackets. Körperschaft des öffentlichen
# Rechts (chambers, churches, fire brigades) and Fonds des öffentlichen
# Rechts (a chamber's school fund among them) are left out: not state-only.
forms:
  - {qid: Q89651395, kind: institution, name: Bundesanstalt öffentlichen Rechts}  # 0 (4 live)
  - {qid: Q1008763, kind: institution, name: Bundestheater}  # 0 (1 live)

roles: []

