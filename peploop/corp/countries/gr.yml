# Greece. Unitary: 13 periphéries with elected regional government, and
# Mount Athos.

tiers: [national, regional]

# Classes the type tree files under government organization or government
# agency that are not government bodies here. None measured: no misfiled
# class among the state actors read 2026-10-17.
not_government: []

# Never candidates here, beyond the global exclusions. Measured 2026-10-17
# from the state actors' P127/P749 reach and the country's live items. The
# bar, the medical association and the chambers administer themselves.
exclude:
  - {qid: Q897399, name: chamber of commerce and industry}  # 3 live, e.g. Q104884272 German-Greek Chamber of Industry and Commerce
  - {qid: Q1865205, name: bar association}  # 1 live, e.g. Q112672185 Δικηγορικός Σύλλογος Αθηνών
  - {qid: Q10729872, name: medical association}  # 2 live, e.g. Q106114250 Panhellenic Medical Association
# ERT's individual radio and television channels and regional stations; ERT
# itself is typed a broadcaster and stays. Measured 2026-10-17 among the
# kept candidates.
  - {qid: Q14350, name: radio station}  # 27 kept, e.g. Q16918908 First Programme (ERT)
  - {qid: Q1616075, name: television station}  # 3 kept, e.g. Q2613501 ERT3
  - {qid: Q561068, name: specialty channel}  # 2 kept, e.g. Q2052941 ERT World
# Professional chambers typed regulatory college, which administer
# themselves (the Technical Chamber got P749 to the supervising ministry).
  - {qid: Q1110684, name: regulatory college}  # Q61355745 Τεχνικό Επιμελητήριο Ελλάδας
# The police, whose chiefs are officers and peploop's.
  - {qid: Q35535, name: police}  # Q2657799 Hellenic Police

# State-only legal forms and types, matched exactly as P31 or P1454.
# Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
# statement, then all live items, in brackets. Νομικό Πρόσωπο Δημοσίου
# Δικαίου (bar associations, chambers, municipal agencies) and the Ephorates
# of Antiquities (ministry branches without boards) are left out.
forms:
  - {qid: Q25536112, kind: institution, name: ανεξάρτητη διοικητική αρχή}  # 0 (2 live)

roles: []

