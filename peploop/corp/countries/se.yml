# Sweden. Unitary: 21 län, whose regions are the regional tier.

tiers: [national, regional]

# Items standing in the state's place, and government bodies the type tree
# misses, read from the controllers the 2026-10-18 answers chose: the
# Swedish State as legal person, two ministries, and two regions (the
# regional self-government, the tier pepcorp writes).
actors:
  - {qid: Q31930745, kind: state, name: Svenska staten}
  - {qid: Q1780898, kind: government, name: Klimat- och näringslivsdepartementet}
  - {qid: Q2612001, kind: government, name: Miljödepartementet}
  - {qid: Q3233447, kind: government, name: Region Västra Götaland}
  - {qid: Q374794, kind: government, name: Region Gotland}

# Classes the type tree files under government organization or government
# agency that are not government bodies here. None measured: no misfiled
# class among the state actors read 2026-10-17.
not_government: []

# Never candidates here, beyond the global exclusions. Measured 2026-10-17
# from the state actors' P127/P749 reach and the country's live items. Open
# data portals (220, 59 reached) are no body.
exclude:
  - {qid: Q27031827, name: open data portal}  # 220 live, e.g. Q101096527 Solnas  Öppna Data portal
  - {qid: Q897399, name: chamber of commerce and industry}  # 3 live, e.g. Q10517084 Handelskammaren i Gävle
# Counted among the kept bodies 2026-10-17: a lighthouse is no body.
  - {qid: Q39715, name: lighthouse}  # 4 kept, e.g. Q1518751 Kullens fyr
# A prison is a local office of the Prison and Probation Service: its
# governor is no senior official (the full run wrote one).
  - {qid: Q40357, name: prison}  # 2 kept, e.g. Q1797668 Anstalten Kumla

# State-only legal forms and types, matched exactly as P31 or P1454.
# Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
# statement, then all live items, in brackets. Statlig utredning (state
# inquiries, temporary) is left out. Statlig enhet is not under organization
# in the type tree; the formed lane keeps it anyway.
forms:
  - {qid: Q68295960, kind: institution, name: Swedish government agency}  # 17 (250 live)
  - {qid: Q108514063, kind: institution, name: statlig enhet}  # 17 (240 live)

roles: []

# Official list of central-government holdings: the companies the state
