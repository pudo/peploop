# Regression set for the EU + CH re-run of 2026-10-19/20: the precision
# samples' wrong and doubtful lines, the pilot's cases, the freeze audit's
# founding cases and lines judged correct.
#
# A case names a body (cc, qid) and either a statement (prop, value; value
# "*" is any) or, without prop, the body's gate. `expect` is `write`,
# `skip` (anything but written), a rule, or a list of these; for a gate,
# `pass`, `gated` or the gate's rule. `dated` asks a written seat to carry
# a date; `forbid` names qualifier dates a written line must not carry.

