# Wikipedia categories seeding the Trinidad and Tobago run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no Trinidad and Tobago entry, so every
# entry below is measured here and nothing is inherited. Counts are people
# with a Wikidata item typed Q5, walked through the MediaWiki category API on
# 2026-10-03 because PetScan was not answering; each with its marginal over
# the entries above it. The whole seed is ~340 distinct people.
#
# en.wikipedia is the country's own wiki and the only one with a tree: one
# container per tier (`Political office-holders in Trinidad and Tobago`, 13
# subcats), a portfolio container for the ministers, both chambers with their
# presiding officers, the chief justices, the central-bank governors, the
# mayors, and 25 ambassadorship subcats.
#
# The current era is the republic under the 1976 constitution: the President
# replaced the Governor-General (the presidency item `Q2522739` carries P571
# 1976-09-24), the first Republican Parliament sat that year, and every office
# the loop records -- the presidency, the two chambers' presiding officers, the
# Tobago House of Assembly (1980) -- dates from it or later. The Prime Minister
# and the chambers predate it (1962) but are the same offices. No category has
# a per-period or per-century child below the tier, so the era cannot be chosen
# by category: the tiers are seeded whole, the scope gate drops the dead at
# fetch, and `policy.P39_MAX_ENDED_YEARS` skips the tenures that ended long ago.
# What is left out is what the 1976 constitution ended: `Members of the
# Legislative Council` (24, 3 new, 1 living: colonial), `Governors of Trinidad
# and Tobago` and `Governors-general` (colonial and pre-1976), `Members of the
# Federal Parliament of the West Indies Federation` (19, 14 new, none living),
# `Solicitors general` (3, 2 new, none living), `Carib Queens`, and
# `20th-century Trinidad and Tobago politicians` (47, 10 new, 11 living).
# Also out: `Trinidad and Tobago businesspeople` (28, 15 new: not office
# holders), `judges of international courts and tribunals` (6, 4 new: not the
# state's offices), `city councillors` (1, dead), `civil servants` (3, 3 new,
# 1 living), `lawyers` (9, 1 new) and `Attorneys general of British Trinidad
# and Tobago` (the colonial subcategory, hence depth 0 on the AGs).

# --- Head of state and government ---
- category: Presidents_of_Trinidad_and_Tobago                 # 7, 3 living; d1 is the elections
  lang: en
  depth: 0
- category: Prime_ministers_of_Trinidad_and_Tobago            # 8, 7 new; d1 is Patrick Manning's eponymous category
  lang: en
  depth: 0

