# Wikipedia categories seeding the Malaysia run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml names three Malaysia entries
# (`Government_ministers_of_Malaysia`, `Federal_political_office-holders_in_Malaysia`,
# `Political_office-holders_in_Malaysia`); the tiers below are those containers
# opened up and measured. Counts are people with a Wikidata item, walked through
# the MediaWiki category API on 2026-10-06 because PetScan was not answering
# (so institutions are still in, and fetch's Q5 check removes them); each with
# its marginal over the entries above it. The whole seed is ~2,600 distinct
# people.
#
# en.wikipedia carries the regular tree: one container per tier, the ministers
# by portfolio, the Dewan Rakyat per term, the 13 state assemblies, the state
# executive councils and chief ministers, the rulers and governors, and 50
# ambassadorship subcats. ms.wikipedia adds what en has no category for -- the
# political and parliamentary secretaries and the chairmen of federal agencies
# (+161 under the federal container, +110 under the state one) -- while its
# per-term parliament categories add 14 people over en's and are left out.
#
# The current era is chosen two ways. The Dewan Rakyat is seeded by term from
# the 12th Parliament (2008) on: earlier terms are per-period categories of
# the past. Every other tier has no per-period child and is seeded whole, the
# scope gate dropping the dead at fetch and `policy.P39_MAX_ENDED_YEARS`
# skipping the tenures that ended long ago. That includes the rulers
# (`Monarchs_of_Malaysia`, 122, mostly dead sultans and the Rajas of Singapore):
# a ruler is head of a state and the current nine are PEPs; the royal houses
# beyond the rulers are a kinship lane and not seeded.
#
# Left out: `Malaysian_MPs_1959–1964` to `2004–2008` (history),
# `Malaysian_politicians_by_party` (45 parties; party membership is not
# office), `Politicians_from_*` (birthplace), `Mothers_of_Malaysian_monarchs`,
# `Malaysian_royal_consorts` beyond the queens, `British_Malaya_judges` and
# `British_Borneo_judges` (colonial), `20th-century_Malaysian_judges` (36, the
# chief justices and the Court of Appeal already reach the living apex), and
# `Malaysian_police_officers` beyond the chiefs (rank and file).

