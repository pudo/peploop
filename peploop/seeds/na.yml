# Wikipedia categories seeding the Namibia run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no Namibia entry, so every entry below
# is measured here (PetScan, 2026-10-16) and nothing is inherited. Counts are
# distinct sitelinked items reached, then how many no earlier entry reached;
# a list article's count is its links, people among them. The whole seed is
# ~630 candidates.
#
# en.wikipedia is the regular wiki: `Political office-holders in Namibia`
# holds the presidents, 31 portfolio subcats, both chambers (the National
# Assembly by term), the regional governors by region, and the mayors.
#
# The current era is the November 2024 election: the 8th National Assembly's
# list article and the Cabinet article (Nandi-Ndaitwah's, March 2025) reach
# the newcomers; the National Assembly's term subcats reach back to 1990,
# which the scope gate takes at fetch.
#
# Left out: `Leaders of bantustans in South West Africa` (pre-1990);
# `People's Liberation Army of Namibia personnel` (83, liberation-war
# fighters, not office-holders); `Independent Patriots for Change`,
# `Affirmative Repositioning`, `21st-century women politicians` and the
# Air Force marshals (0 new).

