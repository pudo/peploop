# Wikipedia categories seeding the Colombian run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml carries ten `country: co` entries: three en
# categories, es `Senadores`, `Diputados`, `Vicepresidencia`, `Políticos de
# Colombia`, and two it has retired because their members were born before
# 1920 (the presidents, the mayors of Bogotá). Those retirements are
# OpenSanctions' reasons; here the scope gate discards the dead at fetch for
# free, so both categories are in for their living members.
#
# es.wikipedia's tree is regular: one parent per tier, a subcategory per
# legislative period (Senate 1930–2030, Chamber 1931–2026), per portfolio, per
# department, per city. The entries below are the *current era's*: the loop
# records who holds office now, so the 21st-century periods rather than the
# century categories, the current portfolios rather than the parent whose
# depth-2 tree adds thirteen defunct ones, and no constituent assembly of 1991,
# no civil-war generals, no `Políticos de Colombia` at depth 3 (2,465 members,
# 294 of them not reached below, nearly all history). Counts are PetScan's on
# 2026-09-30; the whole tree would be ~2,900 people, this is ~2,300.

# --- Head of state and government ---
- category: Presidentes_de_Colombia                # 109 pages, every president
  lang: es
  depth: 0
- category: Vicepresidentes_de_Colombia            # 18
  lang: es
  depth: 0

