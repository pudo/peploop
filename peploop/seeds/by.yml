# Wikipedia categories seeding the Belarusian run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml carries fourteen `country: by` entries, all
# English: the office-holders and government containers, the prime ministers,
# deputy prime ministers and nine portfolios, every one of them 2-35 people.
# The English tree is the thin one here. be.wikipedia is the regular wiki: one
# category per portfolio *of the Republic* (`Міністры X Рэспублікі Беларусь`,
# so the BSSR and BNR ministers sit in their own siblings), one per convocation
# of each chamber (1st-8th), one per oblast and city executive committee, one
# per embassy (121), and the apex courts, prosecutors, KGB, Security Council,
# National Bank and the All-Belarusian People's Assembly presidium. ru is
# flatter: its chambers are single all-convocation bags (`Депутаты Палаты
# представителей (Беларусь)` 143, `Члены Совета Республики (Беларусь)` 93) and
# `Министры Беларуси` at depth 1 adds 73 people to be's ministers, 69 of them
# Soviet commissars; so ru is seeded only where it adds a tier be lacks.
#
# The current era is the Republic under the 1994 Constitution as rebuilt by
# the November 1996 referendum -- the bicameral National Assembly in place of
# the Supreme Soviet, the presidential vertical of executive committees -- and
# as last amended by the February 2022 referendum, which made the
# All-Belarusian People's Assembly a constitutional organ (first convened April
# 2024). The single-office categories are the Republic's own and are seeded
# whole: the scope gate sets the dead aside at fetch, and the policy skips a
# tenure ended long ago. The chambers are seeded by convocation, and only the
# 8th (2024-, the first elected under the 2022 text) and the 7th (2019-2024,
# its predecessors, which is what lets a seat of many pass the mint floor).
# Left out: the 1st-6th convocations (the 6th would add 51 + 23 people whose
# seats ended in 2019), the Supreme Soviet and its chairs (pre-1996), the BSSR,
# BNR and Litbel trees, the ru all-convocation chamber bags (+40, +31, history),
# ru `Министры Беларуси` (+4 net of the commissars), ru `Послы Беларуси` (+4),
# ru `Сотрудники Администрации президента` (+1), ru `Члены Совета министров`
# (+0), en `Political_office-holders_in_Belarus` (+62: the BDR Rada and the
# Supreme Council), and the deputy chairs of the executive committees (+16).
# Counts are PetScan's on 2026-10-02 (people with a Wikidata item), each with
# its marginal over the entries above it: ~1,560 distinct.

