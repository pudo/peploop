# Wikipedia categories seeding the Dominican run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no `country: do` entry, so every entry
# below is measured here and nothing is inherited. Sizes are distinct
# sitelinked pages per entry and the running distinct total, read through the
# MediaWiki API on 2026-10-03 (PetScan was hanging that day); they count pages
# rather than humans, so PetScan's `P31 = Q5` filter makes each a little
# smaller.
#
# Both trees are thin and neither is regular. es.wikipedia is the main wiki
# and carries the bulk of the people, but flat: `Políticos de la República
# Dominicana` is one bag of 223 pages, the cabinet is a 28-page `Ministros de
# República Dominicana` with a single portfolio subcategory, the Senate and
# Chamber categories hold 9 and 15 pages, and the naming is inconsistent
# ("de República Dominicana" beside "de la República Dominicana"). en.wikipedia
# adds a tier es lacks -- the portfolio subcategories under `Government
# ministers`, the presidents of both chambers, the Central Bank governors, the
# provincial governors, 29 ambassadorship subcategories -- but is small too.
#
# The current era is the 2010 constitution (proclaimed 26 January 2010): it
# created the Constitutional Tribunal, the Superior Electoral Court and the
# present Consejo Nacional de la Magistratura, renamed the Secretarías de
# Estado to Ministerios, and every institution the loop records today is its
# creature. The 2015 amendment (presidential re-election) and the 2024 reform
# (term limits locked, the Procurador's appointment changed from 2028) moved no
# office into or out of existence, so neither is the cut. No category on
# either wiki is per period or per century below the tier (the en
# `21st-century` bag is 36 pages), so the era cannot be chosen by category:
# every tier is seeded whole, the scope gate drops the dead at fetch, and
# `policy.P39_MAX_ENDED_YEARS` (20) skips tenures that ended before ~2006,
# which is the 2010 order give or take one legislature.
#
# Left out: `Instituciones gubernamentales` (50 pages, institutions, not
# people), `Gobernadores coloniales de Santo Domingo`, `Políticos asesinados`
# and en `19th-century Dominican Republic politicians` (history), and the en
# entries that add nothing below: `Presidents of political parties` (19, 0
# new), `Dominican Republic politician stubs` (62, 0 new), `Candidates for
# President` (19, 2 new). The whole tree is ~575 pages; this is ~550.

