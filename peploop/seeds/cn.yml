# Wikipedia categories seeding the China run: one PetScan query per entry.
#
# Measured 2026-10-16 on zh.wikipedia, which carries every tier as a category
# per office (the English tree has the national leadership and a few
# provinces). Each entry gives the people PetScan returned and its marginal
# over the entries above it; the whole seed is ~11,300 distinct people, most
# of them former holders, since the per-office categories run back to 1949.
#
# Scope: the national Party and state leadership, the 20th Central Committee
# and its discipline commission, the 14th NPC and CPPCC, the State Council's
# ministerial and vice-ministerial officials, the apex courts, the central
# bank, ambassadors and the PLA's generals; the 31 mainland provincial units'
# leaders, deputy secretaries, vice governors, discipline secretaries, high
# court presidents and the congress and CPPCC vice chairs; and in 32 major
# cities (the 15 sub-provincial cities and the other 17 provincial capitals;
# the four municipalities are provincial units above) the Party secretary
# and deputy secretaries, the mayor, and the congress and CPPCC chairs.
#
# Left out: Hong Kong and Macau (runs of their own), every other prefecture
# and everything below it (the per-city 政治人物 categories carry district
# secretaries and are not seeded), the per-province 政府官员 trees (department
# heads), and the provincial procurators (no category family).


