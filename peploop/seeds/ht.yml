# Wikipedia categories seeding the Haitian run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no Haiti entry, so every entry below is
# measured here (2026-10-03) and nothing is inherited. PetScan did not answer
# during the measurement, so the counts are the MediaWiki API's own category
# walk at the same depth: distinct sitelinked items, then how many of them no
# earlier entry reached, then how many of those are human with no P570.
#
# Haiti is a small corpus on every wiki, and a mostly historical one: the whole
# tree below is ~560 items, ~255 of them living. fr.wikipedia is the main wiki
# and carries the tiers (presidents, prime ministers, 25 portfolio
# subcategories, Senate presidents, ambassadors by post) plus one flat bag,
# `Personnalité politique haïtienne`, that holds four of the seven voting
# members of the Transitional Presidential Council and nothing else does.
# en.wikipedia adds the legislature (both chambers and their presidents, which
# fr has as two pages), the BRH governors and the police chiefs. ht.wikipedia
# adds ~39 living people through `Politisyen ayisyen` that neither other wiki
# categorises (mostly ht-only stubs: deputies, a few ministers); its other trees
# (`Prezidan Ayiti`, `Minis ayisyen`, `Premye Minis ayisyen`, `Gouvènman an
# Ayiti`) add no one, and `Politik nan Ayiti` adds 21 non-people.
#
# The era. No elected president since July 2021, and no sitting parliament
# since the last third of the Senate lapsed on 10 January 2023. The
# Transitional Presidential Council (CPT, Q124846311) held the presidency
# collegially from 25 April 2024 to 7 February 2026, when its mandate ended
# and executive power passed to the Council of Ministers under Prime Minister
# Fils-Aimé (in office since 11 November 2024), confirmed by the "Pacte
# national" of 21-22 February 2026 and reshuffled on 2 March 2026. So the
# current era is the Fils-Aimé government, the CPT is the executive that ended
# eight months ago, and the 1987 constitution's offices (president, both
# chambers, the courts) stay the frame. Neither wiki has a per-period category
# below a tier (the fr `du XXIe siècle` bag is 7 pages), so the era cannot be
# chosen by category: every tier is seeded whole, the scope gate drops the
# dead at fetch (about half of every presidential and ministerial category)
# and `policy.P39_MAX_ENDED_YEARS` skips the old tenures.
#
# Left out: fr `Personnalité politique haïtienne du XXe siècle` (22, 5 new, 0
# living) and `… assassinée` (12, 7 new, all dead); en `Presidents_of_Haiti`
# (61, 0 new), `Prime_ministers_of_Haiti` (30, 0 new),
# `Vice_presidents_of_Haiti` (3, none living), `Haitian_judges` (9, 1 new,
# dead), `Haitian_bankers` (0 new), `Haitian_lawyers` (32, 1 living new, not a
# tier), `Candidates_for_President_of_Haiti` (72, 2 living new, candidacy is no
# office), `Haitian_politician_stubs` (95, 2 new, dead); ht `Politik nan
# Ayiti` (21 new, all non-human) and the other ht trees (0 new). There is no
# category for the CPT's members on any wiki.

