# Wikipedia categories seeding the Angola run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no Angola entry, so every entry below
# is measured here (PetScan, 2026-10-16) and nothing is inherited. Counts are
# distinct sitelinked items reached, then how many no earlier entry reached;
# a list article's count is its links, people among them. The whole seed is
# ~520 candidates.
#
# Neither wiki is regular on its own. en.wikipedia carries the cabinet (35
# portfolio subcats, the Cabinet article) and the ambassadors;
# pt.wikipedia's `Políticos de Angola` carries the deputies, the party
# members and the century bags, with only four portfolio subcats. Both are
# seeded, en first.
#
# The current era is the 2022 election's 5th National Assembly and
# Lourenço's second government. No category of provincial governors exists
# on either wiki; their holders are on Wikidata already (18 governor items
# with holder statements), and only Cabinda's pt list article reaches them.
#
# Left out: `Angolan rebels`, `Angolan warlords` and `Revolucionários de
# Angola` (civil-war figures); `FNLA` members (6, history); `Politicians from
# Luanda` (birthplace bag); `Governors of the Bank of Angola` and
# `21st-century Angolan women politicians` (0 new).

