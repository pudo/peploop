# Wikipedia categories seeding the Cuban run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no `country: cu` entry at all; Cuba is
# reached there only through `Political_office-holders_in_North_America` at
# depth 8. So every entry below is measured here, nothing is inherited.
#
# Cuba inverts the runbook's expectation about which wiki is regular. es's
# `Políticos de Cuba` (223 pages, 32 subcats) is one flat bag whose subcats
# are mostly the 1902–1959 republic (Secretarios de despacho, Senadores,
# Cámara de Representantes), the Spanish Cortes (Diputados por el distrito
# electoral de …, Senadores de España de la Restauración), the colonial
# governors (Gobernantes de Cuba → Capitanes generales, four per-century
# subcats) and 76 dissidents. There is no es category for the Council of
# State, the Central Committee, the ministers by portfolio, the provincial
# governors, the vice presidents or the central bank. en.wikipedia has the
# tiered tree instead: `Government_ministers_of_Cuba` with 20 portfolio
# subcats, `Governors_of_provinces_of_Cuba` (the 2020 governors, all eight
# living), `Members_of_the_National_Assembly_of_People's_Power`,
# `Vice_presidents_of_Cuba`, `Deputy_prime_ministers_of_Cuba`, 48 outbound
# ambassadorships. So the English tree is seeded at depth 1 where it is the
# container, not depth 0 only.
#
# The current era is the 2019 constitution: presidency, prime minister since
# 2019, Council of State, ANPP X Legislatura (2023–2028), provincial governors
# since 2020, the PCC Politburo and Central Committee. es has per-legislature
# ANPP categories (I–IX) but no X, and VIII and IX hold one page each; the
# `Nth Central Committee` en categories hold only list articles (PetScan
# returns 0 people). Left out: `Políticos_de_Cuba` at depth 1 (+97 people, 34
# of them living: dissidents, the Estefans, a Spanish politician) and depth 2
# (+193), `Militares_de_Cuba` (275, independence-war officers, 15 living new
# and undated), `Gobernantes_de_Cuba` (colonial), `Cuban_politicians` at depth
# 1 (+85, living ones are Cuban-American US politicians and dissidents),
# `Cuban_revolutionaries` (143), `Disidentes_de_Cuba` / `Cuban_dissidents`
# (70 / 89, not PEPs), `Colonial_heads_of_Cuba` (47), and the eponymous
# `Fidel Castro` / `Che Guevara` / `Silvio Rodríguez` categories that sit one
# level under the party, president and legislature categories on both wikis
# (family members, films, places) — which is why every entry that has one as
# a child is depth 0. Counts are PetScan's on 2026-09-30: 521 distinct people,
# of whom only 128 are living and born after 1936 — Cuba's wiki coverage is
# mostly the dead.

