# Wikipedia categories seeding the Zambia run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no Zambia entry, so every entry below
# is measured here (PetScan, 2026-10-16) and nothing is inherited. Counts are
# distinct sitelinked items reached, then how many no earlier entry reached;
# a list article's count is its links, people among them. The whole seed is
# ~700 candidates.
#
# en.wikipedia is the regular wiki: `Political office-holders in Zambia`
# holds the presidents, vice-presidents, 30 portfolio subcats (provincial
# ministers among them), the National Assembly and the mayors.
#
# The current era is the August 2026 general election: the National
# Assembly's 2026-2031 list article and Hichilema's second cabinet reach the
# newcomers, the 2021-2026 list and first cabinet the members just ended.
# The National Assembly category is one flat bag back to 1964; the scope gate
# takes its history at fetch.
#
# Left out: `Governors of Northern Rhodesia` and `Members of the Legislative
# Council of Northern Rhodesia` (colonial); `United Federal Party`, `UNIP`
# and the small parties' categories (0-2 new each, history);
# `Forum for Democracy and Development`, `Independent politicians`,
# `Heritage Party`, `21st-century women politicians` and `Zambian
# politicians` (0 new).

