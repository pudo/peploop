# Wikipedia categories seeding the Sudan run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no Sudan entry, so every entry below is
# measured here (PetScan, 2026-10-15) and nothing is inherited. Counts are
# distinct sitelinked items reached, then how many no earlier entry reached,
# with South Sudan's people (`ss.yml`) already taken. The whole seed is ~380
# people.
#
# en.wikipedia's tree is thin (`Political office-holders in Sudan`: 9 subcats,
# no own pages) and ar.wikipedia adds about as much again: its
# `أصحاب مناصب سياسية في السودان` and the flat `سياسيون سودانيون` bag reach
# the Sovereignty Council, the 2019-2025 cabinets and governors en has no
# article for. Both wikis nest South Sudan's people under Sudan's, so
# `ss.yml` is seeded first and its people keep that run's stamp.
#
# The current era is the 2019 transition, the 2021 coup and the war since
# April 2023: the Sovereignty Council, the Port Sudan cabinet and the state
# governors; the RSF's rival Government of Peace and Unity (`Q132717949`,
# 2025) is in the same articles. The National Legislature has not sat since
# April 2019; its last members are seeded, and `policy.P39_MAX_ENDED_YEARS`
# settles the rest. Presidents are seeded at depth 0: their parent `Heads of
# state of Sudan` holds the Kings and Queens of Kush and the Funj sultans.
#
# Left out: `Heads of state of Sudan`, `Sudanese military personnel` below
# depth 0 (Mahdist War fighters), `Members of the Sudanese House of
# Representatives, elected in 1953`, `Anglo-Egyptian Sudan judges`, `Sudan
# People's Liberation Movement politicians` (see `ss.yml`: shared, either run
# would stamp the other's people), ar `وزراء سودانيون` (109, 0 new) and
# `قادة دولة السودان` (66, 0 new), en `Members of the Transitional Sovereignty
# Council` (8, 0 new), `Speakers of the National Assembly (Sudan)` (5, 0
# new), `National Congress Party (Sudan) politicians` (25, 1 new: Bashir's
# party). No category on either wiki holds the Bank of Sudan's
# governors or the RSF's command: those are census entries.

