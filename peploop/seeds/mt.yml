# Wikipedia categories seeding the Malta run: one PetScan query per entry.
#
# Measured 2026-10-14. Each entry gives the people PetScan returned and its
# marginal over the entries above it. The whole seed is ~424 distinct people.
#
# OpenSanctions' wd_categories.yml has four Malta entries
# (`Political_office-holders_in_Malta`, its `Lists_of_...` sibling, the House
# of Representatives and `Mayors_of_places_in_Malta`); the office-holders root
# is a pure container whose nine children are seeded below one by one, and the
# lists category holds list articles, not people. Every other entry is
# measured here.
#
# en.wikipedia carries the tiers: ministers by portfolio, the House with its
# speakers and opposition leaders, MEPs by term, the judges, the central bank,
# the AFM commanders, the ambassadors by host country, the bishops of Malta and
# Gozo. mt.wikipedia's `Politiċi Maltin` is one level of party bags, presidents,
# prime ministers and speakers; at depth 2 it adds 38 people en does not
# reach, most of them pre-independence, and is seeded for the few current MPs
# and mayors en has no category for. No tier has a per-period child except the
# MEPs' (all since 2004, so seeded whole) and the prime ministers' (20th/21st
# century, both small), so the tiers are seeded whole and the scope gate drops
# the dead at fetch.
#
# No category exists for the parliamentary secretaries, the Attorney General,
# State Advocate, Auditor General, Ombudsman, Electoral Commission, the MFSA,
# FIAU or Gaming Authority, the state companies or the regional councils; those
# are `census/mt.yml`'s. Only 19 of the 68 local council mayors are categorized;
# the rest come from the units lane (`lc_mayor` in the census).
#
# Left out: `Presidents_of_Malta` at depth 1 (+1: first ladies and gentlemen,
# elections), `Governors_of_Gozo` (+2; the Order's 18th-century governors),
# `Maltese_politicians_by_party` (+3; membership is not office),
# `20th-century_Maltese_politicians` (+3), `Maltese_women_in_politics` (+1),
# `Maltese_Roman_Catholic_bishops` (+4; Maltese missionaries' sees abroad),
# `Maltese_chief_executives` (+3; private companies), `Maltese_diplomats` (+0),
# `Maltese_judges_of_international_courts_and_tribunals` (+0),
# `21st-century_Maltese_lawyers` (+2), mt `Presidenti_tal-Kamra_tad-Deputati_-_Speakers_(Malta)`
# and `Ewroparlamentari_Maltin` (+0 each), the `Counts of Malta` and the Sovereign
# Military Order's grand masters under `Heads_of_state_of_Malta`.

