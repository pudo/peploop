# Wikipedia categories seeding the Republic of the Congo run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no Congo entry, so every entry below is
# measured here (PetScan, 2026-10-12) and nothing is inherited. Counts are
# distinct sitelinked items reached, then how many no earlier entry reached.
#
# Congo is a small corpus: the whole tree below is ~350 people. fr.wikipedia is
# the main wiki and carries the tiers under `Personnalité politique congolaise
# (RC)` -- "(RC)" is what separates it from the DRC's "(RDC)" tree -- with a
# `Ministre de la république du Congo` container of 35 portfolio subcats (134
# of the first 157 people), both chambers' members and presidents, the mayors
# of Brazzaville and Pointe-Noire, ambassadors by post and the generals.
# en.wikipedia adds the parliament by chamber, the vice-presidents and the
# Pan-African Parliament members (66 new under `Political office-holders`).
# en titles "Republic of the Congo (Léopoldville)" for the DRC of 1960-64:
# every en entry was read for it, and none below carries it.
#
# The current era is the 2015 constitution: Sassou Nguesso re-elected on 15
# March 2026, Makosso reappointed Prime Minister and his second government (41
# members, with a restored vice-prime ministership) named by decree on 24 April
# 2026; the National Assembly elected in July 2022 sits until 2027. Neither
# wiki has a per-legislature or per-period category below a tier (the fr `du
# XXIe siècle` bag is 14 pages), so the era cannot be chosen by category: every
# tier is seeded whole, the scope gate drops the dead at fetch and
# `policy.P39_MAX_ENDED_YEARS` skips the old tenures.
#
# Wikidata already holds 581 Assembly-member statements (`Q21295980`), against
# ~80 deputies with an article: this run reaches the articled ones only.
#
# Left out: fr `Personnalité politique congolaise (RC) du XXe siècle` (17, 2
# new), `Membre du Conseil de la République représentant le Moyen-Congo` (6, 4
# new, French Fourth Republic seats), `Première dame` (a spouse, no office),
# `Personnalité politique congolaise assassinée (RC)` and `Putschiste`
# (dead); en `Republic_of_the_Congo_politicians_by_party` (106, 6 new),
# `20th-century_Republic_of_the_Congo_politicians`. There is no judge,
# magistrate, central-bank (the BEAC is regional) or prefect category on
# either wiki; `Magistrat congolais (RC)` is empty.

