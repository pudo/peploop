# Wikipedia categories seeding the Burundian run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no Burundi entry at all, so every entry
# below is measured here (PetScan, 2026-10-02) and nothing is inherited.
#
# Burundi is a small corpus on every wiki, and modern: the whole tree below is
# 226 distinct people, of whom ~200 have no death date and were born after
# 1936. fr.wikipedia is the main wiki but carries the thinner tree
# (`Personnalité politique burundaise`: 19 pages, 13 subcats, and a
# `Ministre burundais` container of 15 tiny portfolio subcats); en.wikipedia has
# the deeper one (`Government ministers of Burundi`, 24 subcats and 132 people;
# both chambers with their presidents; the provincial governors; the BRB
# governors; 15 ambassadorship subcats). rn.wikipedia has one politician
# category, `Abakuru w'igihugu ca Uburundi` (heads of state, 11, all already
# reached by the fr/en president categories): left out.
#
# The current era is the 2018 constitution as it took effect at the 2020
# transition: Ndayishimiye sworn in 18 June 2020, the prime ministership
# restored and the two vice-presidencies folded into one, a new Senate and
# Assembly in 2020 (the Assembly re-elected in 2025), and the 18 provinces
# merged into five in 2025. Neither wiki has a per-period or per-century
# category below the tier (the fr `du XXIe siècle` bag is 11 pages), so the era
# cannot be chosen by category here: every tier is seeded whole, the scope gate
# drops the dead at fetch, and `policy.P39_MAX_ENDED_YEARS` skips tenures that
# ended before ~2006. The Arusha-era offices (first and second vice-president,
# 2005-2020) stay reachable that way, which is right: their holders are
# mostly alive and many hold office now.
#
# Left out: `Members_of_the_East_African_Legislative_Assembly` (42 pages, 36 of
# them new, but the category spans all EAC states and is not Burundi's),
# `Personnalité_politique_burundaise_assassinée` (9, 0 new),
# `Personnalité_politique_burundaise_du_XXe_siècle` (8, 3 new, none living),
# `20th-century_Burundian_politicians` d1 (30, 1 new),
# `Burundian_politician_stubs` (94, 0 new), `Kings_of_Burundi` and `Roi du
# Burundi` (monarchy, abolished 1966), and the permanent-representative
# category (9, 0 new after the ambassadors).

