# Wikipedia categories seeding the Australia run: one PetScan query per entry.
#
# Measured 2026-10-12 on en.wikipedia, the only wiki with Australia's tiers.
# Each entry gives the people PetScan returned and its marginal over the
# entries above it. The whole seed is ~11,800 distinct people, most of them
# long dead: every chamber is seeded whole and the scope gate drops the dead
# at fetch, because the per-period children (`Members of Australian
# parliaments by term`) cover the federal parliament only.
#
# The run goes down to local government: every state chamber, the state
# executives and their governors, the Supreme Courts and the District/County
# Courts, and the mayors and councillors of the local government areas.
#
# Left out: `Australian_politicians_by_party` (membership is not office),
# `Australian_politicians_by_populated_place` (birthplace), `High_commissioners_of_Australia`,
# `Directors-general_of_security` and `Chief_justices_of_Australian_superior_courts`
# (+0 each over the entries below), `Deputy_mayors_of_places_in_Australia`
# (+2), and the magistrates and abolished courts.

