# Wikipedia categories seeding the Somalia run: one PetScan query per entry.
#
# OpenSanctions' wd_categories.yml has no Somalia entry, so every entry below
# is measured here (PetScan, 2026-10-12) and nothing is inherited. Counts are
# distinct sitelinked items reached, then how many no earlier entry reached,
# with Somaliland's people (`so-som.yml`) already taken. The whole seed is
# ~450 people.
#
# en.wikipedia is the regular wiki: `Political office-holders in Somalia`
# carries a portfolio container of 38 subcats, both chambers of the Federal
# Parliament, the presidents and vice-presidents of the federal member states
# (Puntland, Jubaland, Galmudug, Hirshabelle, South West), the mayors and the
# governors. ar.wikipedia mirrors it (`أصحاب مناصب سياسية في الصومال`, 332, 7
# new) and so.wikipedia has no category tree. Many en categories were renamed
# from `Somalian …` to `Somali …`: the `Somalian` names are empty redirects.
#
# Somaliland's tree sits inside Somalia's on en: `so-som.yml` is seeded first,
# so its people keep that run's stamp and the containers below reach only
# Somalia's.
#
# The current era is the Federal Government under the 2012 provisional
# constitution: the Federal Parliament (House of the People and Upper House)
# and the federal member states. The Transitional Federal Parliament
# (2004-2012) is inside `policy.P39_MAX_ENDED_YEARS` and its members are
# today's politicians, so it is seeded; the Somali National Assembly of
# 1960-1969 is not. Presidents are seeded by century, which leaves out the
# eponymous `Siad Barre` and `Hassan Sheikh Mohamud` categories.
#
# Left out: `Members of the Somali National Assembly` (14, 12 new, 1960-69),
# `Speakers of the Parliament of Somalia` (the same assembly), `Somali
# politicians by party` (107, 10 new: SYL, SRSP and the civil-war fronts),
# `Politicians from Mogadishu` (a birthplace, 6 new), `Presidential elections
# in Somalia`, `First Lady`; ar's tree (7 new). There is no central-bank,
# police or court tier under the office-holders root; each is seeded from its
# own category below.

