# Finland: what the lanes know about it, one section per lane.

census:
  # The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
  # unit of 50,000 or more (`amlr.units`) that has no head office gets one from
  # `mint_units`, attested by the unit's own current P6 or its article's infobox.
  # A Finnish municipality is led by a kaupunginjohtaja (6 of 13 existing head
  # offices subclass municipal manager) or an elected pormestari. The label takes
  # the city's genitive from its council's ("Rovaniemen kaupunginvaltuusto");
  # Finland's offices are labelled in Swedish too, which the guard requires.
  - key: amlr_municipal_head
    class: subnational.municipal
    archetype: mayor
    per: units
    of: amlr:municipal
    lang: fi
    title: kaupunginjohtaja
    labels:
      fi: "{council} {title}"
      sv: "stadsdirektör i {name}"
      sv/pormestari: "borgmästare i {name}"
      en: "City Manager of {name}"
      en/pormestari: "Mayor of {name}"
    forms:
      fi: [["\\s+(?:kaupungin|kunnan)?valtuusto$", ""]]
    parents:
      kaupunginjohtaja: Q496728      # municipal manager
      pormestari: Q30185             # mayor
    sources:
      "*": https://fi.wikipedia.org/wiki/Kaupunginjohtaja

corp:
  # Finland. Unitary: 19 maakunnat and autonomous Åland; wellbeing services
  # counties are regional too.

  tiers: [national, regional]

  # Classes the type tree files under government organization or government
  # agency that are not government bodies here. Reindeer herding cooperatives,
  # volunteer fire brigades and student unions are filed as government bodies;
  # two brigades and LUT's student union (Q18660487) are state actors.
  not_government:
    - {qid: Q23927572, name: paliskunta}  # 54 live, e.g. Q91413922 Jääskö
    - {qid: Q10499309, name: volunteer fire departments in Finland}  # 20 live, e.g. Q97341327 Asolan VPK
    - {qid: Q285852, name: volunteer fire department}  # 40 live, e.g. Q42901760 Tapanilan VPK
    - {qid: Q115249934, name: ylioppilaskunta}  # 3 live, e.g. Q11873870 Kuvataideakatemian ylioppilaskunta

  # Never candidates here, beyond the global exclusions. Measured 2026-10-17
  # from the state actors' P127/P749 reach and the country's live items.
  # Chambers of commerce administer themselves.
  exclude:
    - {qid: Q897399, name: chamber of commerce and industry}  # 9 live, e.g. Q4738890 Amcham Finland
  # Counted among the kept bodies 2026-10-17. Mills, factories and manors are
  # sites, not bodies (the company that runs them is); the regional emergency
  # centres are branch offices of their agency; municipal transport
  # corporations are the municipal tier, not written.
    - {qid: Q83405, name: factory}  # 7 kept, e.g. Q11894488 Stora Enso Imatra Mill
    - {qid: Q918088, name: paper mill}  # 5 kept, e.g. Q11900519 Varkaus Paper Mills
    - {qid: Q879050, name: manor house}  # 4 kept, e.g. Q11893682 Sippolan kartano
    - {qid: Q510646, name: public-safety answering point}  # 5 kept, e.g. Q132717599 Turun hätäkeskus
    - {qid: Q11875790, name: municipal transport corporation}  # 4 kept, e.g. Q1433158 Helsingin kaupungin liikennelaitos

  # State-only legal forms and types, matched exactly as P31 or P1454.
  # Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
  # statement, then all live items, in brackets. Valtion liikelaitos is in the
  # Q270791 tree. Muu julkisoikeudellinen oikeushenkilö (wellbeing services
  # counties, the university pharmacy) is left out.
  forms:
    - {qid: Q68312351, kind: institution, name: Finnish government agency}  # 2 (39 live)
    - {qid: Q130321156, kind: institution, name: Valtio ja sen laitokset}  # 1 (4 live)

  roles: []

