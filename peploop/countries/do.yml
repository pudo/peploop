# Dominican Republic: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Dominican run: one PetScan query per entry.
  #
  # OpenSanctions' wd_categories.yml has no `country: do` entry, so every entry
  # below is measured here and nothing is inherited. Sizes are distinct
  # sitelinked pages per entry and the running distinct total, read through the
  # MediaWiki API on 2026-10-03 (PetScan was hanging that day); they count pages
  # rather than humans, so PetScan's `P31 = Q5` filter makes each a little
  # smaller.
  #
  # Both trees are thin and neither is regular. es.wikipedia is the main wiki
  # and carries the bulk of the people, but flat: `Políticos de la República
  # Dominicana` is one bag of 223 pages, the cabinet is a 28-page `Ministros de
  # República Dominicana` with a single portfolio subcategory, the Senate and
  # Chamber categories hold 9 and 15 pages, and the naming is inconsistent
  # ("de República Dominicana" beside "de la República Dominicana"). en.wikipedia
  # adds a tier es lacks -- the portfolio subcategories under `Government
  # ministers`, the presidents of both chambers, the Central Bank governors, the
  # provincial governors, 29 ambassadorship subcategories -- but is small too.
  #
  # The current era is the 2010 constitution (proclaimed 26 January 2010): it
  # created the Constitutional Tribunal, the Superior Electoral Court and the
  # present Consejo Nacional de la Magistratura, renamed the Secretarías de
  # Estado to Ministerios, and every institution the loop records today is its
  # creature. The 2015 amendment (presidential re-election) and the 2024 reform
  # (term limits locked, the Procurador's appointment changed from 2028) moved no
  # office into or out of existence, so neither is the cut. No category on
  # either wiki is per period or per century below the tier (the en
  # `21st-century` bag is 36 pages), so the era cannot be chosen by category:
  # every tier is seeded whole, the scope gate drops the dead at fetch, and
  # `policy.P39_MAX_ENDED_YEARS` (20) skips tenures that ended before ~2006,
  # which is the 2010 order give or take one legislature.
  #
  # Left out: `Instituciones gubernamentales` (50 pages, institutions, not
  # people), `Gobernadores coloniales de Santo Domingo`, `Políticos asesinados`
  # and en `19th-century Dominican Republic politicians` (history), and the en
  # entries that add nothing below: `Presidents of political parties` (19, 0
  # new), `Dominican Republic politician stubs` (62, 0 new), `Candidates for
  # President` (19, 2 new). The whole tree is ~575 pages; this is ~550.

  # --- Head of state and government ---
  - category: Presidentes_de_la_República_Dominicana        # 60
    lang: es
    depth: 0
  - category: Vicepresidentes_de_República_Dominicana        # 22, +11
    lang: es
    depth: 0

  # --- Cabinet: one flat category and one portfolio on es ---
  - category: Ministros_de_República_Dominicana              # 37 with Foreign Affairs, +35
    lang: es
  - category: Ministros_de_Educación_de_la_República_Dominicana   # 6, +1 (not under the parent)
    lang: es
    depth: 0
  - category: Funcionarios_de_la_República_Dominicana        # 10, +9: directors of agencies
    lang: es
    depth: 0

  # --- Congress ---
  - category: Senadores_de_República_Dominicana              # 9, +9
    lang: es
    depth: 0
  - category: Diputados_de_la_República_Dominicana           # 23 with the Chamber presidents, +16
    lang: es

  # --- Judiciary, prosecution ---
  - category: Jueces_de_República_Dominicana                 # 7, +7
    lang: es
    depth: 0
  - category: Poder_Judicial_de_República_Dominicana         # 13, +12
    lang: es
    depth: 0
  - category: Fiscales_de_República_Dominicana               # 4, +3
    lang: es
    depth: 0

  # --- Security: police, generals, the armed forces ---
  - category: Policía_de_la_República_Dominicana             # 9, +9
    lang: es
    depth: 0
  - category: Generales_de_República_Dominicana              # 13, +7
    lang: es
    depth: 0
  - category: Militares_de_la_República_Dominicana           # 98, +61; mostly 19th century, the scope gate's
    lang: es

  # --- Municipal: the capital ---
  - category: Alcaldes_de_Santo_Domingo                      # 8, +8
    lang: es
    depth: 0

  # --- Diplomatic service (Foreign Ministers, ambassadors by post) ---
  - category: Diplomáticos_de_República_Dominicana           # 59, +34
    lang: es
    depth: 2

  # --- Catch-alls: the politicians bag, women, the parties ---
  - category: Políticos_de_la_República_Dominicana           # 223, +109
    lang: es
    depth: 0
  - category: Políticas_de_República_Dominicana              # 18, +11
    lang: es
    depth: 0
  - category: Políticos_dominicanos_por_partido              # 6 parties, 110, +19
    lang: es

  # --- The English tree: the tiers es lacks ---
  - category: Presidents_of_the_Dominican_Republic           # 61, +2
    lang: en
    depth: 0
  - category: Vice_presidents_of_the_Dominican_Republic      # 32, +1
    lang: en
    depth: 0
  - category: Government_ministers_of_the_Dominican_Republic # 16 portfolios, 83, +18
    lang: en
  - category: Members_of_the_Congress_of_the_Dominican_Republic   # both chambers and their presidents, 73, +20
    lang: en
    depth: 2
  - category: Dominican_Republic_judges                      # 8, +2
    lang: en
  - category: Governors_of_the_Central_Bank_of_the_Dominican_Republic   # 4, +2
    lang: en
    depth: 0
  - category: Dominican_Republic_governors                   # provincial governors, 10, +3
    lang: en
    depth: 0
  - category: Mayors_of_places_in_the_Dominican_Republic     # 12, +2
    lang: en
  - category: Ambassadors_of_the_Dominican_Republic          # 29 posts, 30, +12
    lang: en
  - category: Dominican_Republic_diplomats                   # 43, +5
    lang: en
  - category: Dominican_Republic_military_leaders            # 19, +5
    lang: en
    depth: 0
  - category: 21st-century_Dominican_Republic_politicians    # 36, +4
    lang: en
  - category: Dominican_Republic_politicians                 # 19, +7
    lang: en
    depth: 0
  - category: Dominican_Republic_politicians_by_party        # 13 parties, 150, +17
    lang: en
  - category: Politicians_from_Santo_Domingo                 # 18, +3
    lang: en
    depth: 0

census:
  # Offices the state has whether or not a seeded person's article named them.
  # Bodies are from the 2026-10-03 live measurement (labels, P31, P17, P1001,
  # P361 read in full); nothing below is from memory. No `source` is given: none
  # was checked live, and a source is what lets a one-seat office pass on a
  # single current holder, so it is never guessed.
  #
  # Not here because an item exists: the President `Q607982`, the Vice-President
  # `Q52229486`, the Foreign Minister `Q28662562`, about twenty portfolio
  # ministers in the `Q113992401`..`Q113992471` batch (all `P31 Q294414`,
  # `P279 Q83307`, `P361` the Cabinet `Q3112605`), the presidents of the Senate
  # `Q113992525` and of the Chamber `Q23007339` (both `P279 Q1758037`, `P2389`
  # the chamber), the membership seats `Q21295132` / `Q21328590`, and the
  # Procurador General `Q113992411` -- whose es label is the *body's* name,
  # "Procuraduría General de la República", while the body `Q30909878` is itself
  # typed `Q4164871` with `P279` attorney general, so the two read as twins.
  #
  # Twins found and not resolved here (a merge is a human gate): the Minister of
  # Public Health `Q113992409` and `Q113992469`, identical claims, both `P2389
  # Q90746249`; the Ministry of Defence bodies `Q17347140` and `Q116731341`.
  # `Q113992448` (3 holders) is labelled "Ministro Administrativo de la
  # Presidencia" in es but "Minister of the Presidency" in en, beside
  # `Q113992686` "Administrative Minister of the Presidency" (1): two offices,
  # one of them with a wrong label. The Senate presidency `Q113992525` names the
  # Senate in `P1001`.
  #
  # Absent and not listed, for want of an archetype or a resolver: the mayor of
  # the Distrito Nacional (no item; the Distrito Nacional `Q2499228` is a
  # first-level subdivision, which a mayor's level refuses, so it waits for the
  # municipality resolver), the Navy and Air Force commanders (service chiefs:
  # `military_chief_of_staff` would type them chief of defence), the Defensor
  # del Pueblo (no body item found).

  # --- Apex courts and the electoral bodies ---
  - key: supreme_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q6136068           # Suprema Corte de Justicia, P31 supreme court, P17 Q786
    labels:
      es: Presidente de la Suprema Corte de Justicia de la República Dominicana
      en: President of the Supreme Court of Justice of the Dominican Republic

  - key: constitutional_tribunal_president
    class: judiciary.apex
    archetype: court_president
    body: Q9089790           # Tribunal Constitucional (2010); no P31/P17 at all, es label only
    labels:
      es: Presidente del Tribunal Constitucional de la República Dominicana
      en: President of the Constitutional Tribunal of the Dominican Republic

  # The TSE is an electoral court, not an apex one: `court_president` would type
  # it chief justice of a supreme court, so it takes `agency_head` as Belarus's
  # election commission did.
  - key: electoral_court_president
    class: oversight.electoral_commission
    archetype: agency_head
    body: Q123166271         # Tribunal Superior Electoral, P17 Q786, no P31
    labels:
      es: Presidente del Tribunal Superior Electoral de la República Dominicana
      en: President of the Superior Electoral Court of the Dominican Republic

  - key: jce_president
    class: oversight.electoral_commission
    archetype: agency_head
    body: Q5956447           # Junta Central Electoral, P31 electoral branch, P17/P1001 Q786
    labels:
      es: Presidente de la Junta Central Electoral
      en: President of the Central Electoral Board of the Dominican Republic

  # --- Control bodies ---
  - key: camara_de_cuentas_president
    class: oversight.audit_anticorruption
    archetype: agency_head
    # No body: no item for the Cámara de Cuentas was found (searched es and en,
    # and `haswbstatement:P17=Q786` with "Cuentas").
    labels:
      es: Presidente de la Cámara de Cuentas de la República Dominicana
      en: President of the Chamber of Accounts of the Dominican Republic

  - key: comptroller_general
    class: oversight.audit_anticorruption
    archetype: agency_head
    body: Q5785178           # Contraloría General de la República, P17 Q786, no P31
    labels:
      es: Contralor General de la República Dominicana
      en: Comptroller General of the Dominican Republic

  # --- Central bank ---
  - key: central_bank_governor
    class: economic.central_bank
    archetype: central_bank_governor
    body: Q1800406           # Banco Central de la República Dominicana, P31 central bank
    labels:
      es: Gobernador del Banco Central de la República Dominicana
      en: Governor of the Central Bank of the Dominican Republic

  # --- Security ---
  # The Army's commander exists as `Q119848570` (P2389 the Army `Q5290731`, no
  # P31, so the descent misses it); it is listed so that mint-verify's live
  # search surfaces it as `found` and mint-feed loads it. The Minister of
  # Defence `Q113992465`, a serving general by law, is the armed forces' head.
  - key: army_commander
    class: security.defence_command
    archetype: military_chief_of_staff
    body: Q5290731           # Ejército de la República Dominicana, P361 the armed forces Q436714
    labels:
      es: Comandante General del Ejército de la República Dominicana
      en: Commander General of the Army of the Dominican Republic

  - key: police_director_general
    class: security.police
    archetype: agency_head
    body: Q3394185           # Policía Nacional Dominicana, P31 law enforcement agency
    labels:
      es: Director General de la Policía Nacional de la República Dominicana
      en: Director General of the National Police of the Dominican Republic

  # --- State enterprises: the state bank and the three distributors ---
  - key: banreservas_head
    class: economic.soe_leadership
    archetype: soe_head
    body: Q5717780           # BanReservas, P31 bank + state-owned enterprise
    labels:
      es: Administrador General del Banco de Reservas de la República Dominicana
      en: Administrator General of Banreservas

  - key: edesur_head
    class: economic.soe_leadership
    archetype: soe_head
    body: Q5817651           # Edesur Dominicana, P17 Q786, no P31
    labels:
      es: Gerente General de Edesur Dominicana
      en: General Manager of Edesur Dominicana

  - key: edenorte_head
    class: economic.soe_leadership
    archetype: soe_head
    body: Q138348776         # Edenorte, P31 electric utility
    labels:
      es: Gerente General de Edenorte Dominicana
      en: General Manager of Edenorte Dominicana

  - key: edeeste_head
    class: economic.soe_leadership
    archetype: soe_head
    body: Q138478738         # Edeeste, P31 electric utility
    labels:
      es: Gerente General de Edeeste
      en: General Manager of Edeeste

  # --- Provincial governors ---
  # Q786's P150 is 31 provinces and the Distrito Nacional, none ended, none
  # carrying P576; no governorship item exists for any of them. The Distrito
  # Nacional has no governor (its executive is the mayor of the Ayuntamiento del
  # Distrito Nacional). Five es province labels carry "Provincia" or a
  # disambiguator ("Provincia de Santiago (República Dominicana)"), so the es
  # template below reads badly for those; the draft's own label wins where
  # categorize gives one.
  - key: provincial_governor
    class: subnational.executive
    archetype: governor
    per: subdivisions
    exclude:
      - Q2499228             # Distrito Nacional
    labels:
      es: Gobernador provincial de {name}
      en: Governor of {name}
