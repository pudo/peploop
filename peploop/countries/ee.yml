# Estonia: what the lanes know about it, one section per lane.

corp:
  # Estonia. Unitary: 15 maakonnad, without regional self-government since
  # 2018.

  tiers: [national, regional]

  # Classes the type tree files under government organization or government
  # agency that are not government bodies here. None measured: no misfiled
  # class among the state actors read 2026-10-17.
  not_government: []

  # Never candidates here, beyond the global exclusions. Measured 2026-10-17
  # from the state actors' P127/P749 reach and the country's live items. The
  # notaries' chamber, the bar and the medical association administer
  # themselves.
  exclude:
    - {qid: Q1757539, name: notarite koda}  # 2 live, e.g. Q1436614 Notarite Koda
    - {qid: Q1865205, name: bar association}  # 1 live, e.g. Q16408959 Eesti Advokatuur
    - {qid: Q10729872, name: medical association}  # 2 live, e.g. Q16409064 Eesti Arstide Liit
  # Dry load 2026-10-17: the ministries' schools (about 120 kept through the
  # agency form: state upper secondary, vocational and special schools),
  # prisons and care homes; heads are no state function.
    - {qid: Q3914, name: school}  # e.g. Q111818378 Paide Upper Secondary School
    - {qid: Q17567322, name: prison organization}  # 9 kept, e.g. Q12376213 Tallinn Prison
    - {qid: Q40357, name: prison}
    - {qid: Q25510280, name: social welfare institution}  # 4 kept, e.g. Q12358036 Aa nursing home

  # State-only legal forms and types, matched exactly as P31 or P1454.
  # Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
  # statement, then all live items, in brackets. Avalik-õiguslik juriidiline
  # isik (universities, the broadcaster, the bar and notaries) and kohaliku
  # omavalitsuse asutus (municipal) are left out; valitsusasutus covers the
  # ministries.
  forms:
    - {qid: Q68660394, kind: institution, name: ministeeriumi hallatav riigiasutus}  # 2 (159 live)
    - {qid: Q25521581, kind: institution, name: amet}  # 0 (30 live)
    - {qid: Q16410503, kind: institution, name: inspektsioon}  # 0 (7 live)
    - {qid: Q131353826, kind: institution, name: ameti hallatav riigiasutus}  # 0 (3 live)
    - {qid: Q69026707, kind: institution, name: täidesaatva riigivõimu asutus või riigi muu institutsioon}  # 0 (11 live)
    - {qid: Q69747485, kind: enterprise, name: riigitulundusasutus}  # 0 (1 live)

  roles: []

