# France: what the lanes know about it, one section per lane.

census:
  # The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
  # unit of 50,000 or more (`amlr.units`) that has no head office gets one from
  # `mint_units`, attested by the unit's own current P6 or its article's infobox.
  # Every commune has its maire, so only the EPCI à fiscalité propre and the
  # métropoles are here. Their existing presidencies subclass président d'EPCI à
  # fiscalité propre (19, against 3 for président de communauté de communes).
  - key: amlr_grouping_head
    class: subnational.municipal
    archetype: grouping_head
    per: units
    of: amlr:grouping
    lang: fr
    title: président
    labels: &epci_labels
      fr: "président {name}"         # "président de la communauté d'agglomération du Pays Basque"
      en: "President of {name}"
    forms: &epci_forms
      # The "de" a name takes: "de la communauté …", "de l'Agglomération …",
      # "du Muretain Agglo", "du Grand Belfort", "d'Agglo Pays d'Issoire", else
      # "de Grand Besançon Métropole".
      fr:
        - ["^((?:[Cc]ommunauté|[Mm]étropole|[Ee]urométropole)\\b)", "de la \\1"]
        - ["^([Aa]gglomération)\\b", "de l'\\1"]
        - ["^Le ", "du "]
        - ["^(Grand (?!.*\\b(?:Métropole|Agglo|Agglomération)\\b))", "du \\1"]
        - ["^Les ", "des "]
        - ["^([AEIOUYÉÈÎaeiouyéèî])", "d'\\1"]
        - ["^(?!(?:de |du |des |d'))", "de "]
    parent: Q61968143                # président d'EPCI à fiscalité propre
    sources:
      "*": https://fr.wikipedia.org/wiki/Établissement_public_de_coopération_intercommunale_à_fiscalité_propre

  - key: amlr_metro_head
    class: subnational.municipal
    archetype: grouping_head
    per: units
    of: amlr:metro
    lang: fr
    title: président
    labels: *epci_labels
    forms: *epci_forms
    parent: Q61968143
    sources:
      "*": https://fr.wikipedia.org/wiki/Métropole_(intercommunalité_française)

corp:
  # France. Unitary: 18 régions, the regional tier (départements and communes
  # are not).

  tiers: [national, regional]

  # Items standing for the state or its government that the type tree cannot
  # place. Measured 2026-10-18 from the controllers the full run's answers
  # chose but the rules could not place: the French State as a legal person
  # (owner of EDF, SNCF, France Télévisions, the Caisse des dépôts), the Prime
  # Minister's services, a labour ministry typed as a position, and two
  # ministry directorates without P1001.
  actors:
    - {qid: Q3591845, kind: state, name: État français}
    - {qid: Q54293525, kind: government, name: services du Premier ministre}
    - {qid: Q1408517, kind: government, name: ministère du Travail et de l'Emploi}
    - {qid: Q3029570, kind: government, name: direction générale des Infrastructures, des Transports et de la Mer}
    - {qid: Q124032419, kind: government, name: direction générale des Infrastructures, des Transports et des Mobilités}  # the same DG's newer item, named twice 2026-10-18
    - {qid: Q1227512, kind: government, name: direction générale de l'Aviation civile}

  # Classes the type tree files under government organization or government
  # agency that are not government bodies here. Municipal administrations
  # (administration municipale, under executive branch) are municipal
  # government, a later tier: 34961 are read as state actors and 201439 items
  # follow by link; the global list keeps communes out as places, these are
  # the same bodies typed as government. Chambers of commerce are
  # self-administering public-law bodies.
  not_government:
    - {qid: Q2948359, name: chambre de commerce et d'industrie}  # 52 live, e.g. Q114877918 Chambre de commerce et d'industrie (CCI) - Alsace 
    - {qid: Q897399, name: chamber of commerce and industry}  # 13 live, e.g. Q598576 Chambre franco-allemande de commerce et d'industri

  # Never candidates here, beyond the global exclusions. Measured 2026-10-17
  # from the state actors' P127/P749 reach and the country's live items. The
  # consular bodies (CCI, chambres de métiers, chambres d'agriculture) and
  # ordres administer themselves; the local EPIC and régies are municipal
  # enterprises, inside the Q270791 tree, so the typed lane reads them; the
  # régime général's caisses are run by the social partners.
  exclude:
    - {qid: Q87715831, name: organisme consulaire}  # 316 live, e.g. Q62099826 chambre de commerce et d'industrie de Rouen métrop
    - {qid: Q2948359, name: chambre de commerce et d'industrie}  # 52 live, e.g. Q114877918 Chambre de commerce et d'industrie (CCI) - Alsace 
    - {qid: Q89478585, name: chambre de métiers et de l'artisanat}  # 29 live, e.g. Q114877989 Chambre de métiers et de l'artisanat (CMA) - Var
    - {qid: Q2948132, name: chambre consulaire}  # 6 live, e.g. Q89478580 chambre économique multiprofessionnelle de Saint-B
    - {qid: Q59155876, name: chambre d'agriculture}  # 3 live, e.g. Q114877916 Chambre d'agriculture - Haut-Rhin
    - {qid: Q897399, name: chamber of commerce and industry}  # 13 live, e.g. Q598576 Chambre franco-allemande de commerce et d'industri
    - {qid: Q10729872, name: medical association}  # 13 live, e.g. Q18413992 collège de la médecine générale
    - {qid: Q56199177, name: Conseil régional de l'ordre des experts-comptable}  # 23 live, e.g. Q56199229 Conseil régional de l'ordre des experts-comptables
    - {qid: Q111302220, name: établissement public local à caractère industriel ou commercial}  # 1284 live, e.g. Q115457588 Office de tourisme intercommunal Lot Tolzac
    - {qid: Q112176670, name: régie d'une collectivité locale à caractère industriel ou commercial}  # 516 live, e.g. Q115579362 Régie d'équipement et Gestion de l'assainissement 
    - {qid: Q112177100, name: régime général de la sécurité sociale}  # 8 live, e.g. Q123200558 caisse d'allocations familiales de Paris
  # Units inside a body, whose heads are middle-ranking: Radio France's local
  # stations, the BnF's departments, CNRS joint research units, and the joint
  # services of the armed forces (officers are peploop's). Measured 2026-10-17
  # among the kept candidates.
    - {qid: Q1868541, name: local radio station}  # 29 kept, e.g. Q13629025 Ici Nord
  # Individual radio stations and channels; the broadcaster (Radio France,
  # France Médias Monde, France Télévisions) stays. Television station is left
  # in: Arte France, a holding, is typed one; the decision drops channels.
    - {qid: Q14350, name: radio station}  # 35 kept, e.g. Q19905 France Inter
    - {qid: Q561068, name: specialty channel}  # 2 kept, e.g. Q166180 France 24
    - {qid: Q334453, name: division}  # 16 kept, e.g. Q3044762 Département des manuscrits de la BnF
    - {qid: Q3550864, name: unité mixte de recherche}  # 16 kept, e.g. Q21619458 Institut de biologie structurale
    - {qid: Q3356149, name: organisme interarmées}  # 12 kept, e.g. Q335814 direction du renseignement militaire
  # Prisons, which the État français owns by P127: their directors are civil
  # servants of the prison administration. Measured 2026-10-18 once the État
  # français became a state actor (107 kept).
    - {qid: Q40357, name: prison}  # e.g. Q22932360 maison d'arrêt du Puy-en-Velay
    - {qid: Q3403998, name: établissement pénitentiaire en France}  # e.g. Q112574395 Centre pénitentiaire de Majicavo

  # State-only legal forms and types, matched exactly as P31 or P1454.
  # Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
  # statement, then all live items, in brackets. EPIC (generic) and EPL IC are
  # in the Q270791 tree. EPSCP (universities), GIP (local authorities among
  # the members) and ministry services are left out.
  forms:
    - {qid: Q51704864, kind: institution, name: établissement public national à caractère administratif}  # 55 (160 live)
    - {qid: Q112176666, kind: enterprise, name: établissement public national à caractère industriel ou commercial doté d'un comptable public}  # 12 (96 live)
    - {qid: Q112176667, kind: enterprise, name: établissement public national à caractère industriel ou commercial non doté d'un comptable public}  # 7 (22 live)
    - {qid: Q87715853, kind: institution, name: autre établissement public national administratif à compétence territoriale limitée}  # 3 (75 live)
    - {qid: Q3244038, kind: institution, name: établissement public administratif}  # 7 (35 live)
    - {qid: Q87913986, kind: institution, name: autorité administrative ou publique indépendante}  # 22 (33 live)
    - {qid: Q2872764, kind: institution, name: autorité administrative indépendante}  # 8 (14 live)
    - {qid: Q1940786, kind: institution, name: autorité administrative indépendante}  # 1 (4 live)
    - {qid: Q18558685, kind: institution, name: autorité publique indépendante}  # 3 (3 live)
    - {qid: Q13582798, kind: institution, name: établissement public à caractère scientifique et technologique en France}  # 5 (8 live)

  roles: []

