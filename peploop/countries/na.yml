# Namibia: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Namibia run: one PetScan query per entry.
  #
  # OpenSanctions' wd_categories.yml has no Namibia entry, so every entry below
  # is measured here (PetScan, 2026-10-16) and nothing is inherited. Counts are
  # distinct sitelinked items reached, then how many no earlier entry reached;
  # a list article's count is its links, people among them. The whole seed is
  # ~630 candidates.
  #
  # en.wikipedia is the regular wiki: `Political office-holders in Namibia`
  # holds the presidents, 31 portfolio subcats, both chambers (the National
  # Assembly by term), the regional governors by region, and the mayors.
  #
  # The current era is the November 2024 election: the 8th National Assembly's
  # list article and the Cabinet article (Nandi-Ndaitwah's, March 2025) reach
  # the newcomers; the National Assembly's term subcats reach back to 1990,
  # which the scope gate takes at fetch.
  #
  # Left out: `Leaders of bantustans in South West Africa` (pre-1990);
  # `People's Liberation Army of Namibia personnel` (83, liberation-war
  # fighters, not office-holders); `Independent Patriots for Change`,
  # `Affirmative Repositioning`, `21st-century women politicians` and the
  # Air Force marshals (0 new).

  # --- Head of state and government ---
  - category: Presidents_of_Namibia                              # 5
    lang: en
    depth: 0
  - category: Vice_presidents_of_Namibia                         # 3, 1 new
    lang: en
    depth: 0
  - category: Prime_ministers_of_Namibia                         # 5, 4 new
    lang: en
    depth: 0
  - category: Deputy_prime_ministers_of_Namibia                  # 5, 4 new
    lang: en
    depth: 0

  # --- Cabinet: the current one, then 31 portfolio subcats ---
  - article: Cabinet_of_Namibia                                  # 288 links, 274 new
    lang: en
  - category: Government_ministers_of_Namibia                    # 137, 22 new
    lang: en

  # --- Parliament: National Assembly by term, National Council ---
  - article: List_of_members_of_the_8th_National_Assembly_of_Namibia  # 163 links, 84 new
    lang: en
  - category: Members_of_the_National_Assembly_(Namibia)         # by-term container; 296, 92 new
    lang: en
    depth: 2
  - category: Members_of_the_National_Council_(Namibia)          # 25, 15 new
    lang: en

  # --- Subnational: regional governors, mayors ---
  - category: Regional_governors_of_Namibia                      # per region; 12, 9 new
    lang: en
  - category: Mayors_of_places_in_Namibia                        # 27, 14 new
    lang: en

  # --- Courts, central bank, military, diplomatic service ---
  - category: Justices_of_the_Supreme_Court_of_Namibia           # 9, 8 new
    lang: en
  - category: Namibian_judges                                    # own pages; 9, 4 new
    lang: en
    depth: 0
  - category: Governors_of_the_Bank_of_Namibia                   # 4, 2 new
    lang: en
    depth: 0
  - category: Namibian_military_leaders                          # 3, 3 new
    lang: en
  - category: Ambassadors_of_Namibia                             # per receiver; 31, 14 new
    lang: en
    depth: 2

  # --- Parties: the ones in the 8th National Assembly ---
  - category: SWAPO_politicians                                  # 282, 36 new
    lang: en
    depth: 0
  - category: Popular_Democratic_Movement_politicians            # 38, 9 new
    lang: en
    depth: 0
  - category: Landless_People's_Movement_(Namibia)_politicians   # 10, 3 new
    lang: en
    depth: 0

  # --- Catch-alls ---
  - category: 21st-century_Namibian_politicians                  # 166, 3 new
    lang: en
    depth: 0
  - category: Namibian_politicians                               # flat bag; 19, 11 new
    lang: en
    depth: 0
  - category: Namibian_politician_stubs                          # 225, 9 new
    lang: en
    depth: 0

  # --- Wide: the rest of the government tree and the office-holding professions ---
  # Measured 2026-10-16 against everything above. Of `Government of Namibia`'s
  # branches, `Apartheid government` (208 new, South Africans) and `Foreign
  # relations of Namibia` (66 new, foreign ambassadors; `Namibian diplomats`
  # adds none) are left out.
  - category: Namibian_politicians                               # whole tree; 450, 12 new
    lang: en
    depth: 3
  - category: Military_of_Namibia                                # NDF, NCIS commanders; 100, 45 new
    lang: en
    depth: 2
  - category: Law_of_Namibia                                     # 34, 11 new
    lang: en
    depth: 2
  - category: Law_enforcement_in_Namibia                         # 8, 5 new
    lang: en
    depth: 2
  - category: Judiciary_of_Namibia                               # 14, 1 new
    lang: en
    depth: 2
  - category: Namibian_lawyers                                   # 19, 3 new
    lang: en
  - category: Namibian_businesspeople                            # SOE heads among them; 32, 13 new
    lang: en
    depth: 2
  - category: Namibian_trade_unionists                           # 17, 3 new
    lang: en
  - category: Namibian_activists                                 # 64, 20 new
    lang: en
  - category: Namibian_journalists                               # 15, 12 new
    lang: en
  - category: Namibian_police_officers                           # 6, 2 new
    lang: en

  # --- Church: bishops are in scope ---
  - category: Roman_Catholic_bishops_in_Namibia                  # 5, 5 new
    lang: en
    depth: 2

census:
  # Offices Namibia has whether or not a seeded person's article named them.
  # Bodies are from the 2026-10-16 live measurement (wbsearchentities, the
  # items read); nothing below is from memory.
  #
  # Not here because an item exists and the load reaches it: the President
  # `Q647198`, Vice-President `Q19901597`, Prime Minister `Q1333976` and deputy
  # `Q88776855`, the portfolio ministers (`Q1103949xx`, `Q1103950xx`), the
  # Speaker `Q110395511` and the National Council's president `Q110395528`,
  # the Attorney General `Q29316605`, the Chief of the Defence Force
  # `Q55607330` and the Governor of the Bank of Namibia `Q5589738`.
  #
  # Absent and not listed: the Namibian Police, the Anti-Corruption
  # Commission, the Office of the Auditor-General, the Prosecutor-General's
  # office and the Ombudsman have no items; their heads are listed without a
  # body, since a minister's or judge's article often names them.
  #
  # The fourteen regions are each headed by a governor the President appoints;
  # two of them (Oshikoto among them) have an office item: a `per:
  # subdivisions` entry over the rest.

  # --- Sub-national: regional governors ---
  - key: regional_governor
    class: subnational.executive
    archetype: governor
    per: subdivisions
    source: https://en.wikipedia.org/wiki/Regions_of_Namibia
    labels:
      en: Governor of {name}

  # --- Judiciary: Supreme and High Courts ---
  - key: chief_justice
    class: judiciary.apex
    archetype: court_president
    body: Q1408827           # Supreme Court of Namibia, P31 supreme court, P17 Q1030
    labels:
      en: Chief Justice of Namibia

  - key: supreme_court_judge
    class: judiciary.apex
    archetype: supreme_judge
    body: Q1408827
    labels:
      en: Judge of the Supreme Court of Namibia

  - key: high_court_judge
    class: judiciary.specialised
    archetype: judge
    body: Q1617731           # High Court of Namibia, P17 Q1030
    labels:
      en: Judge of the High Court of Namibia

  - key: judge_president
    class: judiciary.specialised
    archetype: court_president
    body: Q1617731
    labels:
      en: Judge President of the High Court of Namibia

  # --- Prosecution, oversight, elections ---
  - key: prosecutor_general
    class: judiciary.prosecution
    archetype: prosecutor_general
    # No body: no item for the Office of the Prosecutor-General was found.
    labels:
      en: Prosecutor-General of Namibia

  - key: auditor_general
    class: oversight.audit_anticorruption
    archetype: agency_head
    # No body: no item for the Office of the Auditor-General was found.
    labels:
      en: Auditor-General of Namibia

  - key: anti_corruption_commission_dg
    class: oversight.audit_anticorruption
    archetype: agency_head
    # No body: no item for the Anti-Corruption Commission was found.
    labels:
      en: Director-General of the Anti-Corruption Commission of Namibia

  - key: ombudsman
    class: oversight.constitutional_body
    archetype: agency_head
    # No body: no item for the Office of the Ombudsman was found.
    labels:
      en: Ombudsman of Namibia

  - key: electoral_commission_chair
    class: oversight.electoral_commission
    archetype: agency_head
    body: Q5354982           # Electoral Commission of Namibia, P17 Q1030
    labels:
      en: Chairperson of the Electoral Commission of Namibia

  # --- Security: police and intelligence ---
  - key: inspector_general_of_police
    class: security.police
    archetype: agency_head
    # No body: no item for the Namibian Police Force was found.
    labels:
      en: Inspector-General of the Namibian Police

  - key: ncis_director_general
    class: security.intelligence
    archetype: agency_head
    body: Q86666241          # Namibian Central Intelligence Service, P17 Q1030
    labels:
      en: Director-General of the Namibia Central Intelligence Service

  # --- State-owned enterprises ---
  - key: nampower_md
    class: economic.soe_leadership
    archetype: soe_head
    body: Q1964276           # NamPower, P17 Q1030
    labels:
      en: Managing Director of NamPower

  # --- Parties: the leaders of the opposition parties in the 8th National Assembly ---
  # SWAPO's presidency has an item (`Q124422214`). The Popular Democratic
  # Movement's item carries `P17` Seychelles; it is still the party's only item.
  - key: ipc_leader
    class: political.parties
    archetype: party_leader
    body: Q98081326          # Independent Patriots for Change, P17 Q1030
    labels:
      en: President of the Independent Patriots for Change

  - key: pdm_leader
    class: political.parties
    archetype: party_leader
    body: Q23690626          # Popular Democratic Movement
    labels:
      en: President of the Popular Democratic Movement

  - key: lpm_leader
    class: political.parties
    archetype: party_leader
    body: Q60518792          # Landless People's Movement, P17 Q1030
    labels:
      en: Leader of the Landless People's Movement

  - key: ar_leader
    class: political.parties
    archetype: party_leader
    body: Q19891949          # Affirmative Repositioning, P17 Q1030
    labels:
      en: Leader of Affirmative Repositioning

  - key: nudo_leader
    class: political.parties
    archetype: party_leader
    body: Q1126019           # National Unity Democratic Organisation, P17 Q1030
    labels:
      en: President of the National Unity Democratic Organisation
