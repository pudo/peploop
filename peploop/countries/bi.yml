# Burundi: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Burundian run: one PetScan query per entry.
  #
  # OpenSanctions' wd_categories.yml has no Burundi entry at all, so every entry
  # below is measured here (PetScan, 2026-10-02) and nothing is inherited.
  #
  # Burundi is a small corpus on every wiki, and modern: the whole tree below is
  # 226 distinct people, of whom ~200 have no death date and were born after
  # 1936. fr.wikipedia is the main wiki but carries the thinner tree
  # (`Personnalité politique burundaise`: 19 pages, 13 subcats, and a
  # `Ministre burundais` container of 15 tiny portfolio subcats); en.wikipedia has
  # the deeper one (`Government ministers of Burundi`, 24 subcats and 132 people;
  # both chambers with their presidents; the provincial governors; the BRB
  # governors; 15 ambassadorship subcats). rn.wikipedia has one politician
  # category, `Abakuru w'igihugu ca Uburundi` (heads of state, 11, all already
  # reached by the fr/en president categories): left out.
  #
  # The current era is the 2018 constitution as it took effect at the 2020
  # transition: Ndayishimiye sworn in 18 June 2020, the prime ministership
  # restored and the two vice-presidencies folded into one, a new Senate and
  # Assembly in 2020 (the Assembly re-elected in 2025), and the 18 provinces
  # merged into five in 2025. Neither wiki has a per-period or per-century
  # category below the tier (the fr `du XXIe siècle` bag is 11 pages), so the era
  # cannot be chosen by category here: every tier is seeded whole, the scope gate
  # drops the dead at fetch, and `policy.P39_MAX_ENDED_YEARS` skips tenures that
  # ended before ~2006. The Arusha-era offices (first and second vice-president,
  # 2005-2020) stay reachable that way, which is right: their holders are
  # mostly alive and many hold office now.
  #
  # Left out: `Members_of_the_East_African_Legislative_Assembly` (42 pages, 36 of
  # them new, but the category spans all EAC states and is not Burundi's),
  # `Personnalité_politique_burundaise_assassinée` (9, 0 new),
  # `Personnalité_politique_burundaise_du_XXe_siècle` (8, 3 new, none living),
  # `20th-century_Burundian_politicians` d1 (30, 1 new),
  # `Burundian_politician_stubs` (94, 0 new), `Kings_of_Burundi` and `Roi du
  # Burundi` (monarchy, abolished 1966), and the permanent-representative
  # category (9, 0 new after the ambassadors).

  # --- Head of state and government, deputies ---
  - category: Président_de_la_république_du_Burundi        # 11, 5 living
    lang: fr
    depth: 0
  - category: Vice-président_du_Burundi                    # 15, 13 living (all three vice-presidencies)
    lang: fr
    depth: 0
  - category: Premier_ministre_du_Burundi                  # 10, 6 living
    lang: fr
    depth: 0
  - category: Presidents_of_Burundi                        # 10, 0 new
    lang: en
    depth: 0
  - category: Vice-presidents_of_Burundi                   # 16, 1 new
    lang: en
    depth: 0
  - category: Prime_ministers_of_Burundi                   # 18, 7 new
    lang: en
    depth: 0

  # --- Cabinet: fr's 15 portfolio subcats, en's 24 ---
  - category: Ministre_burundais                           # container; 48, 34 new, 36 living
    lang: fr
  - category: Government_ministers_of_Burundi              # container; 132, 68 new, 101 living
    lang: en

  # --- Parliament: both chambers with their presidents ---
  - category: Président_de_l'Assemblée_nationale_du_Burundi   # 3
    lang: fr
    depth: 0
  - category: Président_du_Sénat_burundais                 # 6
    lang: fr
    depth: 0
  - category: Members_of_the_Parliament_of_Burundi         # Assembly + Senate + presidents + life senators; 44, 16 new
    lang: en
    depth: 2
  - category: Members_of_the_Pan-African_Parliament_from_Burundi   # 5, 4 new
    lang: en
    depth: 0

  # --- Judiciary (no court-presidency item on Wikidata) ---
  - category: Burundian_judges                             # 7, 3 new; d1 adds one international judge
    lang: en

  # --- Central bank ---
  - category: Governors_of_the_Bank_of_the_Republic_of_Burundi   # 2, 0 new
    lang: en
    depth: 0

  # --- Subnational: the governors are on en only; one mayor of Bujumbura ---
  - category: Governors_of_provinces_of_Burundi            # 5, 3 new, all living
    lang: en
    depth: 0
  - category: Mayors_of_places_in_Burundi                  # 1
    lang: en

  # --- Diplomatic service ---
  - category: Diplomate_burundais                          # ambassadors by post at d2; 11, 3 new
    lang: fr
    depth: 2
  - category: Burundian_diplomats                          # 7, 3 new
    lang: en
  - category: Ambassadors_of_Burundi                       # 15 posts; 23, 6 new
    lang: en

  # --- Military (no police category on either wiki) ---
  - category: Militaire_burundais                          # with Général burundais; 8, 1 new
    lang: fr
  - category: Burundian_military_personnel                 # 15, 4 new
    lang: en
    depth: 0

  # --- Parties: CNDD-FDD is the ruling party ---
  - category: Burundian_politicians_by_party               # 7 parties; 85, 4 new (UPRONA 51, CNDD-FDD 21)
    lang: en

  # --- Catch-alls ---
  - category: Personnalité_politique_burundaise_du_XXIe_siècle   # 11, 2 new
    lang: fr
    depth: 0
  - category: Personnalité_politique_burundaise            # 19 pages, 8 new
    lang: fr
    depth: 0
  - category: Femme_politique_burundaise                   # with Ministre burundaise, Militante; 27, 11 new
    lang: fr
  - category: 21st-century_Burundian_politicians           # 36, 1 new
    lang: en
  - category: Burundian_women_in_politics                  # 38, 3 new
    lang: en
  - category: Burundian_politicians                        # 10 pages, 4 new
    lang: en
    depth: 0

census:
  # Offices the state has whether or not a seeded person's article named them.
  # Bodies are from the 2026-10-02 live measurement (labels, P31, P17 read in
  # full); nothing below is from memory. No `source` is given: none was checked
  # live, and a source is what lets a one-seat office pass on a single current
  # holder, so it is never guessed.
  #
  # Not here because an item exists: President `Q19057827`, Vice-President
  # `Q3556888` (since 2020), Prime Minister `Q52728003` (carries P576 1998 though
  # the office was restored in 2020), the portfolio ministers (`Q114296xxx`, all
  # P361 the Council of Ministers `Q16952177`), the Assembly presidency
  # `Q114296520`, and the Chief of the Defence Staff `Q137441699` -- which has no
  # P17/P1001, so the descent misses it; it is in the census below so that
  # mint-verify's live search surfaces it as `found` and mint-feed loads it.
  #
  # No `rn` labels are given: none of Burundi's ~30 office items carries one,
  # and a Kirundi label is not written here unchecked.

  - key: senate_president
    class: legislature.leadership
    archetype: speaker      # as the Assembly's presidency Q114296520: P279 Q1758037, P2389 the chamber
    body: Q3510838           # Senate (Burundi), P31 senate, P361 Parliament of Burundi
    labels:
      fr: président du Sénat du Burundi
      en: President of the Senate of Burundi

  - key: constitutional_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q28024351          # Constitutional Court of Burundi, P31 constitutional court
    labels:
      fr: président de la Cour constitutionnelle du Burundi
      en: President of the Constitutional Court of Burundi

  - key: supreme_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q137095            # Supreme Court of Burundi, P31 supreme court (its fr label wrongly reads "Cour constitutionnelle")
    labels:
      fr: président de la Cour suprême du Burundi
      en: President of the Supreme Court of Burundi

  - key: prosecutor_general
    class: judiciary.prosecution
    archetype: prosecutor_general
    # No body: no item for the Parquet général / Ministère public was found.
    labels:
      fr: procureur général de la République du Burundi
      en: Prosecutor General of Burundi

  - key: chief_of_defence_staff
    class: security.defence_command
    archetype: military_chief_of_staff
    body: Q852225            # Burundi National Defence Force (FDNB), P31 armed forces; no General Staff item
    labels:
      fr: chef d'état-major général de la Force de défense nationale du Burundi
      en: Chief of the Defence Staff of Burundi

  - key: snr_administrator_general
    class: security.intelligence
    archetype: agency_head
    body: Q27778932          # service national de renseignement, P31 security agency (fr label only)
    labels:
      fr: administrateur général du Service national de renseignement
      en: Administrator General of the National Intelligence Service of Burundi

  - key: police_director_general
    class: security.police
    archetype: agency_head
    body: Q27231045          # police nationale du Burundi, P31 police (Q6503214 is "law enforcement in Burundi", an aspect)
    labels:
      fr: directeur général de la Police nationale du Burundi
      en: Director General of the National Police of Burundi

  - key: central_bank_governor
    class: economic.central_bank
    archetype: central_bank_governor
    body: Q806937            # Bank of the Republic of Burundi, P31 central bank
    labels:
      fr: gouverneur de la Banque de la République du Burundi
      en: Governor of the Bank of the Republic of Burundi

  - key: cndd_fdd_secretary_general
    class: political.parties
    archetype: party_secretary
    body: Q2271402           # CNDD-FDD, P31 political party
    labels:
      fr: secrétaire général du CNDD-FDD
      en: Secretary General of the CNDD-FDD

  # Provincial governors. Q967's P150 still lists the 17 pre-2025 provinces with
  # no end qualifier, 16 of them carrying P576 2025 on their own items; of the
  # five 2025 provinces only Gitega (`Q720843`, reused for the new province) is
  # in P150. Buhumuza `Q131844468`, Bujumbura `Q15478219`, Burunga `Q131844612`
  # and Butanyerera `Q131844755` exist but are not, and Rumonge `Q20669646`
  # (2015-2025) is in neither state. So the expansion is cut to Gitega: the
  # dissolved provinces' governorships no longer exist, and the four new ones
  # cannot be anchored until P150 is corrected on Wikidata (the guard's
  # region-level check reads the same P150).
  - key: provincial_governor
    class: subnational.executive
    archetype: governor
    per: subdivisions
    exclude:
      - Q460538              # Bubanza (P576 2025)
      - Q1816580             # Bujumbura Mairie (P576 2025)
      - Q645043              # Bujumbura Rural (P576 2025)
      - Q431385              # Bururi (P576 2025)
      - Q645033              # Cankuzo (P576 2025)
      - Q505596              # Cibitoke (P576 2025)
      - Q735463              # Karuzi (P576 2025)
      - Q720848              # Kayanza (P576 2025)
      - Q600840              # Kirundo (P576 2025)
      - Q823740              # Makamba (P576 2025)
      - Q671086              # Muramvya (P576 2025)
      - Q822571              # Muyinga (P576 2025)
      - Q847718              # Mwaro (P576 2025)
      - Q720852              # Ngozi (P576 2025)
      - Q822566              # Rutana (P576 2025)
      - Q822578              # Ruyigi (P576 2025)
    labels:
      fr: gouverneur de la province de {name}
      en: Governor of {name}
