# Cyprus: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Cyprus run (the Republic): one PetScan query per entry.
  #
  # Measured 2026-10-14. OpenSanctions' wd_categories.yml has three `cy` entries:
  # en `Political_office-holders_in_Cyprus`, el `Κύπριοι_βουλευτές` and el
  # `Βουλευτές_ΙΒ΄_Κοινοβουλευτικής_Περιόδου_(Κύπρος)`; the first two are
  # replaced below by their tiers and the third is kept. el.wikipedia is the
  # regular wiki: it carries the portfolios, the deputy ministers, the House by
  # term, the independent officers (Attorney General and deputy, Auditor
  # General, Central Bank governors), the archbishops, the metropolitans and 31
  # per-town mayor categories. en adds a few ambassadors, judges and mayors.
  # Each entry gives the people PetScan returned and its marginal over the
  # entries above it, both with Northern Cyprus's people removed (below). The
  # whole seed is ~510 people.
  #
  # Northern Cyprus nests inside Cyprus on en: `Political_office-holders_in_Cyprus`
  # holds `Political_office-holders_in_Northern_Cyprus`, `Cypriot_politicians`
  # holds `Turkish_Cypriot_politicians`, and the per-century bags hold
  # Northern Cyprus's presidents and prime ministers; el's `Κύπριοι_πολιτικοί`
  # holds `Τουρκοκύπριοι_πολιτικοί`. A person keeps the stamp of the first run
  # that seeds them, so `cy-trnc` is seeded before this file; and no entry here
  # walks into those subtrees anyway. 80 people sit in the Northern Cyprus
  # trees; four of them are also reached here (Turkish Cypriot ministers and
  # members of the Republic's 1960 government and House), and stay `cy-trnc`'s.
  #
  # The current era is the House's ΙΒ΄ term (2021-2026) and the 2023 cabinet.
  # The ΙΓ΄ House, elected May 2026, has no category on either wiki yet; en's
  # list article of its members (2026-10-15) seeds the newcomers with articles.
  # The House is seeded by its last three terms (2011-2026) and that list.
  #
  # Left out: en `Political_office-holders_in_Cyprus` (0 own pages; a container
  # over Northern Cyprus's tree), `Cypriot_politician_stubs` (107; 29 of its
  # 32 new people are Northern Cyprus's), `21st-century_Cypriot_women_politicians`
  # (+5, two of them Northern Cyprus's, two first ladies),
  # `Greek_Cypriot_politicians_by_party` (+5, spouses and athletes), el
  # `Κύπριοι_πολιτικοί` (17 own pages, +10: ancient satraps, a poet and two
  # Turkish Cypriots), `Κύπριοι_πολιτικοί_ανά_κόμμα` (266, +0),
  # `Βουλευτές_στην_Κύπρο_ανά_εκλογική_περιφέρεια` (exactly the union of the
  # twelve term categories, +157 over the three kept: members of terms Α΄-Θ΄,
  # history), `Αντιπρόεδροι_της_Κύπρου` and en `Vice_presidents_of_Cyprus` (2:
  # Küçük and Denktaş, both Northern Cyprus's), the EU commissioners on both
  # wikis (4 and 5, +0: all are ministers or MEPs below), and en's presidents,
  # attorneys-general, party leaders and international judges (+0 each).
  # No category on either wiki holds the National Guard's chiefs, the police
  # chiefs, CySEC, the state companies, the Ombudsman, the district officers or
  # the District Local Government Organisations: those are census entries.

  # --- Head of state ---
  - category: Πρόεδροι_της_Κύπρου                                # 8; depth 0: eponymous Makarios III and spouses below
    lang: el
    depth: 0

  # --- Cabinet and deputy ministers ---
  - category: Υπουργοί_της_Κύπρου                                # 207, +204; depth 2: per portfolio, then per era
    lang: el
    depth: 2
  - category: Υφυπουργοί_της_Κύπρου                              # 22, +14; 8 deputy ministries
    lang: el
  - category: Government_ministers_of_Cyprus                     # 77, +12
    lang: en

  # --- House of Representatives: its presidents, the last three terms ---
  - category: Πρόεδροι_της_Βουλής_της_Κύπρου                     # 13, +7
    lang: el
    depth: 0
  - category: Βουλευτές_ΙΒ΄_Κοινοβουλευτικής_Περιόδου_(Κύπρος)   # 56, +49; 2021-2026
    lang: el
    depth: 0
  - category: Βουλευτές_ΙΑ΄_Κοινοβουλευτικής_Περιόδου_(Κύπρος)   # 61, +24; 2016-2021
    lang: el
    depth: 0
  - category: Βουλευτές_Ι΄_Κοινοβουλευτικής_Περιόδου_(Κύπρος)    # 63, +24; 2011-2016
    lang: el
    depth: 0
  - category: Members_of_the_House_of_Representatives_(Cyprus)   # 67, +17
    lang: en
  - article: List_of_members_of_the_parliament_of_Cyprus,_2026–2031  # 45 links, people among them
    lang: en

  # --- European Parliament ---
  - category: Ευρωβουλευτές_της_Κύπρου                           # 25, +14; by party
    lang: el
  - category: Members_of_the_European_Parliament_for_Cyprus      # 30, +2; depth 2: by term and by party
    lang: en
    depth: 2

  # --- Independent officers, central bank, courts ---
  - category: Ανεξάρτητοι_αξιωματούχοι_της_Κυπριακής_Δημοκρατίας # 12, +3; AG, deputy AG, Auditor General, CBC governors
    lang: el
  - category: Governors_of_the_Central_Bank_of_Cyprus            # 4, +1
    lang: en
    depth: 0
  - category: Κύπριοι_δικαστικοί                                 # 11, +2
    lang: el
    depth: 0
  - category: Supreme_Court_of_Cyprus_judges                     # 4, +2
    lang: en
    depth: 0
  - category: 21st-century_Cypriot_judges                        # 5, +3
    lang: en
    depth: 0

  # --- Diplomatic service ---
  - category: Ambassadors_of_Cyprus                              # 12, +9; depth 2: by host country, high commissioners
    lang: en
    depth: 2

  # --- Church of Cyprus ---
  - category: Αρχιεπίσκοποι_Κύπρου                               # 20, +17; depth 0: eponymous Makarios III below
    lang: el
    depth: 0
  - category: Archbishops_of_Cyprus                              # 17, +4; depth 0: eponymous Makarios III below
    lang: en
    depth: 0
  - category: Μητροπολίτες_της_Εκκλησίας_της_Κύπρου              # 20, +12; per see; depth 1 stops at Kition's Makarios III child
    lang: el

  # --- Mayors, including the displaced municipalities' ---
  - category: Δήμαρχοι_δήμων_της_Κύπρου                          # 89, +70; 31 per-town subcats
    lang: el
  - category: Mayors_of_places_in_Cyprus                         # 17, +6
    lang: en

  # --- Parties and catch-alls ---
  - category: Αρχηγοί_κυπριακών_κομμάτων                         # 20, +4; per party
    lang: el
  - category: Κύπριες_πολιτικοί                                  # 36, +2
    lang: el
    depth: 0

census:
  # Offices the Republic of Cyprus has whether or not a seeded person's article
  # named them. Bodies are from the 2026-10-14 live measurement (wbsearchentities,
  # CirrusSearch with `haswbstatement:P17=Q229`, the items read); nothing below is
  # from memory.
  #
  # Not here because an item exists and the load reaches it: the President, the
  # ministers of every era, the Government Spokesman, the Deputy Minister to the
  # President and the other deputy ministers (11 items, under "Cypriot deputy
  # minister" `Q66126505`), the President and Vice-President of the House, the
  # Attorney General (`Q19241145`) and his deputy (`Q96658008`), the Chief of the
  # National Guard General Staff (`Q19282969`), the Archbishop (`Q4070753`), the
  # six District Officers (`Q56251911` Nicosia and five more), and a mayoralty
  # for every one of the 31 municipality items with an en article (`Q16739079`;
  # the displaced municipalities' among them).
  #
  # No `per: units` entry. Every current municipality item already has its
  # mayoralty, so `mint_units` would draft nothing; the 2024 reform's merged
  # municipalities (Latsia-Geri, South Nicosia-Idalion, Paralimni-Deryneia,
  # Lefkara, Polemidia, Kourion, Akamas, Ierokipia) have no unit item at all, and
  # the loop creates no places. The District Local Government Organisations
  # have neither unit items nor an article, so their presidencies are a
  # `per: subdivisions` entry instead.
  #
  # Absent and not listed: the 2023 Court of Appeal's and the Supreme
  # Constitutional Court's bodies (no items), the metropolitans of the Church of
  # Cyprus (seeded; no archetype takes a see), the community leaders (248
  # per-village items already exist, batch-made, and no category names their
  # holders), the Accountant General, the Commissioners for the Environment and
  # for Gender Equality, and the head of the state broadcaster.

  # --- Judiciary: the 2023 split of the Supreme Court ---
  # July 2023: the single Supreme Court split again into a Supreme
  # Constitutional Court (nine judges) and a Supreme Court (seven).
  - key: supreme_court_judge
    class: judiciary.apex
    archetype: supreme_judge
    body: Q19201850          # The Supreme Court of Cyprus
    source: https://el.wikipedia.org/wiki/Ανώτατο_Δικαστήριο_Κύπρου
    labels:
      en: Judge of the Supreme Court of Cyprus
      el: Δικαστής του Ανωτάτου Δικαστηρίου Κύπρου

  - key: supreme_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q19201850
    # `Q23585879` "Chief Justice of Cyprus" holds two colonial-era justices (1898-1919).
    labels:
      en: President of the Supreme Court of Cyprus
      el: Πρόεδρος του Ανωτάτου Δικαστηρίου Κύπρου

  - key: supreme_constitutional_court_judge
    class: oversight.constitutional_body
    archetype: supreme_judge
    # No body: the Supreme Constitutional Court has no item.
    source: https://el.wikipedia.org/wiki/Ανώτατο_Δικαστήριο_Κύπρου
    labels:
      en: Judge of the Supreme Constitutional Court of Cyprus
      el: Δικαστής του Ανωτάτου Συνταγματικού Δικαστηρίου Κύπρου

  - key: supreme_constitutional_court_president
    class: oversight.constitutional_body
    archetype: court_president
    source: https://el.wikipedia.org/wiki/Ανώτατο_Δικαστήριο_Κύπρου
    labels:
      en: President of the Supreme Constitutional Court of Cyprus
      el: Πρόεδρος του Ανωτάτου Συνταγματικού Δικαστηρίου Κύπρου

  - key: court_of_appeal_judge
    class: judiciary.specialised
    archetype: judge
    # No body: the Court of Appeal has no item.
    source: https://el.wikipedia.org/wiki/Ανώτατο_Δικαστήριο_Κύπρου
    labels:
      en: Judge of the Court of Appeal of Cyprus
      el: Δικαστής του Εφετείου Κύπρου

  # --- Oversight: independent officers ---
  - key: auditor_general
    class: oversight.audit_anticorruption
    archetype: agency_head
    body: Q135487581         # Audit Office
    labels:
      en: Auditor General of the Republic of Cyprus
      el: Γενικός Ελεγκτής της Δημοκρατίας

  - key: ombudsman
    class: oversight.audit_anticorruption
    archetype: agency_head
    body: Q135490525         # Commissioner for Administration and the Protection of Human Rights (Ombudsman)
    labels:
      en: Commissioner for Administration and the Protection of Human Rights of Cyprus
      el: Επίτροπος Διοικήσεως και Προστασίας Ανθρωπίνων Δικαιωμάτων

  - key: data_protection_commissioner
    class: oversight.audit_anticorruption
    archetype: agency_head
    # The body item's en label is the office's title; its el label is the office.
    body: Q56056449          # Γραφείο Επιτρόπου Δεδομένων Προσωπικού Χαρακτήρα
    labels:
      en: Commissioner for Personal Data Protection of Cyprus
      el: Επίτροπος Προστασίας Δεδομένων Προσωπικού Χαρακτήρα

  # --- Economic: central bank, regulator, state companies ---
  - key: central_bank_governor
    class: economic.central_bank
    archetype: central_bank_governor
    body: Q74693             # Central Bank of Cyprus
    labels:
      en: Governor of the Central Bank of Cyprus
      el: Διοικητής της Κεντρικής Τράπεζας της Κύπρου

  - key: cysec_chair
    class: economic.regulators
    archetype: agency_head
    body: Q570231            # Cyprus Securities and Exchange Commission
    labels:
      en: Chairman of the Cyprus Securities and Exchange Commission
      el: Πρόεδρος της Επιτροπής Κεφαλαιαγοράς Κύπρου

  - key: eac_chair
    class: economic.soe_leadership
    archetype: soe_head
    body: Q5357793           # Electricity Authority of Cyprus
    labels:
      en: Chairman of the Electricity Authority of Cyprus
      el: Πρόεδρος της Αρχής Ηλεκτρισμού Κύπρου

  - key: cyta_chair
    class: economic.soe_leadership
    archetype: soe_head
    body: Q3565273           # Cyta
    labels:
      en: Chairman of the Cyprus Telecommunications Authority
      el: Πρόεδρος της Αρχής Τηλεπικοινωνιών Κύπρου

  - key: ports_authority_chair
    class: economic.soe_leadership
    archetype: soe_head
    body: Q5200482           # Cyprus Ports Authority
    labels:
      en: Chairman of the Cyprus Ports Authority
      el: Πρόεδρος της Αρχής Λιμένων Κύπρου

  # --- Security: police and intelligence ---
  - key: police_chief
    class: security.police
    archetype: agency_head
    body: Q5200481           # Cyprus Police
    labels:
      en: Chief of the Cyprus Police
      el: Αρχηγός της Αστυνομίας Κύπρου

  - key: intelligence_chief
    class: security.intelligence
    archetype: agency_head
    body: Q24915366          # Cyprus Intelligence Service
    labels:
      en: Head of the Cyprus Intelligence Service
      el: Διοικητής της Κυπριακής Υπηρεσίας Πληροφοριών

  # --- Districts: the District Local Government Organisations' presidents ---
  # Q229's P150 is the six districts, none ended. en.wikipedia's "Local government
  # reform (Cyprus)": "District councils called District Local Government
  # Organisations were created in each district [...] The president is directly
  # elected to a 5-year term, firstly on 9 June 2024." None has an item. Kyrenia
  # District is wholly outside the Republic's control and is left in: an
  # office nobody's article attests is skipped as `census/unattested`.
  - key: district_organisation_president
    class: subnational.executive
    archetype: governor
    per: subdivisions
    source: https://en.wikipedia.org/wiki/Local_government_reform_(Cyprus)
    labels:
      en: President of the District Local Government Organisation of {name}

corp:
  # Cyprus. Unitary: six districts, administered by the state (no regional
  # self-government).

  tiers: [national, regional]

  # Classes the type tree files under government organization or government
  # agency that are not government bodies here. None measured: no misfiled
  # class among the state actors read 2026-10-17.
  not_government: []

  # Never candidates here, beyond the global exclusions. Measured 2026-10-17
  # from the state actors' P127/P749 reach and the country's live items. None
  # measured.
  exclude:
    - {qid: Q10729872, name: medical association}  # 1 live, e.g. Q60743351 Cyprus Medical Association
  # The armed forces and the police, whose chiefs are officers and peploop's.
  # Measured 2026-10-17 among the kept candidates.
    - {qid: Q732717, name: law enforcement agency}  # 1 kept, Q5200481 Cyprus Police

  # State-only legal forms and types, matched exactly as P31 or P1454.
  # Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
  # statement, then all live items, in brackets. Measured thin: no item
  # carries a seat statement. Semi-government organisations (νομικά πρόσωπα
  # δημοσίου δικαίου) have no class on Wikidata.
  forms:
    - {qid: Q135905403, kind: institution, name: Cypriot government department}  # 0 (72 live)
    - {qid: Q135489653, kind: institution, name: government agency of Cyprus}  # 0 (63 live)

  roles: []

  # Official list of central-government holdings: the semi-government
  # organisations, resolved 2026-10-17 to items with an article; no lane reached
  # them (the Cypriot category carries no P971). Most semi-government bodies
  # (theatre, sports, tourism, health services organisations) have no item or
  # no article. Control is still read from each article.
  holdings:
    - source: "Υπουργείο Οικονομικών, Ημικρατικοί Οργανισμοί (semi-government organisations), https://www.mof.gov.cy/; QIDs via en.wikipedia (Government-owned companies of Cyprus) and the bodies' own articles"
      entries:
        - name: "Electricity Authority of Cyprus"
          qid: Q5357793
          holder: "Δημοκρατία της Κύπρου (semi-government organisation)"
          source: https://en.wikipedia.org/wiki/Electricity_Authority_of_Cyprus
        - name: "Cyprus Broadcasting Corporation"
          qid: Q1072242
          holder: "Δημοκρατία της Κύπρου (semi-government organisation)"
          source: https://en.wikipedia.org/wiki/Cyprus_Broadcasting_Corporation
        - name: "Central Bank of Cyprus"
          qid: Q74693
          holder: "Δημοκρατία της Κύπρου (semi-government organisation)"
          source: https://en.wikipedia.org/wiki/Central_Bank_of_Cyprus
        - name: "Cyprus Securities and Exchange Commission"
          qid: Q570231
          holder: "Δημοκρατία της Κύπρου (semi-government organisation)"
          source: https://en.wikipedia.org/wiki/Cyprus_Securities_and_Exchange_Commission
        - name: "Cyprus Organisation for Standardisation"
          qid: Q12879559
          holder: "Δημοκρατία της Κύπρου (semi-government organisation)"
          source: https://en.wikipedia.org/wiki/Cyprus_Organization_for_Standardization
        - name: "Cyprus Investment Promotion Agency"
          qid: Q5200463
          holder: "Δημοκρατία της Κύπρου (semi-government organisation)"
          source: https://en.wikipedia.org/wiki/Cyprus_Investment_Promotion_Agency

amlr:
  # Units: classes measured on Wikidata (2026-10-24).
  units:
    municipal:
    - {qid: Q16739079, name: municipality of Cyprus}
    grouping: []
    metro: []
