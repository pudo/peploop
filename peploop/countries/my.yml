  # --- Catch-alls ---
  - category: 21st-century_Malaysian_politicians            # 560, +50
    lang: en
    depth: 0
  - category: Malaysian_politician_stubs                    # 463, +54
    lang: en
    depth: 0

census:
  # Offices Malaysia has whether or not a seeded person's article named them.
  # Bodies are from the 2026-10-06 live measurement (wbsearchentities in en and
  # ms, then the items read in full); nothing below is from memory. No `source`
  # is given: none was checked live.
  #
  # Not here because an item exists and the descent loads it: the Yang
  # di-Pertuan Agong `Q174156` and his deputy `Q109766854`, the Raja Permaisuri
  # Agong `Q1136316`, the rulers of Perak, Kelantan, Pahang, Terengganu, Johor
  # and Selangor (`Q2649311` and siblings), the King of Perlis `Q28379750`, the
  # Yamtuan Besar `Q1572849`, the governors of Sabah `Q71309109` and Sarawak
  # `Q4205657`, every Menteri Besar and Chief Minister (Selangor's is
  # `Q6589950`, labelled "Menteris Besar"), the Premier of Sarawak `Q6566938`,
  # the Chief Secretary `Q5096922`, the Governor of the Central Bank
  # `Q23938077`, the Inspector-General of Police `Q56428167`, the Chief of
  # Defence Forces `Q20462450` and the three service chiefs, the Attorney
  # General `Q4818645`, the Auditor General `Q7362924`, the Chief Justice
  # `Q7362926`, the President of the Court of Appeal `Q60748996`, both Chief
  # Judges (`Q139374186`, `Q60544005`), the Election Commission's chairman
  # `Q61113497`, both chambers' members (`Q21290861`, `Q21328606`) and
  # presiding officers, the Mayor of Kuala Lumpur `Q12685557`, and the deputy
  # ministers (the `Q110133xxx` series, P279 deputy minister since peptree's
  # 2026-10-05 repair).
  #
  # In the census although an item exists, because the descent cannot reach it:
  # listing it lets mint-verify's live search surface it. The Yang di-Pertua
  # Negeri of Malacca `Q123398319` carries only P31; the Sultan of Kedah
  # `Q12517320` is scoped P17/P1001 to the historic Sultanate of Kedah.
  #
  # Absent and not listed, for want of an archetype: the parliamentary and
  # political secretaries. The per-ministry parliamentary secretaryships exist as
  # a `Q110133xxx` series with a Malay label, P17 Malaysia and no P31 (e.g.
  # `Q110133477`), which is a peptree repair, not a mint.

  # --- Head of state: rulers and governors not reachable ---
  - key: sultan_of_kedah
    class: executive.head_of_state
    archetype: governor
    body: Q188947            # Kedah (exists: Q12517320, scoped to the historic sultanate)
    labels:
      en: Sultan of Kedah
      ms: Sultan Kedah

  - key: governor_of_malacca
    class: subnational.executive
    archetype: governor
    body: Q185221            # Malacca (exists: Q123398319, P31 only)
    labels:
      en: Yang di-Pertua Negeri of Malacca
      ms: Yang di-Pertua Negeri Melaka

  - key: governor_of_penang
    class: subnational.executive
    archetype: governor
    body: Q188096            # Penang; no item found in en or ms
    labels:
      en: Yang di-Pertua Negeri of Penang
      ms: Yang di-Pertua Negeri Pulau Pinang

  # --- Judiciary ---
  - key: federal_court_judge
    class: judiciary.apex
    archetype: supreme_judge
    body: Q5440171           # Federal Court of Malaysia, highest court of appeals
    labels:
      en: Judge of the Federal Court of Malaysia
      ms: Hakim Mahkamah Persekutuan Malaysia

  - key: court_of_appeal_judge
    class: judiciary.apex
    archetype: judge
    body: Q5178325           # Court of Appeal of Malaysia
    labels:
      en: Judge of the Court of Appeal of Malaysia
      ms: Hakim Mahkamah Rayuan Malaysia

  # --- Oversight ---
  - key: macc_chief_commissioner
    class: oversight.audit_anticorruption
    archetype: agency_head
    body: Q6741935           # Malaysian Anti-Corruption Commission
    labels:
      en: Chief Commissioner of the Malaysian Anti-Corruption Commission
      ms: Ketua Pesuruhjaya Suruhanjaya Pencegahan Rasuah Malaysia

  # --- Sovereign wealth and SOEs ---
  - key: khazanah_managing_director
    class: economic.sovereign_wealth
    archetype: soe_head
    body: Q4382207           # Khazanah Nasional, sovereign wealth fund
    labels:
      en: Managing Director of Khazanah Nasional

  - key: petronas_president
    class: economic.soe_leadership
    archetype: soe_head
    body: Q221692            # Petronas, state-owned oil and gas company
    labels:
      en: President and Chief Executive Officer of Petronas

  - key: pnb_chairman
    class: economic.sovereign_wealth
    archetype: soe_head
    body: Q4206786           # Permodalan Nasional Berhad
    labels:
      en: Chairman of Permodalan Nasional Berhad

  - key: felda_chairman
    class: economic.soe_leadership
    archetype: soe_head
    body: Q112020            # Federal Land Development Authority, government agency
    labels:
      en: Chairman of the Federal Land Development Authority

  - key: tnb_chairman
    class: economic.soe_leadership
    archetype: soe_head
    body: Q1584297           # Tenaga Nasional, electricity company
    labels:
      en: Chairman of Tenaga Nasional
