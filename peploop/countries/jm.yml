# Jamaica: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Jamaican run: one PetScan query per entry.
  #
  # OpenSanctions' wd_categories.yml has no Jamaica entry, so every entry below
  # is measured here (2026-10-03). en.wikipedia is the only wiki with a political
  # tree; jam.wikipedia (Patois) has no politician categories worth a query. The
  # en tree is small and regular: `Political office-holders in Jamaica` holds
  # the cabinet (32 portfolio subcats), both chambers, the governors-general and
  # the prime ministers, beside the colonial tiers. Counts are distinct items per
  # entry with the marginal over the entries above it (MediaWiki categorymembers
  # + pageprops, because PetScan was timing out at the time of measurement);
  # ~470 distinct in all.
  #
  # The current era is the 1962 Independence Constitution, which is still in
  # force: one Westminster state since 6 August 1962, so no constitutional break
  # picks the era. The per-Parliament categories (10th-15th) stop at 2020 -- the
  # 16th Parliament (September 2025 election) has none yet -- so the era cannot
  # be chosen by category either, and every modern tier is seeded whole. The
  # depth is handled downstream: the scope gate (born within 90 years, or dead
  # within 5) sets the colonial-era chief justices and the pre-independence
  # ministers aside at fetch for one item read each, and
  # `policy.P39_MAX_ENDED_YEARS` (20) skips any tenure that ended before ~2006.
  # The catch-alls add few people, but they are the only route to the JDF and
  # police chiefs and the mayors, which have no category of their own.
  #
  # Left out, all colonial or not politically exposed: `Governors_of_Jamaica`
  # (74, +60, 1655-1962), `Members_of_the_House_of_Assembly_of_Jamaica` (45, +33,
  # abolished 1866), `Members_of_the_Legislative_Council_of_Jamaica` (13, +7),
  # `Members_of_the_Federal_Parliament_of_the_West_Indies_Federation` (19, +16,
  # 1958-1962), `Speakers_of_the_House_of_Assembly_of_Jamaica`, the colonial
  # secretaries and receiver generals, `Political_office-holders_in_Jamaica` at
  # depth 1 (284, +17: exactly those colonial tiers),
  # `Jamaican_justices_of_the_peace` (28, +17: an honour, not an office),
  # `Jamaican_officials_of_the_United_Nations` (9, +2: international civil
  # servants), and the 18th/19th-century politician categories. There is no
  # category for the custodes, the Leader of the Opposition, the President of the
  # Senate, the JDF chiefs or the police commissioners.

  # --- Head of state's representative, head of government, deputies ---
  - category: Governors-general_of_Jamaica                 # 9
    lang: en
    depth: 0
  - category: Prime_ministers_of_Jamaica                   # 11; d1 = their spouses
    lang: en
    depth: 0
  - category: Deputy_prime_ministers_of_Jamaica            # 10, +7
    lang: en
    depth: 0

  # --- Cabinet: 32 portfolio subcats, incl. ministers of state ---
  - category: Government_ministers_of_Jamaica              # 122, +102 (ministers of state: 13, +0)
    lang: en
  - category: Attorneys_general_of_Jamaica                 # 13, +8; d1 = the colony's
    lang: en
    depth: 0

  # --- Parliament: both chambers, the Speakers, the per-Parliament rolls ---
  - category: Members_of_the_House_of_Representatives_of_Jamaica   # 156 with the Speakers, +87
    lang: en
  - category: Members_of_the_Senate_of_Jamaica             # 59, +28
    lang: en
    depth: 0
  - category: Members_of_the_Parliament_of_Jamaica         # 10th-15th Parliaments; 206, +9
    lang: en

  # --- Judiciary: chief justices (mostly colonial: the scope gate drops them) ---
  - category: Chief_justices_of_Jamaica                    # 49, +47
    lang: en
    depth: 0
  - category: Jamaican_judges                              # women, by century, international; 76, +24
    lang: en
    depth: 2

  # --- Central bank ---
  - category: Governors_of_the_Bank_of_Jamaica             # 2, +2
    lang: en
    depth: 0

  # --- Subnational: only Kingston has a mayors category ---
  - category: Mayors_of_places_in_Jamaica                  # Kingston + women mayors; 14, +6
    lang: en

  # --- Diplomatic service ---
  - category: Ambassadors_of_Jamaica                       # 28 posts; 27, +19
    lang: en
  - category: Jamaican_diplomats                           # 17, +2
    lang: en
    depth: 2

  # --- Military and police ---
  - category: Jamaican_military_officers                   # 12, +11
    lang: en
  - category: Jamaican_police_officers                     # 5, +5
    lang: en
    depth: 0

  # --- Parties and catch-alls ---
  - category: Jamaican_politicians_by_party                # JLP 104, PNP 99; 203, +11
    lang: en
  - category: 21st-century_Jamaican_politicians            # 152, +5
    lang: en
  - category: Jamaican_women_in_politics                   # 66, +2
    lang: en
  - category: 20th-century_Jamaican_politicians            # 65, +10
    lang: en
  - category: Jamaican_politician_stubs                    # 162, +32
    lang: en
    depth: 0
  - category: Politicians_from_Kingston,_Jamaica           # 39, +12
    lang: en

census:
  # Offices the state has whether or not a seeded person's article named them.
  # Bodies are from the 2026-10-03 live measurement (labels, P31, P17, P361 read
  # in full with wbgetentities); nothing below is from memory. Which offices
  # exist is read from en `Order of precedence in Jamaica` (President of the Court
  # of Appeal, Chief of Staff of the JDF, Commissioner of Police, Auditor General,
  # Director of Public Prosecutions, "Mayors and Chairmen of Parish Councils"), from
  # en `2024 Jamaican local elections` (13 municipal corporations, each with a
  # mayorship) and from the parishes' own P36. No `source` is given: none was
  # checked as an official page, and a source is what lets a one-seat office
  # pass on a single current holder, so it is never guessed.
  #
  # Not here because an item exists (all P17 Q766):
  #   Governor-General Q1472951 (P31 Q4164871 but no P279: 9 of 12 realms' GGs
  #     carry P279 Q382844, so the gap is Wikidata's, not a mint);
  #   Prime Minister Q1430943, Deputy PM Q41513836, ~25 portfolio ministers and
  #     ~10 ministers of state (Q109928xxx, Q112109xxx, Q127425177 ...: P31
  #     Q294414, P279 Q83307, P361 Cabinet of Jamaica Q5015520);
  #   Attorney General Q4818640; Speaker Q6597927 and President of the Senate
  #     Q6594879 (both P279 Q1758037 speaker, P1001 only, no P2389);
  #   Leader of the Opposition Q6508542 (P279 Q620110);
  #   Chief Justice Q90824054 (P279 Q3188089, P361 Judiciary of Jamaica);
  #   Governor of the Bank of Jamaica Q109929141 (P2389 Q3374585);
  #   Chief of Defence Staff Q85751928 (P279 Q5097014, P2389 JDF Q720038; no
  #     P1001); mayor of Kingston Q109928803 (P1001 Kingston city Q34692);
  #   Member of the House Q21290859, Member of the Senate Q21295140.
  #
  # Not here because no archetype fits, and forcing one would shape a wrong item:
  #   - Custos rotulorum of each of the 14 parishes. The office exists per parish
  #     (Ministry Paper No. 2 of 1959, gazetted 1963: appointed by the GG on the
  #     PM's advice), and the class Q3699761 "Custos rotulorum" is P31 Q4164871
  #     with no P279. `governor` would make it P279 Q132050 and require a P150
  #     region, and Q766's P150 is the three historic counties, not the parishes.
  #     Needs a `custos` archetype (parent Q3699761, level: parish).
  #   - Integrity Commission (2018; absorbed the Contractor General): commissioners
  #     are a collegial seat and its executive director's title was not measured;
  #     no body item exists on Wikidata.
  #   - NWC, PCJ, JPS heads: no article states the title; only Petrojam's
  #     "general manager" is attested (en `Petroleum Corporation of Jamaica`).

  - key: court_of_appeal_president
    class: judiciary.apex
    archetype: court_president
    # No body: no Court of Appeal item exists; en `Court of Appeal of Jamaica`
    # redirects to `Judiciary of Jamaica` (Q17110917, no claims), which shares no
    # content word with the office.
    labels:
      en: President of the Court of Appeal of Jamaica

  - key: director_of_public_prosecutions
    class: judiciary.prosecution
    archetype: prosecutor_general
    body: Q127607300         # Office of the Director of Public Prosecutions of Jamaica, P31 government agency, P17 Q766
    labels:
      en: Director of Public Prosecutions of Jamaica

  - key: auditor_general
    class: oversight.audit_anticorruption
    archetype: agency_head
    # No body: no Auditor General's Department item was found.
    labels:
      en: Auditor General of Jamaica

  - key: commissioner_of_police
    class: security.police
    archetype: agency_head
    body: Q3160777           # Jamaica Constabulary Force, P31 national police + government agency, P361 MNS
    labels:
      en: Commissioner of Police of Jamaica

  - key: petrojam_general_manager
    class: economic.soe_leadership
    archetype: soe_head
    body: Q127429873         # Petrojam Limited, P31 government agency, P17 Q766
    labels:
      en: General Manager of Petrojam

  # Mayors. Each of the 13 municipal corporations elects a mayor (2024 local
  # elections); KSAMC's is the existing `Q109928803`, so 12 remain. The title is
  # the parish capital's (P36 of each parish item), which is how the one existing
  # item is scoped (P1001 the city, not the parish). Portmore's directly elected
  # mayor is not in that table and is left out. Kept as twelve entries because
  # `per: subdivisions` reads Q766's P150, which is the three historic counties.
  - key: mayor_montego_bay
    class: subnational.municipal
    archetype: mayor
    labels: {en: Mayor of Montego Bay}          # Saint James Q1421939, capital Q637555
  - key: mayor_spanish_town
    class: subnational.municipal
    archetype: mayor
    labels: {en: Mayor of Spanish Town}         # Saint Catherine Q1473663
  - key: mayor_may_pen
    class: subnational.municipal
    archetype: mayor
    labels: {en: Mayor of May Pen}              # Clarendon Q1095557
  - key: mayor_mandeville
    class: subnational.municipal
    archetype: mayor
    labels: {en: Mayor of Mandeville}           # Manchester Q920496
  - key: mayor_black_river
    class: subnational.municipal
    archetype: mayor
    labels: {en: Mayor of Black River}          # Saint Elizabeth Q1473646
  - key: mayor_savanna_la_mar
    class: subnational.municipal
    archetype: mayor
    labels: {en: Mayor of Savanna-la-Mar}       # Westmoreland Q1440250
  - key: mayor_lucea
    class: subnational.municipal
    archetype: mayor
    labels: {en: Mayor of Lucea}                # Hanover Q1131779
  - key: mayor_falmouth
    class: subnational.municipal
    archetype: mayor
    labels: {en: Mayor of Falmouth}             # Trelawny Q1123340
  - key: mayor_st_anns_bay
    class: subnational.municipal
    archetype: mayor
    labels: {en: Mayor of St. Ann's Bay}        # Saint Ann Q1326284
  - key: mayor_port_maria
    class: subnational.municipal
