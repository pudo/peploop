census:
  # Offices Angola has whether or not a seeded person's article named them.
  # Bodies are from the 2026-10-16 live measurement (wbsearchentities in pt,
  # the items read); nothing below is from memory.
  #
  # Not here because an item exists and the load reaches it: the President
  # `Q846091`, Vice-President `Q3382672`, the ministers (`Q1119455xx`,
  # `Q650816xx`, `Q1099846xx`), the National Assembly's president
  # `Q29960711`, the Attorney General `Q112038636`, the Chief of General Staff
  # `Q107490018`, the Governor of the National Bank `Q109984920`, the
  # presidency's secretaries (`Q1120402xx`), and the governors of the 18
  # provinces before the 2024 division (`Q974xxxxx`).
  #
  # Absent and not listed: the National Police and SINSE have no items; their
  # heads are listed without a body.
  #
  # The 2024 division (in force 2025) made 21 provinces of 18: Cuando and
  # Cubango from Cuando Cubango, Moxico Leste from Moxico, Ícolo e Bengo from
  # Luanda. The new units have items, typed province of Angola; their
  # governorships do not. A `per: subdivisions` entry drafts them, and finds
  # the 18 existing ones.

  # --- Sub-national: provincial governors ---
  - key: provincial_governor
    class: subnational.executive
    archetype: governor
    per: subdivisions
    exclude: [Q215268]       # Cuando Cubango, divided in 2024; its governorship has an item
    source: https://pt.wikipedia.org/wiki/Províncias_de_Angola
    labels:
      en: Governor of {name}
      pt: Governador Provincial de {name}

  # --- Judiciary: Constitutional and Supreme Courts, Court of Auditors ---
  - key: constitutional_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q113647558         # Constitutional Court of Angola, P17 Q916
    labels:
      en: President of the Constitutional Court of Angola
      pt: Presidente do Tribunal Constitucional de Angola

  - key: constitutional_court_judge
    class: judiciary.apex
    archetype: supreme_judge
    body: Q113647558
    labels:
      en: Judge of the Constitutional Court of Angola
      pt: Juiz do Tribunal Constitucional de Angola

  - key: supreme_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q97175182          # Supreme Court of Angola, P17 Q916
    labels:
      en: President of the Supreme Court of Angola
      pt: Presidente do Tribunal Supremo de Angola

  - key: supreme_court_judge
    class: judiciary.apex
    archetype: supreme_judge
    body: Q97175182
    labels:
      en: Judge of the Supreme Court of Angola
      pt: Juiz Conselheiro do Tribunal Supremo de Angola

  - key: court_of_auditors_president
    class: oversight.audit_anticorruption
    archetype: court_president
    body: Q122762652         # Tribunal de Contas, P17 Q916
    labels:
      en: President of the Court of Auditors of Angola
      pt: Presidente do Tribunal de Contas de Angola

  # --- Security: police and intelligence ---
  - key: police_commander_general
    class: security.police
    archetype: agency_head
    # No body: no item for the National Police of Angola was found.
    labels:
      en: Commander-General of the National Police of Angola
      pt: Comandante-Geral da Polícia Nacional de Angola

  - key: sinse_director
    class: security.intelligence
    archetype: agency_head
    # No body: no item for SINSE was found.
    labels:
      en: Director of the State Intelligence and Security Service of Angola
      pt: Diretor do Serviço de Inteligência e Segurança do Estado

  # --- State-owned enterprises ---
  - key: sonangol_chair
    class: economic.soe_leadership
    archetype: soe_head
    body: Q677832            # Sonangol Group, P17 Q916
    labels:
      en: Chairman of Sonangol
      pt: Presidente do Conselho de Administração da Sonangol

  # --- Parties: the leaders of the five parties in the 5th National Assembly ---
  # The verifier agreed with the drafted shape of MPLA's, UNITA's and FNLA's
  # leaderships at medium confidence (no sibling party-leader items in Angola
  # to compare with); as census anchors their bodies are measured here.
  - key: mpla_leader
    class: political.parties
    archetype: party_leader
    body: Q28551             # MPLA, P31 political party, P17 Q916
    labels:
      en: President of the MPLA
      pt: Presidente do MPLA

  - key: unita_leader
    class: political.parties
    archetype: party_leader
    body: Q28699             # UNITA, P31 political party, P17 Q916
    labels:
      en: President of UNITA
      pt: Presidente da UNITA

  - key: fnla_leader
    class: political.parties
    archetype: party_leader
    body: Q907051            # FNLA, P31 political party, P17 Q916
    labels:
      en: President of the FNLA
      pt: Presidente da FNLA

  - key: prs_leader
    class: political.parties
    archetype: party_leader
    body: Q1674856           # Social Renewal Party, P31 political party, P17 Q916
    labels:
      en: President of the Social Renewal Party
      pt: Presidente do Partido de Renovação Social

  - key: pha_leader
    class: political.parties
    archetype: party_leader
    body: Q113624556         # Humanist Party of Angola, P31 political party, P17 Q916
    labels:
      en: President of the Humanist Party of Angola
      pt: Presidente do Partido Humanista de Angola
