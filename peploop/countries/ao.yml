# Angola: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Angola run: one PetScan query per entry.
  #
  # OpenSanctions' wd_categories.yml has no Angola entry, so every entry below
  # is measured here (PetScan, 2026-10-16) and nothing is inherited. Counts are
  # distinct sitelinked items reached, then how many no earlier entry reached;
  # a list article's count is its links, people among them. The whole seed is
  # ~520 candidates.
  #
  # Neither wiki is regular on its own. en.wikipedia carries the cabinet (35
  # portfolio subcats, the Cabinet article) and the ambassadors;
  # pt.wikipedia's `Políticos de Angola` carries the deputies, the party
  # members and the century bags, with only four portfolio subcats. Both are
  # seeded, en first.
  #
  # The current era is the 2022 election's 5th National Assembly and
  # Lourenço's second government. No category of provincial governors exists
  # on either wiki; their holders are on Wikidata already (18 governor items
  # with holder statements), and only Cabinda's pt list article reaches them.
  #
  # Left out: `Angolan rebels`, `Angolan warlords` and `Revolucionários de
  # Angola` (civil-war figures); `FNLA` members (6, history); `Politicians from
  # Luanda` (birthplace bag); `Governors of the Bank of Angola` and
  # `21st-century Angolan women politicians` (0 new).

  # --- Head of state and government ---
  - category: Presidents_of_Angola                               # 5
    lang: en
    depth: 0
  - category: Vice_presidents_of_Angola                          # 4, 4 new
    lang: en
    depth: 0
  - category: Prime_ministers_of_Angola                          # 1975-2010; 7, 6 new
    lang: en
    depth: 0

  # --- Cabinet ---
  - article: Cabinet_of_Angola                                   # 208 links, 204 new
    lang: en
  - category: Government_ministers_of_Angola                     # 35 portfolio subcats; 95, 57 new
    lang: en
  - category: Ministros_de_Angola                                # 40, 3 new
    lang: pt
  - category: Attorneys_general_of_Angola                        # 4, 4 new
    lang: en
    depth: 0

  # --- National Assembly ---
  - article: 5th_National_Assembly_of_Angola                     # 7 links, 3 new
    lang: en
  - category: Members_of_the_National_Assembly_(Angola)          # 85, 47 new
    lang: en
  - category: Deputados_de_Angola                                # flat; 91, 50 new
    lang: pt
    depth: 0

  # --- Subnational ---
  - article: Lista_de_governadores_provinciais_de_Cabinda        # 16 links, 11 new
    lang: pt

  # --- Courts, diplomatic service ---
  - category: Angolan_judges                                     # 4, 4 new
    lang: en
  - category: Ambassadors_of_Angola                              # per receiver; 43, 19 new
    lang: en
  - category: Embaixadores_de_Angola                             # per receiver; 34, 2 new
    lang: pt

  # --- Parties ---
  - category: MPLA_politicians                                   # 112, 22 new
    lang: en
    depth: 0
  - category: UNITA_politicians                                  # 33, 11 new
    lang: en
    depth: 0
  - category: Membros_do_Movimento_Popular_de_Libertação_de_Angola  # 77, 21 new
    lang: pt
    depth: 0
  - category: Membros_da_UNITA                                   # 34, 6 new
    lang: pt
    depth: 0

  # --- Catch-alls ---
  - category: 21st-century_Angolan_politicians                   # 92, 9 new
    lang: en
    depth: 0
  - category: Políticos_angolanos_do_século_XXI                  # 46, 11 new
    lang: pt
    depth: 0
  - category: Angolan_politicians                                # flat bag; 25, 8 new
    lang: en
    depth: 0
  - category: Angolan_politician_stubs                           # 143, 4 new
    lang: en
    depth: 0
  - category: Políticos_de_Angola                                # own pages; 20, 3 new
