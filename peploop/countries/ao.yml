  # --- Wide: the rest of the government tree and the office-holding professions ---
  # Measured 2026-10-16 against everything above. `Foreign relations of Angola`
  # (314 new) and `Relações exteriores de Angola` (213 new) are mostly foreign
  # ambassadors and footballers' national-team categories, and are left out;
