# Kazakhstan: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Kazakh run: one PetScan query per entry.
  #
  # OpenSanctions' wd_categories.yml carries one `country: kz` entry,
  # `Political_office-holders_in_Kazakhstan` (en), which adds 6 people at depth 2
  # over the tiers below. ru.wikipedia is the regular wiki: a category per
  # portfolio, per Mäjilis convocation, per oblast and city akimate, per apex
  # court, per agency. kk.wikipedia is flatter and adds the vice-ministers; en adds
  # little beyond the Kurultai.
  #
  # The current era is the constitution approved on 2026-03-15 and in force from
  # 2026-07-01: the unicameral Kurultai (1st convocation elected 2026-08-23)
  # replaced the Mäjilis and the Senate. Seeded: the Kurultai, the last Mäjilis
  # (VIII, 2023-2026) and the Senate's one all-convocation bag, since the old
  # chambers' members held office months ago. `Министры_Казахстана` at depth 1
  # takes in the Kazakh SSR commissars (150); the scope gate sets the dead aside.
  # Left out: Mäjilis I-VII (VII +67, ended 2023), the ambassadors
  # (`Послы_Казахстана` +122: mint defers every ambassadorship and Wikidata has 2
  # outbound posts, so the run would pay for people it cannot place), district
  # akims (+22), `Государственные_деятели_Казахстана` (+52) and
  # `Политики_Казахстана` (+142), mostly history, and the generals' rank
  # categories. Counts are PetScan's on 2026-11-05 (people with a Wikidata item),
  # each with its marginal over the entries above it: ~1,120 distinct.

  # --- Head of state and government ---
  - category: Президенты_Казахстана                    # 2; d1 = the two presidencies' eponymous trees
    lang: ru
    depth: 0
  - category: Вице-президенты_Казахстана               # 2, +2
    lang: ru
    depth: 0
  - category: Премьер-министры_Казахстана              # 19, +18
    lang: ru
    depth: 0
  - category: Заместители_премьер-министра_Казахстана  # 56, +51
    lang: ru
    depth: 0

  # --- Cabinet and vice-ministers ---
  - category: Министры_Казахстана                      # 393, +333 (incl. the Kazakh SSR sibling)
    lang: ru
  - category: Заместители_министров_Казахстана         # 23, +15
    lang: ru
  - category: Қазақстан_вице-министрлері               # 50, +36
    lang: kk
    depth: 0
  - category: Government_ministers_of_Kazakhstan       # 192, +5
    lang: en

  # --- Government Office, Presidential Administration ---
  - category: Руководители_Аппарата_Правительства_Казахстана   # 8, +6
    lang: ru
    depth: 0
  - category: Сотрудники_администрации_президента_Казахстана   # 39, +13
    lang: ru
  - category: Советники_президента_Казахстана          # 28, +9
    lang: ru
    depth: 0
  - category: Қазақстан_Президентінің_Іс_басқарушылары # 8, +3
    lang: kk
    depth: 0

  # --- Agencies, audit, elections, ombudsman, prosecution ---
  - category: Председатели_Агентств_Республики_Казахстан   # 14, +5
    lang: ru
  - category: Председатели_Счетного_комитета_по_контролю_за_исполнением_республиканского_бюджета_Республики_Казахстан   # 7, +4
    lang: ru
    depth: 0
  - category: Председатели_Центральной_избирательной_комиссии_Казахстана   # 7, +3
    lang: ru
    depth: 0
  - category: Омбудсмены_Казахстана                    # 3, +3
    lang: ru
    depth: 0
  - category: Генеральные_прокуроры_Казахстана         # 11, +7
    lang: ru
    depth: 0

  # --- Apex courts, military command ---
  - category: Судьи_Верховного_Суда_Казахстана         # 31, +21
    lang: ru
  - category: Судьи_Конституционного_суда_Казахстана   # 15, +8
    lang: ru
  - category: Начальники_Генерального_штаба_Вооружённых_сил_Республики_Казахстан   # 11, +7
    lang: ru
    depth: 0

  # --- Kurultai (2026-) ---
