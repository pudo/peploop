census:
  # Offices Kazakhstan has whether or not a seeded person's article named them.
  # Bodies are from the 2026-11-05 live measurement (wbsearchentities, items
  # read); nothing below is from memory.
  #
  # Not here because an item exists and the load reaches it: the President
  # `Q5256775`, Prime Minister `Q2416315`, the (first) deputy prime ministers
  # `Q96377974` / `Q97358527`, ~30 ministries (`Q1077525xx`, `Q1277887xx`), the
  # Head of the Presidential Administration `Q109497247`, the State Counsellor
  # `Q19521638`, the Security Council secretary `Q108363284`, the KNB chairman
  # `Q109497278`, the Prosecutor General `Q109497304`, the National Bank governor
  # `Q109497334`, the Chief of the General Staff `Q60544014`, the Kurultai's member
  # `Q141159337`, chairman `Q140473689` and deputy chairman `Q141159567`, and the
  # Mäjilis's and Senate's member and chair items. Akim items exist for Astana,
  # Almaty and about a dozen regions; the per-subdivision entry finds them.
  # Kyzylorda Region has two akim items (`Q115693303`, 2 holders; `Q115603335`, 1).
  #
  # Absent and not listed: the Anti-Corruption Agency, the financial-market
  # regulator (ARDFM) and the Competition Agency have no items. Vice-ministers
  # come from the mentions (`deputy_minister`), not from here.
  #
  # The akim entry expands over 17 regions and the 3 cities of republican
  # significance: `P150` lacks the three 2022 regions (Abai, Jetisu, Ulytau),
  # which come in by their type. Baikonur (leased to Russia) is excluded.

  # --- Sub-national: the akims ---
  - key: akim
    class: subnational.executive
    archetype: governor
    per: subdivisions
    exclude:
      - Q165413              # Baikonur: leased to Russia, a head of administration, no akim
    labels:
      en: Akim of {name}

  # --- Judiciary: Supreme and Constitutional Courts ---
  - key: supreme_court_judge
    class: judiciary.apex
    archetype: supreme_judge
    body: Q4109099           # Supreme Court of Kazakhstan
    labels:
      ru: Судья Верховного суда Республики Казахстан
      en: Judge of the Supreme Court of Kazakhstan
  - key: supreme_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q4109099
    labels:
      ru: Председатель Верховного суда Республики Казахстан
      en: Chairman of the Supreme Court of Kazakhstan
  - key: constitutional_court_judge
    class: judiciary.apex
    archetype: supreme_judge
    body: Q4231510           # Constitutional Court of the Republic of Kazakhstan
    labels:
      ru: Судья Конституционного суда Республики Казахстан
      en: Judge of the Constitutional Court of Kazakhstan
  - key: constitutional_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q4231510
    labels:
      ru: Председатель Конституционного суда Республики Казахстан
      en: Chairman of the Constitutional Court of Kazakhstan

  # --- Oversight ---
  - key: election_commission_chair
    class: oversight.electoral_commission
    archetype: agency_head
    body: Q25451582          # Central Election Commission of Kazakhstan
    parent: Q140686          # chairperson: a chairman, not a director
    labels:
      ru: Председатель Центральной избирательной комиссии Республики Казахстан
      en: Chairman of the Central Election Commission of Kazakhstan
  - key: supreme_audit_chamber_chair
    class: oversight.audit_anticorruption
    archetype: agency_head
    body: Q127933733         # Supreme Audit Chamber (successor of the Accounts Committee)
    labels:
      ru: Председатель Высшей аудиторской палаты Республики Казахстан
      en: Chairman of the Supreme Audit Chamber of Kazakhstan
  - key: financial_monitoring_chair
    class: oversight.audit_anticorruption
    archetype: agency_head
    body: Q119296195         # Financial Monitoring Agency
    labels:
      ru: Председатель Агентства Республики Казахстан по финансовому мониторингу
      en: Chairman of the Financial Monitoring Agency of Kazakhstan
  - key: strategic_planning_chair
    class: oversight.state_councils
    archetype: agency_head
    body: Q140754065         # Agency for Strategic Planning and Reforms
    labels:
      ru: Председатель Агентства по стратегическому планированию и реформам Республики Казахстан
      en: Chairman of the Agency for Strategic Planning and Reforms of Kazakhstan
  - key: anti_corruption_chair
    class: oversight.audit_anticorruption
    archetype: agency_head
    # No body: no item for the Anti-Corruption Agency was found.
    labels:
      ru: Председатель Агентства Республики Казахстан по противодействию коррупции
      en: Chairman of the Anti-Corruption Agency of Kazakhstan
  - key: human_rights_commissioner
    class: oversight.constitutional_body
    archetype: agency_head
    labels:
      ru: Уполномоченный по правам человека в Республике Казахстан
      en: Commissioner for Human Rights of Kazakhstan

  # --- State enterprises: the sovereign fund and its largest groups ---
  - key: samruk_kazyna_head
    class: economic.sovereign_wealth
    archetype: soe_head
    body: Q4407014           # Samruk-Kazyna
    labels:
      ru: Председатель правления АО «Самрук-Казына»
      en: Chairman of the Management Board of Samruk-Kazyna
  - key: kazmunaygas_head
    class: economic.soe_leadership
    archetype: soe_head
    body: Q1417227           # KazMunayGas
    labels:
      ru: Председатель правления АО НК «КазМунайГаз»
      en: Chairman of the Management Board of KazMunayGas
  - key: kazatomprom_head
    class: economic.soe_leadership
    archetype: soe_head
    body: Q1590386           # Kazatomprom
    labels:
      ru: Председатель правления АО НАК «Казатомпром»
      en: Chairman of the Management Board of Kazatomprom
  - key: ktz_head
    class: economic.soe_leadership
    archetype: soe_head
    body: Q1069105           # Kazakhstan Temir Zholy
    labels:
      ru: Председатель правления АО НК «Қазақстан темір жолы»
      en: Chairman of the Management Board of Kazakhstan Temir Zholy

corp:
  # Kazakhstan. Unitary: 17 regions and 3 cities of republican significance.
  # The quasi-public sector sits under two holdings, Samruk-Kazyna and Baiterek;
  # the National Bank and the regulators are statutory bodies, not enterprises.

  tiers: [national, regional]
  not_government: []
  exclude: []

  # State-only legal forms (РГП, ГКП) not measured yet: none listed.
  forms: []

  roles: []

  # Samruk-Kazyna holds the state's major companies; QIDs from wbsearchentities,
  # read live 2026-11-05. Baiterek's item (`Q137551671`) is unlabelled and was
  # not read, so it is left out.
  holdings:
    - source: "Samruk-Kazyna portfolio (https://www.sk.kz/); entries' QIDs checked 2026-11-05"
      entries:
        - name: "АО «Самрук-Казына»"
          qid: Q4407014
          holder: "Республика Казахстан"
          source: https://www.wikidata.org/wiki/Q4407014
        - name: "АО НК «КазМунайГаз»"
          qid: Q1417227
          holder: "Самрук-Казына"
          source: https://www.wikidata.org/wiki/Q1417227
        - name: "АО НАК «Казатомпром»"
          qid: Q1590386
          holder: "Самрук-Казына"
          source: https://www.wikidata.org/wiki/Q1590386
        - name: "АО НК «Қазақстан темір жолы»"
          qid: Q1069105
          holder: "Самрук-Казына"
          source: https://www.wikidata.org/wiki/Q1069105
