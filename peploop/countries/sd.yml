# Sudan: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Sudan run: one PetScan query per entry.
  #
  # OpenSanctions' wd_categories.yml has no Sudan entry, so every entry below is
  # measured here (PetScan, 2026-10-15) and nothing is inherited. Counts are
  # distinct sitelinked items reached, then how many no earlier entry reached,
  # with South Sudan's people (`ss.yml`) already taken. The whole seed is ~380
  # people.
  #
  # en.wikipedia's tree is thin (`Political office-holders in Sudan`: 9 subcats,
  # no own pages) and ar.wikipedia adds about as much again: its
  # `أصحاب مناصب سياسية في السودان` and the flat `سياسيون سودانيون` bag reach
  # the Sovereignty Council, the 2019-2025 cabinets and governors en has no
  # article for. Both wikis nest South Sudan's people under Sudan's, so
  # `ss.yml` is seeded first and its people keep that run's stamp.
  #
  # The current era is the 2019 transition, the 2021 coup and the war since
  # April 2023: the Sovereignty Council, the Port Sudan cabinet and the state
  # governors; the RSF's rival Government of Peace and Unity (`Q132717949`,
  # 2025) is in the same articles. The National Legislature has not sat since
  # April 2019; its last members are seeded, and `policy.P39_MAX_ENDED_YEARS`
  # settles the rest. Presidents are seeded at depth 0: their parent `Heads of
  # state of Sudan` holds the Kings and Queens of Kush and the Funj sultans.
  #
  # Left out: `Heads of state of Sudan`, `Sudanese military personnel` below
  # depth 0 (Mahdist War fighters), `Members of the Sudanese House of
  # Representatives, elected in 1953`, `Anglo-Egyptian Sudan judges`, `Sudan
  # People's Liberation Movement politicians` (see `ss.yml`: shared, either run
  # would stamp the other's people), ar `وزراء سودانيون` (109, 0 new) and
  # `قادة دولة السودان` (66, 0 new), en `Members of the Transitional Sovereignty
  # Council` (8, 0 new), `Speakers of the National Assembly (Sudan)` (5, 0
  # new), `National Congress Party (Sudan) politicians` (25, 1 new: Bashir's
  # party). No category on either wiki holds the Bank of Sudan's
  # governors or the RSF's command: those are census entries.

  # --- Head of state, Sovereignty Council, head of government ---
  - category: Presidents_of_Sudan                                # 11, 11 new
    lang: en
    depth: 0
  - category: Vice_presidents_of_Sudan                           # 22, 16 new
    lang: en
    depth: 0

  # --- Cabinet: 25 portfolio subcats, the Sovereignty Council and prime ministers among them ---
  - category: Government_ministers_of_Sudan                      # 94, 71 new
    lang: en

  # --- National Legislature: National Assembly, Council of States ---
  - category: Members_of_the_National_Legislature_(Sudan)        # nested container; 32, 11 new
    lang: en
    depth: 3

  # --- Subnational: 11 state-governor subcats; the current governors' list ---
  - category: Governors_of_states_of_Sudan                       # 23, 15 new
    lang: en
  - article: List_of_current_state_governors_in_Sudan             # 176 links, people among them
    lang: en

  # --- Courts, military, police, diplomatic service ---
  - category: Chief_justices_of_Sudan                            # 7, 6 new
    lang: en
    depth: 0
  - category: Sudanese_judges                                    # own pages only; 3, 1 new
    lang: en
    depth: 0
  - category: Sudanese_generals                                  # with lieutenant generals; 29, 16 new
    lang: en
  - category: Sudanese_military_personnel                        # own pages only; 22, 12 new
    lang: en
    depth: 0
  - category: Sudanese_police_chiefs                             # 1, 1 new
    lang: en
    depth: 0
  - category: Ambassadors_of_Sudan                               # with UN representatives; 17, 7 new
    lang: en
  - category: Sudanese_diplomats                                 # own pages only; 2, 1 new
    lang: en
    depth: 0

  # --- en catch-alls ---
  - category: 21st-century_Sudanese_politicians                  # 59, 14 new
    lang: en
  - category: Sudanese_politicians                               # flat bag; 22, 14 new
    lang: en
    depth: 0
  - category: Sudanese_politician_stubs                          # 60, 8 new
    lang: en
    depth: 0
  - category: Sudanese_women_in_politics                         # 20, 3 new
    lang: en

  # --- ar: the office-holders' tree and the flat bags ---
  - category: أصحاب_مناصب_سياسية_في_السودان                      # 183, 86 new
    lang: ar
    depth: 2
  - category: سياسيون_سودانيون                                   # flat bag; 118, 71 new
    lang: ar
    depth: 0
  - category: بذرة_سياسي_سوداني                                  # stubs; 35, 3 new
    lang: ar
    depth: 0
  - category: سياسيات_سودانيات                                   # women; 28, 7 new
    lang: ar
  - category: سياسيون_سودانيون_حسب_القرن                         # by century; 64, 7 new
    lang: ar
    depth: 2

census:
  # Offices Sudan has whether or not a seeded person's article named them.
  # Bodies are from the 2026-10-15 live measurement (CirrusSearch with
  # `haswbstatement:P17=Q1049`, wbsearchentities, the items read); nothing below
  # is from memory.
  #
  # Not here because an item exists and the load reaches it: the President
  # `Q14948193`, the Chairman `Q112675151`, Deputy Chairman `Q112315913` and
  # members `Q112675154` of the Sovereignty Council, the Prime Minister
  # `Q30100623`, the portfolio ministers and ministers of state
  # (`Q112325xxx`, `Q112792xxx`), both chambers' members (`Q21328630`,
  # `Q21328588`) and the Speaker `Q112160021`, the state governors
  # (`Q112765xxx`), the Chief Justice `Q74020889`, the Governor of the Bank of
  # Sudan `Q112789998`, the head of the intelligence service `Q112674303`.
  # Twins, each a merge decision: Minister of Justice `Q136664945` / `Q112325297`;
  # Supreme Court `Q7644845` (sitelinked) / `Q113658987` (bare).
  #
  # The RSF's rival Government of Peace and Unity (`Q132717949`, P31 government,
  # P361 Rapid Support Forces, P17 Q1049; 2025) has no office items. Its offices
  # are their own items with that government as their body, so the Port Sudan
  # government's offices of the same title never take its people; its ministers
  # come from the mentions. Its Presidential Council has no item of its own, so
  # the council's president names the government as its body too.
  #
  # Absent and not listed: the police and the Public Prosecution have no items;
  # both heads are listed without a body.

  # --- The RSF's Government of Peace and Unity (2025) ---
  - key: gpu_presidential_council_president
    class: executive.head_of_state
    archetype: council_chair
    body: Q132717949         # Government of Peace and Unity, P31 government, P361 RSF
    source: https://en.wikipedia.org/wiki/Government_of_Peace_and_Unity
    labels:
      en: President of the Presidential Council of the Government of Peace and Unity
      ar: رئيس المجلس الرئاسي لحكومة السلام والوحدة

  - key: gpu_prime_minister
    class: executive.head_of_government
    archetype: head_of_government
    body: Q132717949
    source: https://en.wikipedia.org/wiki/Government_of_Peace_and_Unity
    labels:
      en: Prime Minister of the Government of Peace and Unity
      ar: رئيس وزراء حكومة السلام والوحدة

  # --- Judiciary: the Supreme and Constitutional Courts ---
  - key: supreme_court_justice
    class: judiciary.apex
    archetype: supreme_judge
    body: Q7644845           # Supreme Court of Sudan, P31 supreme court, P17 Q1049
    labels:
      en: Justice of the Supreme Court of Sudan
      ar: قاضي المحكمة العليا السودانية

  - key: constitutional_court_president
    class: oversight.constitutional_body
    archetype: court_president
    body: Q16117675          # Constitutional Court of Sudan, P31 constitutional court
    labels:
      en: President of the Constitutional Court of Sudan
      ar: رئيس المحكمة الدستورية في السودان

  - key: attorney_general
    class: judiciary.prosecution
    archetype: prosecutor_general
    # No body: no item for the Public Prosecution was found.
    labels:
      en: Attorney General of Sudan
      ar: النائب العام في السودان

  # --- Security: the armed forces, the RSF, the police ---
  - key: saf_chief_of_staff
    class: security.defence_command
    archetype: military_chief_of_staff
    body: Q371721            # Sudanese Armed Forces, P31 armed forces, P17 Q1049
    labels:
      en: Chief of the General Staff of the Sudanese Armed Forces
      ar: رئيس هيئة أركان القوات المسلحة السودانية

  - key: rsf_commander
    class: security.paramilitary
    archetype: military_chief_of_staff
    body: Q18210867          # Rapid Support Forces, P31 paramilitary organization, P17 Q1049
    labels:
      en: Commander of the Rapid Support Forces
      ar: قائد قوات الدعم السريع

  - key: police_director_general
    class: security.police
    archetype: agency_head
    # No body: no item for the Sudan Police Force was found.
    labels:
      en: Director General of the Sudan Police Force
      ar: المدير العام لقوات الشرطة السودانية

  # --- Oversight ---
  - key: auditor_general
    class: oversight.audit_anticorruption
    archetype: agency_head
    # No body: no item for the National Audit Chamber was found.
    labels:
      en: Auditor General of Sudan
      ar: المراجع العام في السودان

  - key: elections_commission_chair
    class: oversight.electoral_commission
    archetype: agency_head
    body: Q130420940         # Sudan National Elections Commission
    labels:
      en: Chairman of the National Elections Commission of Sudan
      ar: رئيس المفوضية القومية للانتخابات في السودان
