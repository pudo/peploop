# Spain: what the lanes know about it, one section per lane.

corp:
  # Spain. Unitary with 17 comunidades autónomas and two autonomous cities,
  # the regional tier.

  tiers: [national, regional]

  # Classes the type tree files under government organization or government
  # agency that are not government bodies here. Municipal and provincial
  # government, a later tier: 8130 ayuntamientos and 36 diputaciones are read
  # as state actors, and their libraries, archives and companies follow by
  # link; the global list keeps municipalities out as places, these are the
  # same bodies typed as government.
  not_government:

  # Never candidates here, beyond the global exclusions. Measured 2026-10-17
  # from the state actors' P127/P749 reach and the country's live items.
  # Libraries (772 main libraries, 461 libraries, 137 branches, prison and
  # museum libraries) and municipal archives flood the reach. The colegios
  # profesionales and cámaras de comercio administer themselves; the cajas de
  # ahorros are savings banks, not state banks.
  exclude:
    - {qid: Q7075, name: library}  # 936 live, e.g. Q5761148 Centro Cultural Hispano-Guineano
    - {qid: Q604177, name: Archivo municipal}  # 89 live, e.g. Q11906828 Arxiu Municipal de Rubí
    - {qid: Q29901574, name: colegio profesional}  # 74 live, e.g. Q106353884 Colegio Oficial de Médicos de Álava
    - {qid: Q1110684, name: regulatory college}  # 88 live, e.g. Q108440106 Colegio Oficial de Farmacéuticos de Toledo
    - {qid: Q897399, name: chamber of commerce and industry}  # 46 live, e.g. Q8353073 Cámara Oficial de Comercio, Industria y Navegación
    - {qid: Q2917176, name: caja de ahorros}  # 29 live, e.g. Q105764431 Caja de Ahorros Provincial de Albacete
    - {qid: Q10729872, name: medical association}  # 11 live, e.g. Q108409080 Colegio de Médicos de Guipúzcoa
  # Archives; police forces, whose chiefs are officers; the provincial
  # diputaciones, government at a tier not written. Measured 2026-10-17 among
  # the kept candidates. A ministry's own units (dirección general, secretaría
  # de estado, secretaría general, subsecretaría) are institutions.
    - {qid: Q166118, name: archives}  # 36 kept, e.g. Q15714810 Archivo General de Andalucía
    - {qid: Q35535, name: police}  # 6 kept, e.g. Q1143194 Cuerpo Nacional de Policía
    - {qid: Q3044930, name: diputación provincial}  # 6 kept, e.g. Q2917971 Diputación Provincial de Zaragoza

  # State-only legal forms and types, matched exactly as P31 or P1454.
  # Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
  # statement, then all live items, in brackets. Entidad pública empresarial
  # is in the Q270791 tree. Corporación de derecho público (8266, mostly
  # ayuntamientos, colegios and cámaras) is left out. Organismo público and
  # organismo autónomo carry a few island and municipal bodies.
  forms:
    - {qid: Q2881199, kind: institution, name: organismo público en España}  # 18 (192 live)
    - {qid: Q537929, kind: institution, name: organismo autónomo}  # 13 (45 live)
    - {qid: Q5659726, kind: institution, name: agencia estatal}  # 5 (14 live)
    - {qid: Q104601620, kind: institution, name: autoridad administrativa independiente}  # 6 live, e.g. Agencia Española de Protección de Datos (2026-10-19)

  roles: []

  # A part of a party typed so is its regional branch. Measured 2026-10-24
  # over the 174 parts of parties: the socialist, Podemos and United Left
  # federations are typed political organisation (49), the People's Party's
  # with a class of its own (7); the rest are typed as parties.
  party_branch_classes:
    - {qid: Q7210356, name: political organization}
    - {qid: Q46342540, name: regional organization of People's Party}

