# Northern Cyprus: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Northern Cyprus run: one PetScan query per entry.
  #
  # OpenSanctions' wd_categories.yml has one `cy-trnc` entry,
  # `Political_office-holders_in_Northern_Cyprus`; everything else is measured
  # here (PetScan, 2026-10-14). Counts are distinct sitelinked items reached,
  # then how many no earlier entry reached. The whole seed is 178 items, 176
  # of them people.
  #
  # tr.wikipedia carries the tiers: `Kuzey Kıbrıs'taki siyasi makam sahipleri`
  # holds the presidents, 18 portfolio subcats (with the prime ministers and
  # their deputies), the Assembly by term and the mayors of the Nicosia Turkish
  # Municipality; the Assembly has per-term children (`KKTC Cumhuriyet Meclisi
  # N. dönem milletvekilleri`, 10th = the 2022 election). en.wikipedia's tree
  # is small (presidents, 8 portfolio subcats, the Assembly flat, North
  # Nicosia's mayors) and is seeded beside it for the people tr lacks: tr's
  # presidents miss the sitting one, Tufan Erhürman.
  #
  # Northern Cyprus's tree sits *inside* Cyprus's on both wikis: en
  # `Political office-holders in Cyprus` has `Political office-holders in
  # Northern Cyprus` as a child and `Cypriot politicians` has `Turkish Cypriot
  # politicians`; tr `Kıbrıslı siyasetçiler` has `Kıbrıs Türkü siyasetçiler`.
  # A person keeps the stamp of the first run that seeds them, so this file is
  # seeded before `cy.yml`. No Turkish tree reaches it.
  #
  # The current era is the 1983 declaration; President Tufan Erhürman took
  # office in October 2025, Prime Minister Ünal Üstel in May 2022. Only the
  # Assembly is per term: the 10th (current) and the 9th (2018-2022) are
  # seeded; the rest of the tiers are seeded whole and the scope gate and
  # `policy.P39_MAX_ENDED_YEARS` handle the past.
  #
  # Left out: `Kıbrıs_Türkü_hukukçular` (lawyers, +2), en
  # `Turkish_Cypriot_politicians_by_party` and `Turkish_Cypriot_women_in_politics`
  # (+0 each), `Lists_of_mayors_of_places_in_Northern_Cyprus` (+0, a list
  # article), `KKTC_Cumhuriyet_Meclisi_üyeleri` at depth 2 (106, +0 over the
  # entries below), `Kuzey_Kıbrıs_Türk_Cumhuriyeti_siyasetçileri` at depth 2
  # (+2, the district rolls of every term since 1985), `Güvenlik_Kuvvetleri_Komutanlığı`
  # and `Kuzey_Kıbrıs'ta_polis` (no people), and `Kıbrıs Türkü siyasetçilerin
  # eşleri` (spouses).

  # --- Head of state ---
  - category: Kuzey_Kıbrıs_Türk_Cumhuriyeti_cumhurbaşkanları         # 5
    lang: tr
  - category: Presidents_of_Northern_Cyprus                         # 6, +1 (Erhürman)
    lang: en

  # --- Prime minister and cabinet: 18 portfolio subcats ---
  - category: Kuzey_Kıbrıs_Türk_Cumhuriyeti_bakanları               # 79, +74
    lang: tr
  - category: Government_ministers_of_Northern_Cyprus               # PMs under a subcat; 45, +8
    lang: en
    depth: 2

  # --- Assembly of the Republic: the current and last term, presidium ---
  - category: KKTC_Cumhuriyet_Meclisi_10._dönem_milletvekilleri      # 2022-; 39, +17
    lang: tr
  - category: KKTC_Cumhuriyet_Meclisi_9._dönem_milletvekilleri       # 2018-2022, by district; 37, +5
    lang: tr
  - category: KKTC_Cumhuriyet_Meclisi_başkanları                    # speakers; 13, +5
    lang: tr
  - category: KKTC_Cumhuriyet_Meclisi_başkan_yardımcıları           # deputy speakers; 11, +3
    lang: tr
  - category: Members_of_the_Assembly_of_the_Republic_(Northern_Cyprus)  # with its speakers; 38, +4
    lang: en

  # --- Courts and the central bank ---
  - category: Kuzey_Kıbrıs_Türk_Cumhuriyeti_Anayasa_Mahkemesi_başkanları  # 1, +1
    lang: tr
  - category: Turkish_Cypriot_judges                                # 1, +1
    lang: en
  - category: Kuzey_Kıbrıs_Türk_Cumhuriyeti_Merkez_Bankası_başkanları     # 1, +1
    lang: tr

  # --- Municipal: the Nicosia Turkish Municipality's mayors ---
  - category: Kuzey_Kıbrıs_belediye_başkanları                      # 9, +4
    lang: tr
  - category: Mayors_of_North_Nicosia                               # 5, +1
    lang: en

  # --- Diplomatic service ---
  - category: Kıbrıs_Türkü_diplomatlar                              # with the envoys to Turkey; 8, +6
    lang: tr
    depth: 2
  - category: Diplomats_for_Northern_Cyprus                         # 3, +3
    lang: en
    depth: 2

  # --- Party leaders ---
  - category: Kuzey_Kıbrıs_Türk_Cumhuriyeti'ndeki_siyasi_parti_genel_başkanları  # 5 parties; 20, +2
    lang: tr
  - category: Leaders_of_political_parties_in_Northern_Cyprus       # 11, +1
    lang: en

  # --- Catch-alls ---
  - category: Political_office-holders_in_Northern_Cyprus           # own pages; 1, +1
    lang: en
    depth: 0
  - category: Partilerine_göre_Kıbrıs_Türkü_siyasetçiler            # 9 parties; 112, +16
    lang: tr
  - category: Kıbrıs_Türkü_kadın_siyasetçiler                        # 21, +4
    lang: tr
  - category: Kuzey_Kıbrıs_Türk_Cumhuriyeti_siyasetçileri           # flat bag; 68, +4
    lang: tr
    depth: 0
  - category: Kıbrıs_Türkü_siyasetçiler                             # flat bag; 37, +7
    lang: tr
    depth: 0
  - category: Turkish_Cypriot_politicians                           # flat bag; 7, +2
    lang: en
    depth: 0
  - category: Kıbrıs_Türkü_siyasetçi_taslakları                     # 84, +2
    lang: tr
    depth: 0

census:
  # Offices Northern Cyprus has whether or not a seeded person's article named them.
  # Bodies are from the 2026-10-14 live measurement (the descent query on
  # Q23681, every item with `P17`/`P1001` Q23681 read by class, then
  # wbsearchentities in en and tr, the items read in full); nothing below is
  # from memory. No `source` is given: none was checked live.
  #
  # Not here because an item exists and the loader reaches it: the President
  # `Q2354210`, the Prime Minister `Q2662165`, the Deputy Prime Minister
  # `Q60745416`, the Foreign `Q108730544`, Education `Q116158287`, Interior
  # `Q116158290` and Transport `Q116158356` ministers, and the member of the
  # Assembly `Q34927065` with its 2018-2022 term seat `Q47167922` (47 holders
  # by `P2937` Q47167865, against 7 on the generic seat; the 2022 term item
  # `Q28219962` is a bare stub carrying P17 Q229). The other portfolios have
  # no item; 79 seeded ministers attest them, so they are left to the mention
  # lane.
  #
  # Homonyms that are not this state's offices: the mayors of Kyrenia
  # `Q56337019`, Famagusta `Q28077811`, Morphou `Q56459601`, Lefkoniko
  # `Q56459598`, Lysi `Q56459600` and Akanthou `Q56459587` are the Republic
  # of Cyprus's displaced municipalities (P17 Q229); the last four are reached
  # by the descent through their towns' P17 Q23681. `Q31188676`, en "Central
  # Bank of the TRNC", is Kıbrıs Faisal İslam Bankası, a commercial bank.
  #
  # No `per: units` entry: the 18 municipalities of the 2022 reform have no
  # common class. Eight are tr-only items with no P31 or P17 (`Q121259083`,
  # `Q121259084`, `Q121259085`, `Q121259092`, `Q121259093`, `Q121259094`,
  # `Q118958070`, `Q120635746`); the rest are municipality items or towns
  # shared with the Republic of Cyprus's tree (P17 Q229 and Q23681), whose en
  # articles describe the town, not the TRNC municipality, and four of which
  # already name the Republic's displaced mayoralty under `P1313`. The mayors
  # are listed one by one instead, as in `jm.yml`.

  # --- Legislature: no presiding-officer item ---
  - key: assembly_speaker
    class: legislature.leadership
    archetype: speaker
    body: Q1515950           # Assembly of the Republic, P31 unicameral legislature, P17 Q23681
    labels:
      en: Speaker of the Assembly of the Republic of Northern Cyprus
      tr: Cumhuriyet Meclisi Başkanı

  # --- Apex court, prosecution, audit ---
  - key: supreme_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q118956436         # Supreme Court of Northern Cyprus, P31 supreme court, P17 Q23681
    labels:
      en: President of the Supreme Court of Northern Cyprus
      tr: Yüksek Mahkeme Başkanı

  - key: supreme_court_judge
    class: judiciary.apex
    archetype: supreme_judge
    body: Q118956436         # sits also as the Constitutional Court (its tr label)
    labels:
      en: Judge of the Supreme Court of Northern Cyprus
      tr: Yüksek Mahkeme Yargıcı

  - key: attorney_general
    class: judiciary.prosecution
    archetype: prosecutor_general
    # No body: no item for the Attorney General's office was found.
    labels:
      en: Attorney General of Northern Cyprus
      tr: KKTC Başsavcısı

  - key: court_of_audit_president
    class: oversight.audit_anticorruption
    archetype: agency_head
    # No body: no item for the Court of Audit (Sayıştay) was found.
    labels:
      en: President of the Court of Audit of Northern Cyprus
      tr: KKTC Sayıştay Başkanı

  # --- Central bank ---
  - key: central_bank_governor
    class: economic.central_bank
    archetype: central_bank_governor
    body: Q5060424           # Central Bank of the TRNC, P31 central bank, P17 Q23681
    labels:
      en: Governor of the Central Bank of the Turkish Republic of Northern Cyprus
      tr: KKTC Merkez Bankası Başkanı

  # --- Security forces and police ---
  - key: security_forces_commander
    class: security.defence_command
    archetype: military_chief_of_staff
    body: Q1415784           # Security Forces Command, P31 military unit, P17 Q23681
    labels:
      en: Commander of the Security Forces of Northern Cyprus
      tr: Güvenlik Kuvvetleri Komutanı

  - key: police_director_general
    class: security.police
    archetype: agency_head
    body: Q6040843           # Directorate General for Police, P31 police; no P17
    labels:
      en: Director General of Police of Northern Cyprus
      tr: KKTC Polis Genel Müdürü

  # --- Religious affairs, foundations, state media, state enterprise ---
  - key: religious_affairs_head
    class: hybrid.religious_hierarchy
    archetype: agency_head
    # No body: no item for the Department of Religious Affairs was found; Talip
    # Atalay's tr infobox gives the title.
    labels:
      en: Head of Religious Affairs of Northern Cyprus
      tr: KKTC Din İşleri Başkanı

  - key: evkaf_director
    class: hybrid.parastatal_foundations
    archetype: agency_head
    body: Q31188703          # Evkaf Administration of Cyprus; no statements at all
    labels:
      en: Director General of the Evkaf Administration of Cyprus
      tr: Kıbrıs Vakıflar İdaresi Genel Müdürü

  - key: brt_director_general
    class: hybrid.state_media
    archetype: agency_head
    body: Q812587            # Bayrak Radyo Televizyon Kurumu, P31 television station, P17 Q23681
    labels:
      en: Director General of Bayrak Radio and Television Corporation
      tr: BRTK Genel Müdürü

  - key: kibtek_chair
    class: economic.soe_leadership
    archetype: soe_head
    body: Q6081756           # Kıbrıs Türk Elektrik Kurumu, P31 enterprise; no P17
    labels:
      en: Chairman of the Cyprus Turkish Electricity Authority
      tr: Kıbrıs Türk Elektrik Kurumu Yönetim Kurulu Başkanı

