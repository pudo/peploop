# Hungary: what the lanes know about it, one section per lane.

census:
  # The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
  # unit of 50,000 or more (`amlr.units`) that has no head office gets one from
  # `mint_units`, attested by the unit's own current P6 or its article's infobox.
  # 3 of the 4 existing head offices subclass mayor of a place in Hungary and
  # are labelled "X polgármestere".
  - key: amlr_municipal_head
    class: subnational.municipal
    archetype: mayor
    per: units
    of: amlr:municipal
    lang: hu
    title: polgármester
    labels:
      hu: "{name} polgármestere"
      en: "Mayor of {name}"
    parent: Q2922332                 # mayor of a place in Hungary
    sources:
      "*": https://hu.wikipedia.org/wiki/Polgármester

corp:
  # Hungary. Unitary: 19 megyék and Budapest.

  tiers: [national, regional]

  # Items that stand for the state here: the Hungarian State as a legal
  # person (14 links name it).
  actors:
    - {qid: Q137639798, kind: state, name: Magyar Állam}

  # Classes the type tree files under government organization or government
  # agency that are not government bodies here. None measured: no misfiled
  # class among the state actors read 2026-10-17.
  not_government: []

  # Never candidates here, beyond the global exclusions. Measured 2026-10-17
  # from the state actors' P127/P749 reach and the country's live items.
  # Köztestület covers the chambers and the academies, which administer
  # themselves.
  exclude:
    - {qid: Q1126018, name: köztestület}  # 8 live, e.g. Q1301877 Széchenyi Academy of Literature and Arts
    - {qid: Q897399, name: chamber of commerce and industry}  # 6 live, e.g. Q60165998 Budapesti Kereskedelmi és Iparkamara
  # Dry load 2026-10-17: prisons (35 kept), the public media's channels and
  # stations (programmes; the broadcaster Duna Média stays), the armed forces
  # and the police (officers are peploop's).
    - {qid: Q40357, name: prison}  # 35 kept, e.g. Q1242106 Pálhalma National Prison
    - {qid: Q1616075, name: television station}  # 15 kept, e.g. Q288964 M1
    - {qid: Q14350, name: radio station}  # 8 kept, e.g. Q502613 Kossuth Rádió
    - {qid: Q35535, name: police}  # e.g. Q1001785 Police in Rijeka

  # State-only legal forms and types, matched exactly as P31 or P1454.
  # Measured 2026-10-17: live items (P17 = the country, no P576) with any seat
  # statement, then all live items, in brackets. Költségvetési szerv
  # (budgetary organ, central and local) and közalapítvány are left out:
  # shared with local government.
  forms:
    - {qid: Q30570183, kind: institution, name: központi hivatal}  # 3 (9 live)
    - {qid: Q30559398, kind: institution, name: autonóm államigazgatási szerv}  # 2 (4 live)
    - {qid: Q30564537, kind: institution, name: önálló szabályozó szerv}  # 2 (2 live)

  roles: []

