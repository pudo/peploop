# Japan: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Japan run: one PetScan query per entry.
  #
  # OpenSanctions' wd_categories.yml names one Japan entry
  # (`Political_office-holders_in_Japan`), an en.wikipedia container far thinner
  # than ja's tree; every entry below is ja.wikipedia, measured with
  # `wikipedia.seed_category` on 2026-10-08, each with its size and its marginal
  # over the entries above it. The whole seed is ~14,100 distinct people.
  #
  # ja.wikipedia carries a regular tree: the Diet by era (令和, 平成, 昭和),
  # portfolios under 日本の国務大臣, the senior and parliamentary vice-ministers,
  # the administrative vice-ministers by ministry, governors and mayors by
  # prefecture and then by office, and one assembly category per prefecture.
  #
  # The current era is chosen two ways. The Diet is seeded by era from 平成
  # (1989) on: 令和 is the current era, and living 平成 members whose tenure ended
  # after 2006 are inside `policy.P39_MAX_ENDED_YEARS`. Every other tier has no
  # per-period child and is seeded whole, the scope gate dropping the dead at
  # fetch (prewar governors and ambassadors are most of the governor and
  # ambassador tiers) and the recency rule skipping old tenures.
  #
  # The run is deep by decision: every municipal mayor (the 47 per-prefecture
  # containers, one subcat per municipality) and every prefectural assembly.
  #
  # Left out: 昭和 Diet categories (history); `廃止自治体の市町村長` (253 subcats:
  # mayors of municipalities abolished in the 1999-2010 mergers, nearly all ended
  # more than 20 years ago); municipal and ward council members (not PEP grade);
  # `日本銀行の人物` at d1 (414, +390: Bank of Japan staff, so only the governor
  # and deputy-governor categories are seeded); `副知事` (1 page); `日本の官僚`
  # (several thousand civil servants; the administrative vice-ministers are the
  # politically exposed tier and are seeded); `日本の政治家秘書`; party
  # categories beyond the LDP's president and secretary-general (+1 and +2: the
  # party leaders are reached through the Diet); and the by-topic and eponymous
  # trees.

