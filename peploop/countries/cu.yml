# Cuba: what the lanes know about it, one section per lane.

seeds:
  # Wikipedia categories seeding the Cuban run: one PetScan query per entry.
  #
  # OpenSanctions' wd_categories.yml has no `country: cu` entry at all; Cuba is
  # reached there only through `Political_office-holders_in_North_America` at
  # depth 8. So every entry below is measured here, nothing is inherited.
  #
  # Cuba inverts the runbook's expectation about which wiki is regular. es's
  # `Políticos de Cuba` (223 pages, 32 subcats) is one flat bag whose subcats
  # are mostly the 1902–1959 republic (Secretarios de despacho, Senadores,
  # Cámara de Representantes), the Spanish Cortes (Diputados por el distrito
  # electoral de …, Senadores de España de la Restauración), the colonial
  # governors (Gobernantes de Cuba → Capitanes generales, four per-century
  # subcats) and 76 dissidents. There is no es category for the Council of
  # State, the Central Committee, the ministers by portfolio, the provincial
  # governors, the vice presidents or the central bank. en.wikipedia has the
  # tiered tree instead: `Government_ministers_of_Cuba` with 20 portfolio
  # subcats, `Governors_of_provinces_of_Cuba` (the 2020 governors, all eight
  # living), `Members_of_the_National_Assembly_of_People's_Power`,
  # `Vice_presidents_of_Cuba`, `Deputy_prime_ministers_of_Cuba`, 48 outbound
  # ambassadorships. So the English tree is seeded at depth 1 where it is the
  # container, not depth 0 only.
  #
  # The current era is the 2019 constitution: presidency, prime minister since
  # 2019, Council of State, ANPP X Legislatura (2023–2028), provincial governors
  # since 2020, the PCC Politburo and Central Committee. es has per-legislature
  # ANPP categories (I–IX) but no X, and VIII and IX hold one page each; the
  # `Nth Central Committee` en categories hold only list articles (PetScan
  # returns 0 people). Left out: `Políticos_de_Cuba` at depth 1 (+97 people, 34
  # of them living: dissidents, the Estefans, a Spanish politician) and depth 2
  # (+193), `Militares_de_Cuba` (275, independence-war officers, 15 living new
  # and undated), `Gobernantes_de_Cuba` (colonial), `Cuban_politicians` at depth
  # 1 (+85, living ones are Cuban-American US politicians and dissidents),
  # `Cuban_revolutionaries` (143), `Disidentes_de_Cuba` / `Cuban_dissidents`
  # (70 / 89, not PEPs), `Colonial_heads_of_Cuba` (47), and the eponymous
  # `Fidel Castro` / `Che Guevara` / `Silvio Rodríguez` categories that sit one
  # level under the party, president and legislature categories on both wikis
  # (family members, films, places) — which is why every entry that has one as
  # a child is depth 0. Counts are PetScan's on 2026-09-30: 521 distinct people,
  # of whom only 128 are living and born after 1936 — Cuba's wiki coverage is
  # mostly the dead.

  # --- Head of state and government ---
  - category: Presidentes_de_Cuba                    # 22, 1 living; d1 = Fidel Castro
    lang: es
    depth: 0
  - category: Primeros_ministros_de_Cuba             # 15, 1 living
    lang: es
    depth: 0
  - category: Presidents_of_Cuba                     # 27, 1 living; d1 = Fidel Castro (42 pages)
    lang: en
    depth: 0
  - category: Vice_presidents_of_Cuba                # 14, 2 living; no es equivalent
    lang: en
    depth: 0
  - category: Prime_ministers_of_Cuba                # 16, 2 living; d1 = Fidel Castro
    lang: en
    depth: 0
  - category: Deputy_prime_ministers_of_Cuba         # 5, 2 living
    lang: en
    depth: 0

  # --- Cabinet: es has one flat bag, en has the portfolios ---
  - category: Ministros_de_Cuba                      # 36, 18 living; d1 adds Secretarios de despacho (1902–1959)
    lang: es
    depth: 0
  - category: Government_ministers_of_Cuba           # container, 20 portfolio subcats; 131, 38 living
    lang: en

  # --- Party: Politburo and Central Committee count as exposed here ---
  - category: Miembros_del_Partido_Comunista_de_Cuba # 49, 25 living; d1 = Fidel Castro + Buró Político
    lang: es
    depth: 0
  - category: Miembros_del_Buró_Político_del_PCC     # 13, 7 living
    lang: es
    depth: 0
  - category: Communist_Party_of_Cuba_politicians    # 99, 54 living; d1 = Fidel Castro (42 pages)
    lang: en
    depth: 0
  - category: First_secretaries_of_the_Communist_Party_of_Cuba   # 4
    lang: en
    depth: 0
  # The `1st…8th_Central_Committee_of_the_Communist_Party_of_Cuba` en categories
  # hold 2–3 list articles each and no people: PetScan returns 0. Central
  # Committee membership has no category on either wiki and no P39 item.
  # - category: 8th_Central_Committee_of_the_Communist_Party_of_Cuba   # 0 people
  #   lang: en

  # --- Legislature: ANPP by legislature (es I–IX, no X), en members ---
  - category: Diputados_por_Legislatura_de_Cuba      # 9 subcats, 47, 24 living; d2 = Fidel Castro, Silvio Rodríguez
    lang: es
  - category: Members_of_the_National_Assembly_of_People's_Power   # 29 incl. 5 presidents, 17 living
    lang: en
  - category: Presidentes_de_la_Asamblea_Provincial_del_Poder_Popular_de_La_Habana   # 2
    lang: es
    depth: 0

  # --- Judiciary (no apex-court office item; Q7644899 is the court as a body) ---
  - category: Jueces_de_Cuba                         # 2
    lang: es
    depth: 0
  - category: Cuban_judges                           # 8, 2 living; d1 adds international courts
    lang: en
    depth: 0

  # --- Central bank: no category on either wiki; Q114436623 has 4 holders, last ends 2023 ---

  # --- Subnational: the 2020 governors are on en only; es mayors are pre-1959 ---
  - category: Governors_of_provinces_of_Cuba         # 8, all living — the 2020 governors
    lang: en
    depth: 0
  - category: Mayors_of_places_in_Cuba               # 13, 3 living
    lang: en
    depth: 0
  - category: Alcaldes_de_Cuba                       # La Habana + Matanzas; 19, 1 living
    lang: es
  - category: Concejales_de_Cuba                     # Ayuntamiento de La Habana; 6, 0 living
    lang: es

  # --- Diplomatic service: 48 en posts, 25 es posts, 17 Wikidata items ---
  - category: Diplomáticos_de_Cuba                   # 53, 7 living
    lang: es
    depth: 0
  - category: Embajadores_de_Cuba                    # 25 posts; 43, 7 living
    lang: es
  - category: Cuban_diplomats                        # 30, 12 living
    lang: en
    depth: 0
  - category: Ambassadors_of_Cuba                    # 48 posts; 58, 19 living
    lang: en
  - category: Permanent_representatives_of_Cuba_to_the_United_Nations   # + Geneva; 15, 6 living
    lang: en

  # --- Military and interior (no chief-of-staff or MININT category anywhere) ---
  - category: Generales_de_Cuba                      # 34, 6 living
    lang: es
    depth: 0
  - category: Policías_de_Cuba                       # 5
    lang: es
    depth: 0
  - category: Cuban_generals                         # 46, 4 living
    lang: en
    depth: 0
  - category: 21st-century_Cuban_military_personnel  # 5, 3 living
    lang: en
    depth: 0
  - category: Cuban_police_officers                  # 7, 1 living
    lang: en
    depth: 0

  # --- State enterprises: no category on either wiki (Empresas_estatales_de_Cuba is companies) ---

  # --- Catch-alls ---
  - category: Políticas_de_Cuba                      # 18, 10 living; d1 = Primeras damas
    lang: es
    depth: 0
  - category: 21st-century_Cuban_politicians         # 41 with the women's subcat, 29 living; Fidel Castro is also a child
    lang: en
  - category: Political_office-holders_in_Cuba       # container; 112, 37 living, 7 new after the tiers
    lang: en
  - category: Políticos_de_Cuba                      # 202, 31 living, 15 new living; d1 +97 (dissidents), d2 +193
    lang: es
    depth: 0

census:
  # Offices the state has whether or not a seeded person's article named them.
  # Bodies are from the 2026-10-01 measurement (docs/research/position_items.md §10).
  # No `source` is given: none has been checked, and a source is what lets a
  # one-seat office pass on a single current holder, so it is never guessed.
  # Central Committee membership is absent on purpose: it is recorded as P463 on
  # the body, not as a seat.

  - key: politburo_member
    class: political.parties
    archetype: politburo_member
    body: Q371402            # Partido Comunista de Cuba (no standing Politburo item)
    labels:
      es: miembro del Buró Político del Partido Comunista de Cuba
      en: member of the Politburo of the Communist Party of Cuba

  - key: second_secretary
    class: political.parties
    archetype: party_secretary
    body: Q30914590          # Comité Central del PCC
    labels:
      es: Segundo Secretario del Comité Central del Partido Comunista de Cuba
      en: Second Secretary of the Central Committee of the Communist Party of Cuba

  - key: council_of_state_member
    class: oversight.state_councils
    archetype: state_body_member
    body: Q1516390           # Consejo de Estado
    labels:
      es: miembro del Consejo de Estado de Cuba
      en: member of the Council of State of Cuba

  - key: supreme_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q7644899           # Tribunal Supremo Popular
    labels:
      es: Presidente del Tribunal Supremo Popular
      en: President of the People's Supreme Court of Cuba

  - key: prosecutor_general
    class: judiciary.prosecution
    archetype: prosecutor_general
    labels:
      es: Fiscal General de la República de Cuba
      en: Attorney General of Cuba

  - key: chief_of_general_staff
    class: security.defence_command
    archetype: military_chief_of_staff
    body: Q663472            # Fuerzas Armadas Revolucionarias (no General Staff item)
    labels:
      es: Jefe del Estado Mayor General de las Fuerzas Armadas Revolucionarias
      en: Chief of the General Staff of the Revolutionary Armed Forces

  - key: comptroller_general
    class: oversight.audit_anticorruption
    archetype: agency_head
    body: Q25408126          # Contraloría General de la República
    labels:
      es: Contralor General de la República de Cuba
      en: Comptroller General of Cuba

  - key: gaesa_president
    class: economic.soe_leadership
    archetype: soe_head
    body: Q113204847         # GAESA
    labels:
      es: Presidente Ejecutivo de GAESA
      en: Executive President of GAESA

  - key: provincial_governor
    class: subnational.executive
    archetype: governor
    per: subdivisions
    exclude:
      - Q115027              # Isla de la Juventud: a special municipality, no governor
    labels:
      es: Gobernador de la {Name}
      en: Governor of {name}
