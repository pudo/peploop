census:
  # Offices Zambia has whether or not a seeded person's article named them.
  # Bodies are from the 2026-10-16 live measurement (wbsearchentities, the
  # items read); nothing below is from memory.
  #
  # Not here because an item exists and the load reaches it: the President
  # `Q18985034`, Vice-President `Q19040410`, the portfolio ministers
  # (`Q453963xx`, `Q1099356xx`), the Speaker `Q6597956`, the Chief Justice
  # `Q110761815`, the Attorney General `Q109936142`, the Governor of the Bank
  # of Zambia `Q109936196`, and the commanders of the Defence Force, Army, Air
  # Force and National Service.
  #
  # Absent and not listed: the Anti-Corruption Commission, the Drug
  # Enforcement Commission, the Auditor-General's office, the DPP and the
  # Electoral Commission have no items. The Supreme Court item `Q110761827`
  # carries `P17` India; it is still the court's only item.
  #
  # The provinces are headed by a provincial minister, appointed by the
  # President from the National Assembly: a `per: subdivisions` entry over the
  # ten provinces, none of which has a head office.

  # --- Sub-national: the provincial ministers ---
  - key: provincial_minister
    class: subnational.executive
    archetype: governor
    per: subdivisions
    source: https://en.wikipedia.org/wiki/Provincial_minister_(Zambia)
    labels:
      en: Provincial Minister of {name}

  # --- Judiciary: Supreme and Constitutional Courts ---
  - key: supreme_court_judge
    class: judiciary.apex
    archetype: supreme_judge
    body: Q110761827         # Supreme Court of Zambia, P31 supreme court
    labels:
      en: Judge of the Supreme Court of Zambia

  - key: constitutional_court_judge
    class: judiciary.apex
    archetype: supreme_judge
    body: Q131598277         # Constitutional Court of Zambia (no P31 yet)
    labels:
      en: Judge of the Constitutional Court of Zambia

  - key: constitutional_court_president
    class: judiciary.apex
    archetype: court_president
    body: Q131598277
    labels:
      en: President of the Constitutional Court of Zambia

  # --- Security: the police ---
  - key: inspector_general_of_police
    class: security.police
    archetype: agency_head
    body: Q55638195          # Zambia Police Service
    labels:
      en: Inspector-General of Police of Zambia

  # --- Oversight, prosecution ---
  - key: auditor_general
    class: oversight.audit_anticorruption
    archetype: agency_head
    # No body: no item for the Office of the Auditor General was found.
    labels:
      en: Auditor General of Zambia

  - key: director_of_public_prosecutions
    class: judiciary.prosecution
    archetype: prosecutor_general
    # No body: no item for the National Prosecution Authority was found.
    labels:
      en: Director of Public Prosecutions of Zambia

  - key: anti_corruption_commission_dg
    class: oversight.audit_anticorruption
    archetype: agency_head
    # No body: no item for the Anti-Corruption Commission was found.
    labels:
      en: Director-General of the Anti-Corruption Commission of Zambia

  # --- State-owned enterprises ---
  - key: zesco_md
    class: economic.soe_leadership
    archetype: soe_head
    body: Q8063035           # ZESCO, P31 state-owned enterprise, P17 Q953
    labels:
      en: Managing Director of ZESCO

  - key: zccm_ih_ceo
    class: economic.soe_leadership
    archetype: soe_head
    body: Q145494            # ZCCM Investments Holdings, P17 Q953
    labels:
      en: Chief Executive Officer of ZCCM Investments Holdings

