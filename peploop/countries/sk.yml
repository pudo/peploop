# Slovakia: what the lanes know about it, one section per lane.

census:
  # The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
  # unit of 50,000 or more (`amlr.units`) that has no head office gets one from
  # `mint_units`, attested by the unit's own current P6 or its article's infobox.
  # Both existing head offices subclass mayor of a place in Slovakia.
  - key: amlr_municipal_head
    class: subnational.municipal
    archetype: mayor
    per: units
    of: amlr:municipal
    lang: sk
    title: primátor
    labels:
      sk: "primátor mesta {name}"
      en: "Mayor of {name}"
    parent: Q99356308                # mayor of a place in Slovakia
    sources:
      "*": https://sk.wikipedia.org/wiki/Primátor_(Slovensko)

