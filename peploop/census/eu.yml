# The heads of the Union's bodies and of the international organisations
# seated in its member states (EU AMLR, Reg. 2024/1624, Art. 2(1)(34)(vi) and
# the Union part of the Commission's list, C/2023/724). The scope is `eu`:
# rigour's European Union (Q458), whose P150 are the member states. Offices
# are labelled in English, French and German (`mint.SCOPE_LANGS`).
#
# Measured 2026-10-25 on WDQS (QLever was down): 210 live bodies typed an EU
# institution, body or decentralised agency (Q748720, Q4936585, Q112827555), or
# an intergovernmental organisation (Q245065, Q15285626, Q1345691) whose P159
# lies in a member state; 325 position items scoped to them (P2389, P1001,
# P642, P361) or held by their head (P2388). 39 bodies have a head office
# (15 EU, 24 IO); the 124 head and deputy offices among them carry no P17
# (120), name the body under P2389 (81), and P1001 the Union (41), the body
# (31) or nothing (47); 73% carry a French label and 56% a German one, but
# the agency heads and lesser IO heads mostly carry neither.
#
# Not here because the office exists and is scoped to its body: the
# Presidents of the Commission (Q8882), the European Council (Q735587), the
# Parliament (Q740126), the ECB (Q605440), the Court of Auditors
# (Q17591244), the Court of Justice (Q55152497), the Committee of the Regions
# (Q131521421), the EIB (Q129186963, its Vice-President Q50233463), Eurojust
# (Q141065345); the High Representative (Q634291); the Secretaries-General of
# the Commission (Q19720821), the Council (Q3954362), the Parliament
# (Q129691749), the EESC (Q7444242); the European Ombudsman (Q138338507), the
# European Chief Prosecutor (Q67916516), EFSA's Executive Director
# (Q65592915), the Director General of the EU Military Staff (Q48742949); and
# for the organisations the heads of the OECD (Q27929540), IAEA (Q65782205),
# ESA (Q5280526), OPEC (Q6596647, Q108861095), UNESCO (Q28784183), FAO
# (Q66566041), OSCE (Q110934652), ITER (Q101069609), NATO (Q167662), the
# Council of Europe (Q2942251), Interpol (Q111170012, Q19698214), the ICC
# (Q7241113) and the ICJ (Q19926443). Their holders are the person lane's.
#
# Listed below: each body's head, by the title its infobox gives, where no
# office is scoped to it. A body's own head statement (`holder`) and its
# English infobox attest the holder (`mint_units.body_head`); labels are
# written by hand from the body's own French and German names, and left out
# where the body has none in that language. An international organisation's
# office governs the organisation (`polity`), not the Union.
#
# Left out: deputies (the bodies' infoboxes rarely name them and no seeded
# person attests them; the person lane's), the Commission's directorates-
# general and services (Eurostat, the JRC, OLAF, EPSO, the Publications
# Office), the EEAS's departments, the Council's committees (Coreper, PSC,
# EFC: their members are national officials), representations and liaison
# offices, the European Data Protection Supervisor (the body is the office),
# rotating chairs (BEREC, FATF, UNSCEAR), parliamentary assemblies and
# groups, and bodies that are no organisation of states (the Hague Group,
# the Assembly of European Regions, INTOSAI, IHRA, MeteoAlarm). Not seated
# in a member state though P159 says so: IOM (Geneva), the Pacific Community
# (Nouméa), Intelsat, UNFICYP.

