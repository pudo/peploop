# The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
# unit of 50,000 or more (`amlr.units`) that has no head office gets one from
# `mint_units`, attested by the unit's own current P6 or its article's infobox.
# Parents measured 2026-10-24 over the level's existing head offices.
#
# Of 54 municipal head offices, 24 subclass lord mayor (Oberbürgermeister) and
# 23 mayor of a place in Germany. Every district already has its Landrat
# (292 of 294 subclass `Q514725`), so the grouping level is not here.
- key: amlr_municipal_head
  class: subnational.municipal
  archetype: mayor
  per: units
  of: amlr:municipal
  lang: de
  title: Bürgermeister
  labels:
    de: "{title} von {name}"
    en: "Mayor of {name}"
    en/Oberbürgermeister: "Lord Mayor of {name}"
  parents:
    Oberbürgermeister: Q109862464  # lord mayor
    Bürgermeister: Q17175157       # mayor of a place in Germany
  sources:
    "*": https://de.wikipedia.org/wiki/Bürgermeister
