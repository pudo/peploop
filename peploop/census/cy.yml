# --- Districts: the District Local Government Organisations' presidents ---
# Q229's P150 is the six districts, none ended. en.wikipedia's "Local government
# reform (Cyprus)": "District councils called District Local Government
# Organisations were created in each district [...] The president is directly
# elected to a 5-year term, firstly on 9 June 2024." None has an item. Kyrenia
# District is wholly outside the Republic's control and is left in: an
# office nobody's article attests is skipped as `census/unattested`.
- key: district_organisation_president
  class: subnational.executive
  archetype: governor
  per: subdivisions
  source: https://en.wikipedia.org/wiki/Local_government_reform_(Cyprus)
  labels:
    en: President of the District Local Government Organisation of {name}
