# Offices China has whether or not a seeded person's article named them, for
# the 31 mainland provincial units and the 32 major cities of seeds/cn.yml.
# Every body was measured 2026-10-16 from the zh.wikipedia article of that
# name (`page_item`), its zh label read back; nothing below is from memory.
#
# Not here because an item exists and the load reaches it: all 31 provincial
# Party secretaries (each subclasses `Q30067901` or `Q15921367`, 18 of them
# without `P1001`), the mayors of the four municipalities, the governors or
# chairmen of Heilongjiang, Jilin, Shanxi, Jiangsu, Anhui, Fujian, Shandong,
# Henan, Hubei, Guizhou, Shaanxi, Guangxi and Tibet, Hangzhou's Party
# secretary, and the mayors of Changchun, Shenyang, Nanjing, Qingdao,
# Guangzhou, Shenzhen, Shijiazhuang, Changsha and Haikou.
#
# The city secretaryships subclass `Q988456` (committee secretary of the
# CCP), which the provincial class `Q30067901` subclasses; the archetype's
# default, general secretary (`Q6501749`), is a party's leader, not a
# committee's. Measured 2026-10-18: `Q988456` reaches `Q836971` and position.
#
# Twins, a merge decision for the closing report, not written onto: the Party
# secretaries of Beijing (`Q17279089` / `Q132717324`), Shanghai (`Q17281246` /
# `Q132717321`), Zhejiang (`Q17280145` / `Q132717333`), Liaoning (`Q17279690`
# / `Q133154523`) and Jiangxi (`Q46321961` / `Q133155103`).
#
# Sixteen cities had no item for their municipal Party committee, which
# `party_secretary` requires as its body; the committees were created
# 2026-10-16 (QS3 batch 60265, `Q141749447`–`Q141749475`) and their
# secretaryships are listed below with the others.
#
# Absent and not listed, for want of a body item: the provincial discipline
# commission secretaries (bodies not measured).
#
# `per: subdivisions` is not used: Q148's P150 also holds Hong Kong, Macau and
# eight Ming and Qing provincial commissions (`Q10447355`, `Q10946792`, …),
# and the provinces' titles differ by kind (省长, 主席, 市长).

