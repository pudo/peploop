# The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
# unit of 50,000 or more (`amlr.units`) that has no head office gets one from
# `mint_units`, attested by the unit's own current P6 or its article's infobox.
# Parents measured 2026-10-24 over the level's existing head offices: of 17
# municipal ones, 10 subclass mayor of a place in Poland and 9 city president,
# labelled with the city in the genitive.
# No powiat has a head office, so the starosta subclasses the title itself.
# The Upper Silesian metropolis (GZM) is led by a board, not one head: not here.
- key: amlr_municipal_head
  class: subnational.municipal
  archetype: mayor
  per: units
  of: amlr:municipal
  lang: pl
  title: prezydent miasta
  labels:
    # The city in the genitive, as the existing ones are ("prezydent Gdańska"),
    # read off the city's own article.
    pl: "prezydent {genitive}"
    pl/burmistrz: "burmistrz {genitive}"
    en: "Mayor of {name}"
  parents:
    prezydent miasta: Q15264424    # city president
    burmistrz: Q99247352           # mayor of a place in Poland
  sources:
    "*": https://pl.wikipedia.org/wiki/Prezydent_miasta

- key: amlr_grouping_head
  class: subnational.municipal
  archetype: grouping_head
  per: units
  of: amlr:grouping
  lang: pl
  title: starosta
  labels:
    pl: "starosta {name}"          # "starosta poznański", as the office is styled
    en: "Starost of {name}"
  forms:
    pl: [["^[Pp]owiat ", ""]]
  parent: Q7231714                 # starosta
  sources:
    "*": https://pl.wikipedia.org/wiki/Starosta
