# Offices Sudan has whether or not a seeded person's article named them.
# Bodies are from the 2026-10-15 live measurement (CirrusSearch with
# `haswbstatement:P17=Q1049`, wbsearchentities, the items read); nothing below
# is from memory.
#
# Not here because an item exists and the load reaches it: the President
# `Q14948193`, the Chairman `Q112675151`, Deputy Chairman `Q112315913` and
# members `Q112675154` of the Sovereignty Council, the Prime Minister
# `Q30100623`, the portfolio ministers and ministers of state
# (`Q112325xxx`, `Q112792xxx`), both chambers' members (`Q21328630`,
# `Q21328588`) and the Speaker `Q112160021`, the state governors
# (`Q112765xxx`), the Chief Justice `Q74020889`, the Governor of the Bank of
# Sudan `Q112789998`, the head of the intelligence service `Q112674303`.
# Twins, each a merge decision: Minister of Justice `Q136664945` / `Q112325297`;
# Supreme Court `Q7644845` (sitelinked) / `Q113658987` (bare).
#
# The RSF's rival Government of Peace and Unity (`Q132717949`, P31 government,
# P361 Rapid Support Forces, P17 Q1049; 2025) has no office items. Its offices
# are their own items with that government as their body, so the Port Sudan
# government's offices of the same title never take its people; its ministers
# come from the mentions. Its Presidential Council has no item of its own, so
# the council's president names the government as its body too.
#
# Absent and not listed: the police and the Public Prosecution have no items;
# both heads are listed without a body.

# --- The RSF's Government of Peace and Unity (2025) ---
- key: gpu_presidential_council_president
  class: executive.head_of_state
  archetype: council_chair
  body: Q132717949         # Government of Peace and Unity, P31 government, P361 RSF
  source: https://en.wikipedia.org/wiki/Government_of_Peace_and_Unity
  labels:
    en: President of the Presidential Council of the Government of Peace and Unity
    ar: رئيس المجلس الرئاسي لحكومة السلام والوحدة

- key: gpu_prime_minister
  class: executive.head_of_government
  archetype: head_of_government
  body: Q132717949
  source: https://en.wikipedia.org/wiki/Government_of_Peace_and_Unity
  labels:
    en: Prime Minister of the Government of Peace and Unity
    ar: رئيس وزراء حكومة السلام والوحدة

