# The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
# unit of 50,000 or more (`amlr.units`) that has no head office gets one from
# `mint_units`, attested by the unit's own current P6 or its article's infobox.
# Parents measured 2026-10-24 over the level's existing head offices: 3 of 5
# subclass mayor of a place in Austria.
- key: amlr_municipal_head
  class: subnational.municipal
  archetype: mayor
  per: units
  of: amlr:municipal
  lang: de
  title: Bürgermeister
  labels:
    de: "Bürgermeister von {name}"
    en: "Mayor of {name}"
  parent: Q99578454                # mayor of a place in Austria
  sources:
    # B-VG Art. 117(1)(c): every municipality has a Bürgermeister.
    "*": https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000138
