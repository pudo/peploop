# The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
# unit of 50,000 or more (`amlr.units`) that has no head office gets one from
# `mint_units`, attested by the unit's own current P6 or its article's infobox.
# The existing head offices subclass mayor of a place in Croatia. The forms put
# the city in the genitive ("gradonačelnik Grada Rijeke").
- key: amlr_municipal_head
  class: subnational.municipal
  archetype: mayor
  per: units
  of: amlr:municipal
  lang: hr
  title: gradonačelnik
  labels:
    hr: "gradonačelnik Grada {name}"
    en: "Mayor of {name}"
  forms:
    hr: [["^Velika Gorica$", "Velike Gorice"], ["a$", "e"], ["ar$", "ra"], ["k$", "ka"]]
  parent: Q99247863                # mayor of a place in Croatia
  sources:
    "*": https://en.wikipedia.org/wiki/Local_government_in_Croatia
