# Offices Northern Cyprus has whether or not a seeded person's article named them.
# Bodies are from the 2026-10-14 live measurement (the descent query on
# Q23681, every item with `P17`/`P1001` Q23681 read by class, then
# wbsearchentities in en and tr, the items read in full); nothing below is
# from memory. No `source` is given: none was checked live.
#
# Not here because an item exists and the loader reaches it: the President
# `Q2354210`, the Prime Minister `Q2662165`, the Deputy Prime Minister
# `Q60745416`, the Foreign `Q108730544`, Education `Q116158287`, Interior
# `Q116158290` and Transport `Q116158356` ministers, and the member of the
# Assembly `Q34927065` with its 2018-2022 term seat `Q47167922` (47 holders
# by `P2937` Q47167865, against 7 on the generic seat; the 2022 term item
# `Q28219962` is a bare stub carrying P17 Q229). The other portfolios have
# no item; 79 seeded ministers attest them, so they are left to the mention
# lane.
#
# Homonyms that are not this state's offices: the mayors of Kyrenia
# `Q56337019`, Famagusta `Q28077811`, Morphou `Q56459601`, Lefkoniko
# `Q56459598`, Lysi `Q56459600` and Akanthou `Q56459587` are the Republic
# of Cyprus's displaced municipalities (P17 Q229); the last four are reached
# by the descent through their towns' P17 Q23681. `Q31188676`, en "Central
# Bank of the TRNC", is Kıbrıs Faisal İslam Bankası, a commercial bank.
#
# No `per: units` entry: the 18 municipalities of the 2022 reform have no
# common class. Eight are tr-only items with no P31 or P17 (`Q121259083`,
# `Q121259084`, `Q121259085`, `Q121259092`, `Q121259093`, `Q121259094`,
# `Q118958070`, `Q120635746`); the rest are municipality items or towns
# shared with the Republic of Cyprus's tree (P17 Q229 and Q23681), whose en
# articles describe the town, not the TRNC municipality, and four of which
# already name the Republic's displaced mayoralty under `P1313`. The mayors
# are listed one by one instead, as in `jm.yml`.

