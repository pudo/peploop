# Offices the state has whether or not a seeded person's article named them.
# Bodies are from the 2026-10-01 measurement (research/position_items.md §10).
# No `source` is given: none has been checked, and a source is what lets a
# one-seat office pass on a single current holder, so it is never guessed.
# Central Committee membership is absent on purpose: it is recorded as P463 on
# the body, not as a seat.

- key: politburo_member
  class: political.parties
  archetype: politburo_member
  body: Q371402            # Partido Comunista de Cuba (no standing Politburo item)
  labels:
    es: miembro del Buró Político del Partido Comunista de Cuba
    en: member of the Politburo of the Communist Party of Cuba

- key: second_secretary
  class: political.parties
  archetype: party_secretary
  body: Q30914590          # Comité Central del PCC
  labels:
    es: Segundo Secretario del Comité Central del Partido Comunista de Cuba
    en: Second Secretary of the Central Committee of the Communist Party of Cuba

- key: council_of_state_member
  class: oversight.state_councils
  archetype: state_body_member
  body: Q1516390           # Consejo de Estado
  labels:
    es: miembro del Consejo de Estado de Cuba
    en: member of the Council of State of Cuba

- key: supreme_court_president
  class: judiciary.apex
  archetype: court_president
  body: Q7644899           # Tribunal Supremo Popular
  labels:
    es: Presidente del Tribunal Supremo Popular
    en: President of the People's Supreme Court of Cuba

- key: prosecutor_general
  class: judiciary.prosecution
  archetype: prosecutor_general
  labels:
    es: Fiscal General de la República de Cuba
    en: Attorney General of Cuba

- key: chief_of_general_staff
  class: security.defence_command
  archetype: military_chief_of_staff
  body: Q663472            # Fuerzas Armadas Revolucionarias (no General Staff item)
  labels:
    es: Jefe del Estado Mayor General de las Fuerzas Armadas Revolucionarias
    en: Chief of the General Staff of the Revolutionary Armed Forces

- key: comptroller_general
  class: oversight.audit_anticorruption
  archetype: agency_head
  body: Q25408126          # Contraloría General de la República
  labels:
    es: Contralor General de la República de Cuba
    en: Comptroller General of Cuba

- key: gaesa_president
  class: economic.soe_leadership
  archetype: soe_head
  body: Q113204847         # GAESA
  labels:
    es: Presidente Ejecutivo de GAESA
    en: Executive President of GAESA

- key: provincial_governor
  class: subnational.executive
  archetype: governor
  per: subdivisions
  exclude:
    - Q115027              # Isla de la Juventud: a special municipality, no governor
  labels:
    es: Gobernador de la {Name}
    en: Governor of {name}
