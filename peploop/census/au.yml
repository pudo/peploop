# Offices Australia has whether or not a seeded person's article named them.
# Bodies are from the 2026-10-12 live measurement (wbsearchentities in en, the
# items read); nothing below is from memory.
#
# Not here because an item exists and the load reaches it: the Governor-General,
# the six governors and their lieutenants, the Administrator of the Northern
# Territory, the premiers, chief ministers and their deputies, every chief
# justice, the Supreme Court seats of NSW (`Q66085196`), Victoria
# (`Q56060731`), South Australia (`Q50400750`), Western Australia
# (`Q105416350`), the ACT (`Q56050823`) and the Northern Territory
# (`Q52178330`), the District Court seats of NSW (`Q108395556`) and South
# Australia (`Q51601370`), the auditors-general of NSW and Victoria, the
# solicitors-general, and the police commissioners of Victoria (`Q20751425`)
# and Queensland (`Q141344330`).
#
# Each state body's office names its state under `jurisdiction`: the District
# Court of Queensland and two of the commissions carry no `P1001` of their own.
#
# A state Supreme Court seat takes `supreme_judge`: the six existing ones
# subclass supreme court judge (`Q117826617`).
#
# Absent and not listed, for want of a body item: the state auditors-general
# outside NSW and Victoria, the state DPPs, NSW's ICAC and the state
# ombudsmen.
#
# The two `per: units` entries are the local level: a mayoralty and a council
# seat for every current local government area (`Q1867183`), built by
# `mint_units` from each area's own article. Every state's set is below half
# covered, so each needs the level source: en.wikipedia's "Local government in
# Australia", which reads "Council members are generally known as councillors,
# and the head of a council is called the mayor, chairman or shire president."

