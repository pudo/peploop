# The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
# unit of 50,000 or more (`amlr.units`) that has no head office gets one from
# `mint_units`, attested by the unit's own current P6 or its article's infobox.
# Every Czech municipality of 50,000 is a statutory city, headed by a primátor;
# 3 of the 4 existing head offices subclass mayor in the Czech Republic.
- key: amlr_municipal_head
  class: subnational.municipal
  archetype: mayor
  per: units
  of: amlr:municipal
  lang: cs
  title: primátor
  labels:
    cs: "{title} města {name}"
    en: "Mayor of {name}"
  parent: Q64421048                # mayor in the Czech Republic (primátor)
  sources:
    "*": https://cs.wikipedia.org/wiki/Primátor
