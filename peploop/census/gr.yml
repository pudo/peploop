# The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
# unit of 50,000 or more (`amlr.units`) that has no head office gets one from
# `mint_units`, attested by the unit's own current P6 or its article's infobox.
# Of 9 existing Greek mayoralties, the plurality subclass mayor itself.
- key: amlr_municipal_head
  class: subnational.municipal
  archetype: mayor
  per: units
  of: amlr:municipal
  lang: el
  title: δήμαρχος
  labels:
    el: "Δήμαρχος {name}"          # "Δήμος Καλαμάτας" → "Δήμαρχος Καλαμάτας"
    en: "Mayor of {name}"
  forms:
    el: [["^Δήμος ", ""]]
    en: [["\\s+[Mm]unicipality$", ""], ["^Municipality of ", ""]]
  parent: Q30185                   # mayor
  sources:
    "*": https://en.wikipedia.org/wiki/Local_government_in_Greece
