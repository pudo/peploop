# The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
# unit of 50,000 or more (`amlr.units`) that has no head office gets one from
# `mint_units`, attested by the unit's own current P6 or its article's infobox.
# Parents measured 2026-10-24 over the level's existing head offices: Italian
# mayoralties subclass their region's "mayor of a place in X", the metropolitan
# mayors Sindaco metropolitano (11 of 17). Every province has its president.
- key: amlr_municipal_head
  class: subnational.municipal
  archetype: mayor
  per: units
  of: amlr:municipal
  lang: it
  title: sindaco
  labels:
    it: "sindaco di {name}"
    en: "Mayor of {name}"
  parent: Q670106                  # mayor of a place in Italy
  parents:                         # per region
    Q1284: Q99292222               # Abruzzo
    Q1452: Q99384937               # Basilicata
    Q1458: Q99299770               # Calabria
    Q1438: Q98961042               # Campania
    Q1263: Q99320698               # Emilia-Romagna
    Q1250: Q99384959               # Friuli Venezia Giulia
    Q1282: Q99022939               # Lazio
    Q1256: Q99384998               # Liguria
    Q1210: Q98960787               # Lombardy
    Q1279: Q99019621               # Marche
    Q1443: Q99384980               # Molise
    Q1216: Q99293173               # Piedmont
    Q1447: Q99292429               # Apulia
    Q1462: Q99325184               # Sardinia
    Q1460: Q99020470               # Sicily
    Q1273: Q98960648               # Tuscany
    Q1237: Q100819564              # Trentino-South Tyrol
    Q1280: Q99386323               # Umbria
    Q1222: Q99385014               # Aosta Valley
    Q1243: Q99292889               # Veneto
  sources:
    "*": https://it.wikipedia.org/wiki/Sindaco_(Italia)

