# Offices Malta has whether or not a seeded person's article named them.
# Bodies are from the 2026-10-14 live measurement (wbsearchentities and
# full-text search with `haswbstatement:P17=Q233`, en.wikipedia titles resolved
# to their items, then P31, P17, P1001, P361 read in full); nothing below is
# from memory. An entry with no body is one where no item for the institution
# was found under any of those searches.
#
# Not here because an item exists and the load reaches it: the President
# `Q796593`, Prime Minister `Q152814`, Deputy Prime Minister `Q5261066`, the
# portfolio ministers (Minister for Gozo `Q108265813` among them), the House
# member `Q19367406` (and its 13th-term child `Q37857097`), the Speaker
# `Q7574273`, the Leader of the Opposition `Q6508543`, the Chief Justice
# `Q5096791`, the Central Bank governor `Q109689944`, the AFM commander
# `Q60539022`, the archbishop `Q105104342`, auxiliary bishop `Q136783024` and
# bishop of Gozo `Q105104423`. The Deputy Speaker `Q5261084` and the PM's chief
# of staff `Q104843496` exist with no `P17`, which the descent does not reach;
# that is a peptree repair, not a creation.
#
# `Q56279882` "Commissioner of Police" (described as Maltese, `P31` public
# office, no `P17`) has one holder, a Nigerian police officer: it is not used
# as Malta's office, so the commissionership is listed below; the guard's
# duplicate search will see it.
#
# Not listed: the parliamentary secretaries, which are per portfolio and have
# no generic item to anchor on (the person lane mints the ones named); outbound
# ambassadors (six items, the person lane); the Security Service, Asset
# Recovery Bureau and Community Malta Agency (no body item, and nothing to
# measure a holder by).
#
# The regional presidents and the local council mayors are the sub-national
# level. `per: subdivisions` reads Q233's P150, the six regions of 2021
# (Gozo, Northern, Southern, Port, Western, Eastern); en.wikipedia's "Regions
# of Malta" (a redirect to "Districts of Malta") reads "Each region has a
# Regional Council (Maltese: Kunsill Reġjonali), which consists of a Regional
# President, a Deputy President, an Executive Secretary and between 10 and 12
# members." No regional council has an item.
#
# `lc_mayor` is the 68 local councils. No council has a mayor item (the six
# Maltese mayors on Wikidata hold generic `Q30185`), so every region is below
# half and needs the level source: en.wikipedia's "List of mayors of places in
# Malta", "List of mayors in every locality of Malta from 1993, when the
# election of local councils was introduced." The unit articles name their
# mayor in the infobox (`• Mayor: Olaf McKay (PL)`; 14 of 15 sampled matched
# `mint_units.head_of`, Iklin's did not). Only 15 of the 68 localities are typed
# `Q719592` (local council of Malta), the rest town, village or city, so the
# units are the six regions' `P150`, which list exactly the 68.

# --- Executive: the head of the civil service ---
- key: principal_permanent_secretary
  class: executive.leader_office
  archetype: agency_head
  # No body: no item for the Office of the Prime Minister was found.
  labels:
    en: Principal Permanent Secretary of Malta

