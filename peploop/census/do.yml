# --- Provincial governors ---
# Q786's P150 is 31 provinces and the Distrito Nacional, none ended, none
# carrying P576; no governorship item exists for any of them. The Distrito
# Nacional has no governor (its executive is the mayor of the Ayuntamiento del
# Distrito Nacional). Five es province labels carry "Provincia" or a
# disambiguator ("Provincia de Santiago (República Dominicana)"), so the es
# template below reads badly for those; the draft's own label wins where
# categorize gives one.
- key: provincial_governor
  class: subnational.executive
  archetype: governor
  per: subdivisions
  exclude:
    - Q2499228             # Distrito Nacional
  labels:
    es: Gobernador provincial de {name}
    en: Governor of {name}
