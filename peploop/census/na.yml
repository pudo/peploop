# Offices Namibia has whether or not a seeded person's article named them.
# Bodies are from the 2026-10-16 live measurement (wbsearchentities, the
# items read); nothing below is from memory.
#
# Not here because an item exists and the load reaches it: the President
# `Q647198`, Vice-President `Q19901597`, Prime Minister `Q1333976` and deputy
# `Q88776855`, the portfolio ministers (`Q1103949xx`, `Q1103950xx`), the
# Speaker `Q110395511` and the National Council's president `Q110395528`,
# the Attorney General `Q29316605`, the Chief of the Defence Force
# `Q55607330` and the Governor of the Bank of Namibia `Q5589738`.
#
# Absent and not listed: the Namibian Police, the Anti-Corruption
# Commission, the Office of the Auditor-General, the Prosecutor-General's
# office and the Ombudsman have no items; their heads are listed without a
# body, since a minister's or judge's article often names them.
#
# The fourteen regions are each headed by a governor the President appoints;
# two of them (Oshikoto among them) have an office item: a `per:
# subdivisions` entry over the rest.

# --- Sub-national: regional governors ---
- key: regional_governor
  class: subnational.executive
  archetype: governor
  per: subdivisions
  source: https://en.wikipedia.org/wiki/Regions_of_Namibia
  labels:
    en: Governor of {name}

# --- Judiciary: Supreme and High Courts ---
- key: chief_justice
  class: judiciary.apex
  archetype: court_president
  body: Q1408827           # Supreme Court of Namibia, P31 supreme court, P17 Q1030
  labels:
    en: Chief Justice of Namibia

- key: supreme_court_judge
  class: judiciary.apex
  archetype: supreme_judge
  body: Q1408827
  labels:
    en: Judge of the Supreme Court of Namibia

- key: high_court_judge
  class: judiciary.specialised
  archetype: judge
  body: Q1617731           # High Court of Namibia, P17 Q1030
  labels:
    en: Judge of the High Court of Namibia

- key: judge_president
  class: judiciary.specialised
  archetype: court_president
  body: Q1617731
  labels:
    en: Judge President of the High Court of Namibia

