# The head offices of the EU AMLR levels (Reg. 2024/1624, Art. 2(34)(viii)): every
# unit of 50,000 or more (`amlr.units`) that has no head office gets one from
# `mint_units`, attested by the unit's own current P6 or its article's infobox.
# A Latvian municipality is led by its council's chair; the existing head
# offices subclass mayor. The forms put the unit in the genitive.
- key: amlr_municipal_head
  class: subnational.municipal
  archetype: mayor
  per: units
  of: amlr:municipal
  lang: lv
  title: domes priekšsēdētājs
  labels:
    lv: "{name} domes priekšsēdētājs"
    en: "Mayor of {name}"
  forms:
    lv: [["a$", "as"], ["novads$", "novada"]]
  parent: Q30185                   # mayor
  sources:
    "*": https://en.wikipedia.org/wiki/Municipalities_of_Latvia
