- key: central_bank
  label: central bank governor / board
  level: national
  classes:
    - {qid: Q107363151, label: central bank governor, direct: 134, direct_cc: 130, transitive: 134, transitive_cc: 130, national: 22}
  body_classes:
    - {qid: Q66344, label: central bank, bodies: 265, with_p17: 264, cc: 244, with_head: 143}
  notes: >
    The cleanest category: one class, one item per country, and 129 of the offices
    linked to central-bank bodies use it. But only 26/134 carry P1001 at all — a repair
    lane, not a fill lane. No class exists for deputy governor / board member
    (Q5261033 deputy governor is generic, 14 items, 5 countries) — board is unsettled.
  unsettled_board: true

