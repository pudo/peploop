- key: military_chief
  label: chief of defence / armed forces commanders
  level: national
  classes:
    - {qid: Q5097014, label: chief of defence, direct: 55, direct_cc: 42, transitive: 55, transitive_cc: 42, national: 26}
    - {qid: Q707492, label: Chief of Staff (military position), direct: 41, direct_cc: 20, transitive: 104, transitive_cc: 57, national: 48}
    - {qid: Q380782, label: commander-in-chief, direct: 63, direct_cc: 32, transitive: 72, transitive_cc: 40}
    - {qid: Q2257775, label: chief of army staff position, direct: 7, direct_cc: 7}
  never_walk_up_to:
    - {qid: Q112119463, label: chief of staff (civil), direct: 10, direct_cc: 4, transitive: 114, transitive_cc: 58}
  body_classes:
    - {qid: Q772547, label: armed forces, bodies: 5570, with_p17: 1680, cc: 289, with_head: 39}
    - {qid: Q8473, label: military, bodies: 7278, with_p17: 2992, cc: 456, with_head: 87}
  notes: >
    Canonical is Q5097014 chief of defence, which is P279 of Q707492 (military chief of
    staff); Q707492 adds service chiefs (army/navy/air force). Q707492 is itself P279 of
    Q112119463 (civil chief of staff), so a P279* walk from Q112119463 pulls in every
    military chief, and one from the military side must stop at Q707492. Q112119463's
    own direct children are presidential/PM/ministerial chiefs of staff — senior
    executive staff, adjacent to head_of_state/government, not a FATF category.
    Service commanders ("Commander of the Navy" etc.) are mostly unclassed.

