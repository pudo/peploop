- key: ambassador
  label: ambassador
  level: national
  classes:
    - {qid: Q29645880, label: ambassador of a country, direct: 207, direct_cc: 202, transitive: 6058, transitive_cc: 290}
    - {qid: Q121998, label: ambassador, direct: 70, direct_cc: 18, transitive: 6669, transitive_cc: 297}
    - {qid: Q29645886, label: ambassador to a country, transitive: 6000}
    - {qid: Q7888495, label: Permanent Representative to the United Nations, transitive: 135}
    - {qid: Q123695, label: high commissioner, transitive: 121}
  exclude:
    - {qid: Q740369, label: papal legate, transitive: 229}
    - {qid: Q5583669, label: goodwill ambassador, transitive: 17}
  body_classes:
    - {qid: Q3917681, label: embassy, bodies: 9331, with_p17: 9330, cc: 243, with_head: 4225}
  notes: >
    Shape: per-sender "ambassador of X" item (P279 Q29645880, one per country) is the
    parent of per-pair "ambassador of X to Y" items. The sending state is the PEP's
    country; P1001/P17 on pair items often point at the receiving state, so scope by
    the "ambassador of X" parent, not by P17. Embassies are well linked (45% have P2388).

