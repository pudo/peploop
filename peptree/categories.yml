# FATF PEP categories and the Wikidata classes that identify them.
#
# Wikidata's type hierarchy is polluted and will stay that way: mayor sits under
# head of government (98% of its subtree), community councillor under member of
# parliament, counselor under minister. So a category is never "everything below
# class X". It is a set of class handles, the subtrees known to pollute them
# (`exclude`), and the bodies an office of the category sits in. The level
# (national vs subnational) comes from the office's jurisdiction or its body,
# never from the class.
#
# This file is meant to be edited as runs teach us: add an exclude when a run
# finds a polluting subtree, and add a class when one turns out to be in use.
# `unsettled: true` marks a category with no usable class yet; its offices are
# found from the bodies (`body_classes`) instead.
#
# Counts were measured on WDQS on 2026-10-04 and are only evidence for the
# choice of class; they drift.
#   direct / transitive: position items with the class in P279 directly / via P279+
#   *_cc: distinct P17 values on those items (historical states included, so >195 is normal)
#   national: subtree items whose P1001 is a country, sovereign state or historical country
#   bodies / with_p17 / with_head: items of the body class / with P17 / carrying P2388
- key: head_of_state
  label: head of state
  level: national
  classes:
    - {qid: Q48352, label: head of state, direct: 353, direct_cc: 214, transitive: 1868, transitive_cc: 548, national: 610}
    - {qid: Q30461, label: president, direct: 186, direct_cc: 109, transitive: 581, transitive_cc: 199}
    - {qid: Q116, label: monarch, direct: 259, direct_cc: 176, transitive: 827, transitive_cc: 325}
    - {qid: Q2304859, label: sovereign, direct: 43, direct_cc: 34, transitive: 902, transitive_cc: 342}
  exclude:
    - {qid: Q1540324, label: head of the region (Russia), transitive: 38}
    - {qid: Q3537705, label: Indian state governor, transitive: 30}
  body_classes: []   # the state itself (P1001); no body
  notes: >
    Q48352 subtree mixes national with subnational heads (Russian regions, Indian
    governors) and medieval monarchies; only 610/1868 have a national P1001.
    Q112119463 civil chief of staff (head of presidential administration, e.g. White
    House Chief of Staff) is adjacent, not this category — see `notes` on military.

- key: head_of_government
  label: head of government
  level: national
  classes:
    - {qid: Q2285706, label: head of government, direct: 344, direct_cc: 137, transitive: 58512, transitive_cc: 312}
    - {qid: Q14212, label: prime minister, direct: 237, direct_cc: 197, transitive: 245, transitive_cc: 198, national: 195}
    - {qid: Q959664, label: premier, transitive: 37}
  exclude:
    - {qid: Q30185, label: mayor, transitive: 57431}
    - {qid: Q59512604, label: chair of local government, transitive: 137}
    - {qid: Q6508517, label: leader of the council, transitive: 56}
  body_classes:
    - {qid: Q640506, label: cabinet, bodies: 6915, with_p17: 4656, cc: 235, with_head: 48}
  notes: >
    Never walk Q2285706 transitively without excluding mayor: 98% of its subtree is
    mayoralties. Also under it: chief minister, state/province governors (Nigeria,
    Mexico, Brazil, Argentina), minister-president — subnational. Q14212 is the clean
    national handle.

- key: minister
  label: minister (incl. deputy)
  level: national
  classes:
    - {qid: Q83307, label: minister, direct: 5230, direct_cc: 230, transitive: 9134, transitive_cc: 294, national: 7241}
    - {qid: Q26204040, label: deputy minister, direct: 149, direct_cc: 36, transitive: 162, transitive_cc: 36, national: 115}
    - {qid: Q2632935, label: minister of state, direct: 39, direct_cc: 24, transitive: 196, transitive_cc: 25}
    - {qid: Q877955, label: deputy prime minister, direct: 114, direct_cc: 83, transitive: 125, transitive_cc: 83}
  exclude:
    - {qid: Q15966511, label: State Minister (German Länder), direct: 13, transitive: 16}
  body_classes:
    - {qid: Q192350, label: ministry, bodies: 8310, with_p17: 7790, cc: 307, with_head: 3500}
  notes: >
    The best-populated category. Portfolio classes sit under Q83307 (foreign 264,
    finance 236, education 208, defence 149 ...). Q14212 prime minister is ALSO under
    Q83307, and Q5783638 "counselor" (364) is too — check it before trusting the
    subtree. Q15966511 (hint) is German *Land* ministers: subnational, not a minister
    class to scope on. ~1,300 subtree items are subnational by P1001.

- key: legislator
  label: member of national legislature
  level: national
  classes:
    - {qid: Q486839, label: member of parliament, direct: 567, direct_cc: 250, transitive: 3722, transitive_cc: 293, national: 875}
    - {qid: Q4175034, label: legislator, direct: 306, direct_cc: 65, transitive: 4929, transitive_cc: 306, national: 930}
    - {qid: Q15686806, label: senator, direct: 96, direct_cc: 64, transitive: 298, transitive_cc: 68}
    - {qid: Q1055894, label: deputy, direct: 198, direct_cc: 57, transitive: 461, transitive_cc: 62}
  exclude:
    - {qid: Q55400987, label: community councillor, transitive: 1290}
    - {qid: Q5230427, label: member of legislative assembly, transitive: 698, note: mostly Indian/Malaysian/Australian state assemblies}
    - {qid: Q106088317, label: state legislator of the United States, transitive: 117}
  body_classes:
    - {qid: Q11204, label: legislature, bodies: 15604, with_p17: 13027, cc: 425, with_head: 423}
    - {qid: Q35749, label: parliament, bodies: 2664, with_p17: 2480, cc: 360, with_head: 218}
    - {qid: Q375928, label: lower house, bodies: 258, with_p17: 236, cc: 113, with_head: 103}
    - {qid: Q637846, label: upper house, bodies: 266, with_p17: 232, cc: 131, with_head: 64}
  notes: >
    Class alone cannot tell national from subnational: only ~24% of the MP subtree has a
    national P1001. National level must come from the body (P361 -> a national
    legislature / chamber with P1001 = the state), not from P279. Q486839 is the
    canonical parent (250 countries direct). Q4175034 is its parent.

- key: apex_judge
  label: supreme / constitutional court judge
  level: national
  classes:
    - {qid: Q117826617, label: supreme court judge, direct: 63, direct_cc: 16, transitive: 218, transitive_cc: 62, national: 83}
    - {qid: Q55736868, label: national supreme court judge, direct: 14, direct_cc: 11, transitive: 154, transitive_cc: 57, note: subclass of Q117826617}
    - {qid: Q135398920, label: constitutional court judge, direct: 13, direct_cc: 10, transitive: 15, transitive_cc: 10}
    - {qid: Q3188089, label: chief justice, direct: 136, direct_cc: 53, transitive: 136, transitive_cc: 53}
  body_classes:
    - {qid: Q190752, label: supreme court, bodies: 452, with_p17: 438, cc: 211, with_head: 88}
    - {qid: Q32766, label: constitutional court, bodies: 119, with_p17: 116, cc: 88, with_head: 14}
  notes: >
    Offices linked to supreme-court bodies use chief justice (57) more than supreme
    court judge (27) or national supreme court judge (13); 10 use bare Q16533 judge and 3
