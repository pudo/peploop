    Q55736868 or the body's P1001 for national. Q135398920 is new and thin
    (Q135399028, its sibling, 6 items, unlabelled in en).

- key: prosecutor_general
  label: prosecutor general
  level: national
  classes:
    - {qid: Q3368517, label: public prosecutor general, direct: 32, direct_cc: 26, transitive: 197, transitive_cc: 79, national: 73}
    - {qid: Q1501926, label: attorney general, direct: 109, direct_cc: 53, transitive: 159, transitive_cc: 53, note: subclass of Q3368517}
  body_classes:
    - {qid: Q1092499, label: public prosecutor's office, bodies: 1412, with_p17: 1322, cc: 229, with_head: 160}
    - {qid: Q11775750, label: public prosecutor's office (type of government org), bodies: 1203, with_p17: 1129, cc: 226, with_head: 136}
